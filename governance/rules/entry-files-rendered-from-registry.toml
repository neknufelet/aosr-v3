# 規矩卡：入口檔的規矩節由登記簿生成，手改即紅；AGENTS.md 是指路牌、內容等於卡上登記的那一段；
#         生成段不准留佔位；全檔有行數上限
# 決策紙：docs/decisions/rules-section-generated-rest-handwritten.md（這張紙就是規格），
#         加上 docs/decisions/entry-file-line-cap-120.md（2026-09-10 老闆把行數上限改小）。
#
# 2026-09-10 老闆改了兩件事，這張卡跟著改：①AGENTS.md 不再是原稿的逐字副本，改成指路牌
# （理由與代價寫在 [settings] pointer_text 上面）；②全檔行數上限改小（那張新的紙）。
# 照實記一件事：第一張紙的原文寫的是「CLAUDE.md 與 AGENTS.md 的規矩節由卡片生成」，
# 那句話在指路牌這一版只對原稿成立。這一版沒有另寫一張紙去改它（這個 PR 被交代不加 docs，
# 只補了行數上限那一張），所以現況跟那張紙的那一句不一致，記在這裡，等老闆決定要不要補紙。
#
# 這一版刻意比 blueprint/cards-38.json 的原規格窄。原規格還要求「凍結橫幅涵蓋範圍」、
# 「提交類型清單」、「習慣條目必帶『沒有機器在守』標記」、「欄位走白名單只准兩類內容」，
# 那四樣在今天的登記簿與入口檔裡都沒有對象（cards-38.json 的 defer_reason 寫的就是這件事）。
# 沒有對象的規則是只會回綠的規則，所以這張卡只立「今天弄得壞」的那幾條，其餘留給別張卡：
#   no-model-names-in-entry-files 手寫段不准出現模型名與額度（已立）
#   doc-frontmatter-and-dates     docs 的份數上限，加上「每一行多寬」（連入口檔一起量，已立）
#
# 2026-09-10 老闆拍板：暫緩卡 derived-content-rendered-not-handwritten 不另立，它沒人守的
# 那顆牙——「生成物不准留著沒填完的佔位」——併進這張卡的第⑤條
# （見 blueprint/cards-38.json 那張卡的 feasibility_v2 = "merged"）。那張卡另外三句不併：
# 「文件裡宣稱的設定值要跟實際設定檔一致」與「附錄追加後前言計數要同步」今天沒有對象
# （沒有那種宣稱、沒有那種計數慣例），「跨檔引用的段落必須由生成器產生而不是手抄」則已經
# 被這張卡的第①條蓋住（規矩節就是唯一那個跨檔引用的段落，它必須等於重生結果）。
# 同一張卡的精神還進了產生器：一張卡只渲染人話的第一句——衍生內容的形狀由生成器決定，
# 不由卡的作者寫多長決定（見 governance/render_entry.py 的 first_sentence）。
id = "entry-files-rendered-from-registry"
human = "入口檔的規矩節由登記簿生成，不是手寫的：標記之間的內容必須等於用 `governance/rules/` 底下每一張卡重生一次的結果，手改即紅、加了卡沒重生也紅；標記缺一個、多一個、或前後顛倒即紅（界線量不出來就不知道哪一段是產物）；卡宣告的每一份入口檔都要在，而且第二份起是**指路牌**——內容必須逐字等於卡上登記的 `pointer_text`，多一字少一字都紅（規矩與手寫段只住在原稿裡，指路牌只負責把人指去原稿）；標記之間出現卡上 `placeholder_markers` 列的那幾種佔位字樣即紅，標記外面的手寫段不管（那是人的地方）；任何一份的行數超過這張卡登記的上限即紅——歷史往決策紙與知識區沉，不往入口檔堆。佔位那一條不是被「等於重生結果」蓋住的：佔位字樣要是寫在某張卡的 `human` 裡，重生出來的那一段本來就帶著它，逐字比對照樣回綠——這一條咬的是「產物還沒填完就進版控」，來源在卡上也一樣咬。一張卡只渲染人話的第一句（切點是句號），所以規矩節那一段有多寬由產生器決定，不由卡的作者寫多長決定；代價寫在卡的註解裡。入口檔清單、行數上限、佔位字樣清單與指路牌文本只寫在這張卡的 `[settings]`，檢查程式沒有預設值；讀不到那一段、某張卡讀不出人話或掛載點、掃描面上一張卡都沒有，一律回 2 不回 0。"

# 掃描面：卡上宣告的每一份入口檔，加上掃描根底下每一張卡（規矩節就是從它們渲染出來的，
# 它們是這一段內容的來源，不是旁證）。入口檔清單同時寫在 [settings].entry_files
# ——那邊是給程式讀的，這邊是宣告掃描面；兩邊不一致會被 scan-scope-has-no-holes 咬。
scope = [
  "CLAUDE.md",
  "AGENTS.md",
  "governance/rules",
]
check = "governance/checks/entry_files_rendered_from_registry.py"
negative_fixture = "governance/fixtures/entry-files-rendered-from-registry"
control_fixture = "governance/fixtures/entry-files-rendered-from-registry/control"
declared_level = "blocking"
enforcer = "github-actions-job"
job = "verify"
external_tools = ["git"]

# 血債：governance-file-has-no-guard（v2-audit/lessons.json，legacy_id L06）。
# 這筆的 v3_countermeasure 幾乎逐字寫了這道閘：「入口檔由生成器從單一來源產出，CI 做
# regenerate-diff、手改生成檔即紅；生成檔行數硬上限在生成器內 fail 而非警告」。
# 事故當下入口檔一路長到四百多行（那筆事故自己附了 `git show <sha>:CLAUDE.md | wc -l`
# 的序列當證據），行數那一條在當下就會回紅，所以照載入器對血債的標準記在這裡。
#
# 照實記一件事：這張卡在 blueprint/cards-38.json 裡的 critic_v2.rounds 是 0
# ——找碴席沒對它開過席，lesson_bites 是未知不是 true。上面那個判斷是指揮照載入器的標準
# （「在事故當下會回紅」）自己下的，不是找碴席的結論。哪天開了席，這一欄照它的判斷改。
blood_debt = ["governance-file-has-no-guard"]
related_lessons = [
  "enforcer-declared-but-never-installed",
  "docs-volume-buries-the-design",
  "index-docs-recopy-facts-that-drift",
  "moved-files-leave-dead-references",
]
related_lessons_why = "兩筆都判「有關聯但這一版咬不到」。enforcer-declared-but-never-installed：那筆事故的本體是入口檔申報了一個沒裝的執行者（`.git/hooks` 只有樣板檔，入口檔卻寫「執行牙：pre-commit」），承接它的是原規格裡「習慣與知識條目 render 時必帶『沒有機器在守』標記」那一句——這一版沒立那一句（今天的入口檔裡沒有申報等級這種欄位，沒有對象），所以在事故當下不會回紅。它的另外半邊（兩份入口檔內容不同、其中一份只有一家工具看得到）這一版倒是咬得到，那也是這張卡要求「指路牌逐字等於卡上登記的那一段」的理由（2026-09-10 以前這一條寫的是「兩份逐字相同」）；只是事故現場的那一份根本沒進版控，掃描面碰不到。docs-volume-buries-the-design：形狀對得上（體積淹沒內容），但那筆事故量的是 docs/ 的份數（一千多份過程紀錄把設計埋掉），不是入口檔的行數；這一版只有入口檔的行數上限，數不到 docs/ 的份數，承接那筆的是 doc-frontmatter-and-dates（逐類與總量份數上限都在那張卡上，2026-09-10 連單行字元上限一起併過去了）。後面兩筆是 2026-09-10 併卡帶進來的（derived-content-rendered-not-handwritten 的 lesson_ids_v2 三筆，第一筆 governance-file-has-no-guard 本來就是這張卡的血債）：index-docs-recopy-facts-that-drift 的病是文件抄了會漂的事實（識別字、安裝狀態、「已完成／parked」這種時間點狀態句），這張卡只驗「那一段等於重生結果、裡面沒有沒填完的佔位」，驗不到「抄進來的那句話今天還對不對」——規矩節裡每一句都是從卡上重生的，所以那一段沒有手抄的餘地，但那是這一版的形狀給的，不是這條規矩量出來的；moved-files-leave-dead-references 的病是刪檔搬目錄之後死引用還活著，那由 refs-and-links-resolve 咬（它掃的是版控裡每一份文字檔的路徑 token），這張卡在那筆事故當下回 0。兩筆都只記關聯、不算血債。"

[mountpoint]
trigger = "pull_request，以及 push 到 main"
runs_on = "cloud-authority"
result_to = "GitHub Actions 的 verify job 結論"
blocks_merge = true

# ── 登記簿本身 ──────────────────────────────────────────────────────────────
# 入口檔清單與行數上限只寫在這裡，檢查程式沒有預設值（讀不到就回 2，不回 0）。
# 每一份必紅樣本底下也帶一份同樣形狀的 [settings]，因為每份樣本都是獨立的掃描根。
[settings]
# 有序清單：第一個是原稿（手寫段與規矩節住在它裡面），其餘每一份是指路牌。
# 為什麼不讓兩份各寫一份手寫段：v2 的兩份入口檔內容不同，其中一份只服務一家工具、而且沒進
# 版控，於是「開工前讀哪裡」在兩份檔裡各自漂（事故 enforcer-declared-but-never-installed
# 的第②項、governance-file-has-no-guard 的「引用外部檔只有一家看得到於是手抄」）。
# 內容只有一個家就沒有漂的空間，要寫的也只有一個地方。
# 代價寫在卡面上：指路牌那一份手改會被重生蓋掉，它不是原稿。
entry_files = ["CLAUDE.md", "AGENTS.md"]
# 指路牌那幾份的固定內容（第③條）。多一字少一字都紅，重生就是把這一段寫下去。
# 2026-09-10 老闆拍板：AGENTS.md 不再是原稿的逐字副本，改成指路牌。
# 為什麼改：兩份長文各載入一次是雙倍的注意力，而第二份存在的唯一理由是讓另一家工具找得到
# 入口。要防的事沒變（v2 兩份入口檔內容不同、其中一份只有一家工具看得到，於是「開工前讀
# 哪裡」各自漂），防法從「兩份逐字相同」換成「指路牌逐字等於這一段」——內容只有一個家。
# 代價：另一家工具直接讀 AGENTS.md 的時候看不到規矩，它得跟著那一行去讀原稿。
pointer_text = '''
# 這個 repo 的入口檔是 CLAUDE.md

開工先讀 `CLAUDE.md`：規矩、座標、驗證指令、七條習慣都在那一份。這一份只是給其他家工具的指路牌，不放內容——它由 `uv run python -m governance.render_entry` 寫出來，手改會被重生蓋掉，也會被雲端 `verify` 擋下來。

本機一行跑完 `uv run pytest && uv run ruff check`；本機只是宣稱，雲端綠了才算數。
'''
# ── 一張卡只渲染第一句：代價 ──────────────────────────────────────────────
# 2026-09-10 把產生器改成一張卡只渲染人話的第一句（`governance/render_entry.py` 的
# first_sentence），理由是 doc-frontmatter-and-dates 的「單行字元上限」那顆牙也咬這兩份檔，
# 而整段渲染出來實測最長一行 1143 字元。兩條路（那顆牙對規矩節放行／渲染只取第一句）選了
# 後者：那一段是產物，形狀該由生成器決定。
# 代價兩件，照實記在這裡不遮：
#   ①入口檔裡看到的是摘要，不是規格全文。所以規矩節的開頭那一句明寫「整段住在卡上」，
#     而卡的路徑就印在同一句裡。
#   ②no-model-names-in-entry-files 掃的是入口檔的全文，它從此看不到卡的人話第二句以後
#     ——模型名寫在某張卡人話的後半段，不會再漂進入口檔（所以那張卡也咬不到）。
#     那張卡的掃描面是「每次開工都會載入的檔」，規矩卡不在裡面，本來就不是它的地盤；
#     真要守規矩卡的全文得另外一張卡，今天沒有對象就不先開。
# 全檔硬上限。決策紙原文：「全檔硬上限寫成登記簿常數；改上限要一張決策紙，不得為了讓某次
# 提交過而改。」登記簿就是卡，所以那個常數住在這一行。
# 這個數字不是量出來的，是決策紙拍的板；要改它就再寫一張紙，不要在這裡調。
# 2026-09-10 老闆把它從第一版那個數字改小，新的那張紙是
# docs/decisions/entry-file-line-cap-120.md（第一版寫完老闆就嫌囉嗦，上限要逼人留白，
# 不是給人填滿）。改完當天實跑：原稿五十行上下、指路牌不到十行。
max_lines = 120
# 生成段裡不准出現的佔位字樣（第⑤條）。比對是逐字、分大小寫的子字串比對，只看標記之間
# 那一段——標記外面是手寫段，人在草稿裡寫 TODO 是他自己的事，那一段不是產物。
# 名單是資料、住在卡上，不寫死在檢查程式：要放寬就改這一行、走 PR。
# 為什麼是這五種：`{{` 是樣板引擎沒渲染完的形狀（v2 事故 governance-file-has-no-guard
# 對到的候選規則就叫 no-unfilled-placeholder-in-output）；TODO／TBD／XXX 是人手填一半
# 的標記；`<填>` 是中文稿常用的那個。刻意不放 FIXME 那類「已知缺陷」的字樣：那是在講
# 程式有問題，不是在講這一段還沒填完，混進來會讓這條規矩變成兩件事。
placeholder_markers = ["{{", "TODO", "TBD", "XXX", "<填>"]
