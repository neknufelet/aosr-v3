# 規矩卡：文件裡的路徑與連結都要解析得到，不准指到 repo 外（收窄版，只留今天有對象的兩條）
id = "refs-and-links-resolve"
human = "文件裡的路徑與連結都要解析得到，也不准指到 repo 外。兩條：①版控的文字檔（副檔名由這張卡登記：md／toml／yaml／py／json；py 只看字串與註解、json 只看字串值，會跑的程式碼本身不看）裡形如 `目錄/…/檔名.副檔名` 的路徑 token，加上 md 的 markdown link 目標，都必須在 `git ls-files` 的集合裡解析得到——glob 算解析得到（`governance/checks/*.py` 有東西命中就過），markdown link 指到目錄也算（有檔住在那個前綴底下）；解不到就紅。②不准指到 repo 外：`../` 逃出樹、開頭是 `/` 的絕對路徑、開頭是 `~/` 的家目錄路徑，一律紅——這一條不去讀那些路徑，只判它的形狀。blueprint 底下只納入 `*.py` 而且收窄成：只解析 docstring 與註解（程式碼字串是執行期的事，不管），並且只認「長得像這一棵 repo 的相對路徑」的 token——前綴限 docs/、governance/、blueprint/、src/、tests/，副檔名限 .md、.py、.json、.toml（那批產生器／case 表的 docstring 與註解裡滿是上一代 donor 樹與示範性死路徑，不收窄乾淨樹當場紅）；blueprint 底下的 .json 是資料不是引用，整批扣掉。刻意要指到解析不到的東西（repo 外的備份座標、刻意不進版控的產出物、只活在必紅樣本樹裡的宣告檔、v2 事故現場的路徑、上一代原樣搬來的出處標註）住在卡頂層的 `[[by_design]]`：一筆一個 token、寫一句理由、沒有到期日，`cited_in` 寫死哪幾份檔准引它、各准幾處，兩個方向都守——名單外的檔引它就紅（登記一次不等於到處都能寫），名單裡的檔處數對不上也紅（多寫一次是新的同類、那一行拿掉了也要跟著改），登記的路徑在樹裡解析得到了也紅，這張卡自己不必列；只是暫時的才寫進 `[[settings.allow]]`，一條一個路徑、每條必須寫理由與到期日（過期即紅那一關由 exemptions-need-expiry 判），哪一份檔引它都放。兩種清單都是資料、放在這張卡裡，不寫死在檢查程式，要放寬就得改卡走 PR。沒有副檔名的裸目錄 token（`docs/`、`.github/`）不當引用看，錨點（`#小節`）與 http(s) 連結這一版不管。"

# 掃描面：版控裡的全樹（`git ls-files`，含未被忽略的未追蹤檔），扣掉四個前綴。
# 扣掉的理由寫在 [settings] 的 scan_exempt_prefixes 上面，一個一句。
scope = [
  # 一條一種文字檔，跟 [settings].text_suffixes 那份清單同一組（那邊是給程式讀的，
  # 這邊是宣告掃描面）。副檔名不在清單上的檔整份不掃，所以宣告也不准寫成整棵樹
  # ——寫成 "." 的話 .gitignore／.gitkeep／.txt／.lock 會變成「宣告了卻沒人看」的洞。
  "**/*.md",
  "**/*.toml",
  # 刻意沒有 .yaml 那一條：今天樹裡一份 .yaml 都沒有，而宣告一條命中零個的 glob 會被
  # 這張卡自己的第①條咬（路徑 token 在版控的列舉集合裡解析不到）。哪天有 .yaml 進來，
  # 它會被這支檢查掃到、而 scan-scope-has-no-holes 會咬「掃了沒宣告」，那時再補這一條。
  "**/*.yml",
  "**/*.py",
  "**/*.json",
  "!v2-audit",
  # blueprint 只納入 *.py（docstring 與註解，收窄判準見 human 與 [settings]）；.json 那批
  # （cards-38.json、schemas/ 底下的契約 schema 等）是資料不是引用，整批扣掉。
  # 寫 `**` 不是 `*`：實際扣掉的是 [settings].scan_exempt_suffixes 的 `blueprint:.json`
  # ——那一條在 blueprint 底下**任何深度**都生效，宣告寫成只命中一層的 `*` 會讓
  # `blueprint/schemas/*.json` 變成「宣告了卻沒人看」的洞（scan-scope-has-no-holes 咬的
  # 就是這個；2026-09-16 票 #316 加 schemas/ 時實測踩到）。
  "!blueprint/**/*.json",
  "!governance/fixtures",
  "!.claude",
]
check = "governance/checks/refs_and_links_resolve.py"
negative_fixture = "governance/fixtures/refs-and-links-resolve"
control_fixture = "governance/fixtures/refs-and-links-resolve/control"
tool_broken_fixture = "governance/fixtures/refs-and-links-resolve-tool-broken"
declared_level = "blocking"
enforcer = "github-actions-job"
job = "verify"
external_tools = ["git"]

# 血債：這筆事故自己的 v3_countermeasure 幾乎逐字寫了這道閘（「CI 全 tree path-reference
# linter：所有 tracked 文字檔中形如「目錄／…／檔名.副檔名」的 token 與 markdown link 必須解析到
# tracked 檔」），而事故當下 v2 的入口檔有兩個路徑 token 指著已被刪掉的檔（一支 py、一份
# md），這張卡在那個當下會回紅。
#
# 但要照實記一件事：`blueprint/cards-38.json` 的 critic_v2 對這筆判的是 lesson_bites =
# false，理由是那筆事故的 8 個子現象裡有 6 個落在這張卡的形狀外面——點記法的模組名
# （沒有斜線）、沒有副檔名的裸目錄、md 的小節錨點、從來沒進過 git 的草稿目錄。整體「咬不住」
# 是對的；「在事故當下會回紅」也是對的（靠剩下那 2 個）。載入器對血債的標準寫的是後者，
# 指揮據此把它記成血債，不改寫找碴席的判斷。漏掉的那 6 個要另外的卡（裸目錄與錨點各一條）。
blood_debt = ["moved-files-leave-dead-references"]

[mountpoint]
trigger = "pull_request，以及 push 到 main"
runs_on = "cloud-authority"
result_to = "GitHub Actions 的 verify job 結論"
blocks_merge = true

# 門檻、掃描面與放行清單只寫在這裡，不寫死在檢查程式（讀不到就回 2，不回 0）。
# 每一份必紅樣本底下也帶一份逐字複製的 [settings]，因為每份樣本都是獨立的掃描根。
[settings]
# 要掃哪些副檔名。列舉在這裡，不寫死在程式：多一種文字檔就改卡。
# 副檔名不在這張清單上的檔（.txt、.lock、.gitignore、.gitkeep）整份不掃。
text_suffixes = [".md", ".toml", ".yaml", ".yml", ".py", ".json"]
# 掃描面扣掉這些前綴，一個一句理由：
# v2-audit/    ——v2 的 66 筆事故資料。裡面到處是 v2 那棵樹當時的檔案位置，那些是**事故證據**
#                不是這棵樹的引用；掃它等於要求 v3 把 v2 的檔案重建出來。
# governance/fixtures/ ——必紅樣本是一棵棵獨立的迷你掃描根，餵進去時它們自己會被咬
#                （後設測試第 2、5 回）。從外層掃它們等於把刻意的壞樣本算成本樹的違規。
# .claude/     ——本機 agent 工具目錄，雲端 checkout 不會有；file-placement-allowlist 那張卡
#                已為同一個理由把它列進根層白名單。底下是各家工具自己的設定與工作樹副本。
#
# blueprint/ 不再整批扣掉：只扣 .json（見 scan_exempt_suffixes），*.py 收窄後納入。
scan_exempt_prefixes = [
  "v2-audit/",
  "governance/fixtures/",
  ".claude/",
]

# 某個前綴底下、只扣掉某一種副檔名（其餘副檔名照掃）。一條「前綴:副檔名」（用冒號分隔，
# 不用斜線——斜線加副檔名會長得像路徑 token，被這支檢查自己掃成死引用）。
# blueprint 底下的 dot-json ——那批 .json（cards-38.json 等）是候選規則／卡的規格資料，
#                 不是這棵樹的引用。blueprint 底下的 *.py 是產生器／case 表，docstring 與
#                 註解裡的引用要守（收窄判準見 human），所以只扣 dot-json、不整批扣掉
#                 blueprint/。
scan_exempt_suffixes = [
  "blueprint:.json",
]

# 刻意指到解析不到的東西住在卡頂層的 [[by_design]]，不是放行（#1014、#1154；老闆 2026-11-13 拍 B）。
# 一筆一個 token（照它在文件裡寫的樣子逐字比對），[by_design.cited_in] 寫死「哪幾份檔准引它、各准
# 幾處」，兩個方向都守：名單外的檔引它就紅（登記一次不等於到處都能寫），名單裡的檔處數對不上也紅
# （多一處是新的同類、零處是那一行拿掉了：資料要跟樹對得上）；登記的路徑在樹裡解析得到了也紅。
# 這張卡自己不必列——登記那一格就寫著它。沒有到期日：它們本來就該這樣。
# 只是「不判紅」——檢查程式不會去讀這些路徑，repo 外的更不會。
# 暫時的那一種才寫進 [settings] 底下的 [[settings.allow]]（帶 reason 與 expires，由
# exemptions-need-expiry 看到期，哪一份檔引它都放）；今天一筆都沒有。
#
# 寫理由的時候不要在理由裡寫路徑形狀的 token（要提決策紙就寫它的題目、或只寫到目錄那一層）：
# 這張卡自己也在掃描面上，理由裡的 token 解析不到就多一筆跟它要證的事無關的違規。實測踩過。

