# 規矩卡：密碼、金鑰、.env 一進版控就紅，歷史也要掃
#
# 這張卡的第一要求不是「掃得到金鑰」，是**咬得到 v2 那件事故的形狀**。事故原文（
# v2-audit/lessons.json 的 secrets-committed-and-never-scanned）自己寫著：
#
#   「09-06 S13 四檔 tracked、check-ignore exit 1、無 secret scan，S14 E05 假陰性」
#
# ——當時已經有一支通用 secret-scan，它對這個案例假陰性。洩漏物是低熵的樣板值密碼
# （容器的 POSTGRES_PASSWORD 是一個八位十六進位字串，跟公開樣板一模一樣；另一個 .env
# 檔裡是另一個八位十六進位字串），不是 AWS／GitHub 那種有固定前綴的格式金鑰。熵不夠、
# 沒有前綴，所以「看起來像金鑰嗎」這種判準天生看不到它。這張卡因此不靠熵、也不靠外部
# 工具的通用規則，而是三層各自咬一種形狀，其中第②層是專為那個形狀寫的。
id = "secrets-never-committed"
human = "密碼、金鑰、`.env` 一進版控就紅，現在的樹與**全部歷史**都要掃。三層。①存在性：進得了版控的 `.env` 與 `.env.*`（`.env.api`、`.env.local` 都算）一律紅，**不看內容**——v2 漏掉的就是這種檔，而且「裡面只是樣板值」正是當年放過它的理由。②賦值語境：掃到的文字裡形如 `名字=值`／`名字: 值`／`名字 = \"值\"`，名字帶到卡上登記的字樣（`PASSWORD`、`SECRET`、`TOKEN`、`API_KEY` 這些，完整清單在 `[settings]` 的 name_words），而值不是佔位符，就紅——**不管熵、不管長度、不管像不像金鑰**，這一層就是為 v2 那個八位十六進位樣板值寫的。佔位符只有三種：卡上登記的佔位字（`changeme`、`example`，比對值的字段）、卡上登記的包法（`${…}`、`<…>`），以及「整個值裡一個英數字元都沒有」（空值、`***` 這種）。③格式金鑰：卡上登記的已知前綴樣式（AWS 的 `AKIA…`、GitHub 的 `ghp_…`／`github_pat_…`、`sk-…`、PEM 的私鑰開頭）。三層都同時套在兩個集合上：`git ls-files` 的全集，以及 `git rev-list --objects --all` 走得到的**每一顆歷史 blob**——刪掉檔案不會讓歷史裡那一顆消失，所以歷史那一筆紅不掉，只能具名放行（主線 ruleset 不准改寫歷史）。**淺 clone 一律回 2**：`git rev-parse --is-shallow-repository` 是 true 就代表這一跑根本看不到舊提交，「掃過全歷史」是假話，所以 CI 的 checkout 必須帶 `fetch-depth: 0`。放行只有一種寫法——這張卡的 `[[settings.allow]]`，一條一個路徑前綴、必須寫理由與到期日；不掃的前綴（必紅樣本樹與本機工具目錄）走 `[settings]` 的 scan_exempt_prefixes，那是掃描面宣告、跟卡的 `scope` 對得上。讀不到這張卡的 `[settings]`、扣完前綴一個檔都不剩、拿不到歷史、或宣告檔的格式看不懂，一律回 2 不回 0。"

# 掃描面：版控裡的全集（`git ls-files`，含未被忽略的未追蹤檔），扣掉兩個前綴。
# 刻意不扣 v2-audit/ 與 blueprint/——那兩個目錄**要被讀**，只是裡面的命中由
# [[settings.allow]] 具名放行；扣掉它們等於卡面上看不出那裡有沒有被看過。
scope = [
  ".",
  # 必紅樣本樹是一棵棵獨立的迷你掃描根，裡面的假金鑰是刻意的壞樣本，由後設測試單獨餵。
  # 從外層掃它們等於把自己的樣本算成本樹的違規。
  "!governance/fixtures",
  # 本機 agent 工具目錄，雲端 checkout 不會有；底下是各家工具的設定與工作樹副本
  # （工作樹副本裡有上面那些樣本，掃了就會把樣本算兩次）。
  "!.claude",
  # 引擎樹。今天這張卡不看它：老闆 2026-09-11 拍板分兩步——第一步只把樹搬進來、
  # 所有規矩先說「這棵樹別看」，第二步一條一條放進去咬，紅了才知道是誰在叫。
  # 決定、每一條排除對應哪張票、代價（排除沒有到期日）都寫在決策紙
  # docs/decisions/engine-tree-lands-unwatched-then-rules-bite-one-by-one.md。
  # 這一條什麼時候拿掉由 issue #119 負責。已知拿掉的當下會紅的：第②層——引擎裡
  # 6 個名字帶 TOKEN 的字串常數（數字來自搬樹前的實查），那一層不管熵、不管長度。
  # 這張卡要格外小心：它是唯一同時掃全部歷史 blob 的卡，而主線不准改寫歷史，
  # 所以搬樹那個 PR 本身要先確認沒有真的機密跟著進來——排除的是掃描面，不是歷史。
  "!src",
]
check = "governance/checks/secrets_never_committed.py"
negative_fixture = "governance/fixtures/secrets-never-committed"
control_fixture = "governance/fixtures/secrets-never-committed/control"
tool_broken_fixture = "governance/fixtures/secrets-never-committed-tool-broken"
declared_level = "blocking"
enforcer = "github-actions-job"
job = "verify"
external_tools = ["git"]

# 血債：secrets-committed-and-never-scanned（v2-audit/lessons.json，legacy_id L43，
# 復發 2 次、嚴重度 4）。事故原文裡這一句就是①②兩層要咬的東西：
#
#   「09-06 S13 四檔 tracked、check-ignore exit 1、無 secret scan，S14 E05 假陰性」
#
# 四個 backend 的 .env 被 track（①一律紅，不看內容，四個檔四筆），裡面是低熵的樣板值密碼
# （②照賦值語境咬，不管熵）。找碴席（blueprint/cards-38.json 的 critic_v2）對這筆判
# lesson_bites = false，理由是「通用規則對低熵值天生盲」——那個判斷是對著卡面點名 gitleaks
# 的那一版寫的。這一版把那個判斷當成規格：不用通用工具，②層直接對著賦值語境判，
# 熵完全不看，所以在事故當下會回紅。指揮據此記成血債，並把找碴席原本的理由留在這裡，
# 不改寫它的判斷。
blood_debt = ["secrets-committed-and-never-scanned"]

# 這張卡擋不住這筆事故的哪幾半（照實寫，不要當成整筆關掉了）。
related_lessons = []
related_lessons_why = "血債那筆事故有四半這張卡碰不到。(1)「5432 綁 0.0.0.0（有 LAN 與 Tailscale）」與「.env.api 密碼與 DB 不同下次 up -d 必斷」——那是 compose 的埠綁定與設定一致性，對象是容器編排檔，這張卡只看「有沒有機密進版控」，不看綁到哪個介面、也不對照兩個檔的值一不一致；事故自己的對策把它列成另一條（compose lint 斷言埠只綁本機），那要等 compose 檔真的存在才立得起來。(2)「容器內 pg_hba trust 讓密碼測試全過」——量測工具自己錯了，那筆已經是另一起事故（measuring-tool-itself-was-wrong），歸 check-exit-code-honest 那一族，不是這張卡。(3)「上游樣板憑證用兩年沒人查」與「subtree 併入帶進 tracked 機密」——來源是外部倉庫的歷史，這張卡只掃自己這棵樹走得到的物件；哪天真的併進一段外來歷史，②③兩層會在那一刻咬到那些 blob，但「不准用 subtree 併入別人的歷史」本身是另一條規矩。(4)「歷史 blob 不輪替」——機器判得出「金鑰還在歷史裡」（這張卡就是這樣咬的），判不出「那把金鑰在外面被換掉了沒有」，輪替是 repo 外的動作，沒有任何檢查看得到。另外照實記一件事：GitHub 自己的 push protection 在 v2 的方案上不可用（事故原文已驗 `security_and_analysis: null`），所以那條路從一開始就不能當執行者，這張卡是唯一在崗的。"

[mountpoint]
trigger = "pull_request，以及 push 到 main"
runs_on = "cloud-authority"
result_to = "GitHub Actions 的 verify job 結論"
blocks_merge = true

# 名單、樣式與放行清單只寫在這裡，不寫死在檢查程式（讀不到就回 2，不回 0）。
# 每一份樣本底下也帶一份逐字複製的 [settings]，因為每份樣本都是獨立的掃描根。
#
# 為什麼不用 gitleaks（老闆問過，理由留在卡面）：
#   一、事故原文自己就寫著當時已經有一支通用 secret-scan，而它對這個案例假陰性。
#       換一個通用工具的名字不會改變「低熵樣板值沒有特徵可認」這件事。
#   二、引入外部二進位就多一個要釘版本的東西，而且本機沒裝的人跑起來一律回 2
#       ——每個開發者本機都紅，最容易被順手加一行把離開碼吞掉。
#   三、三層自寫的規則加起來已經覆蓋事故形狀（①②）與常見金鑰前綴（③），
#       而且判準全部在卡上、看得懂、改寬要走 PR。
#   將來要把 gitleaks 當第四層（補常見前綴清單的漏）再開票，不在這張卡裡。
[settings]
# ① 存在性：檔名（basename）命中這些樣式就紅，不看內容。fnmatch 比對。
# 刻意連 `.env.example` 都咬：這一層的價值就在「不看內容」，一旦開始分辨哪個是樣板，
# 就回到 v2 放過那四個檔的那條路上了。真的需要一份範本，取一個不從 .env 開頭的名字。
env_file_globs = [".env", ".env.*"]

# ② 賦值語境：名字裡帶到這些字樣（比對大寫，前後要是非英數字元的邊界）就當機密名。
# 這一層不看熵、不看長度——v2 那個八位十六進位的樣板值就是靠這一層咬到的。
name_words = [
  "PASSWORD",
  "PASSWD",
  "SECRET",
  "TOKEN",
  "API_KEY",
  "PRIVATE_KEY",
  "ACCESS_KEY",
]

# ② 佔位字：值切成英數字段之後，任一段等於這裡的字就當佔位符。
# `example` 這一條是已知的縫：值就是 example 的時候放過去是對的（那是範本），
# 但也讓「刻意把值取成以佔位字當一整段的名字」繞得過去。比對刻意收窄成「整段相等」
# 而不是子字串：佔位字後面直接接數字或字母（連成同一段）就不算佔位符，照樣紅。
placeholder_words = ["changeme", "example"]

# ② 佔位包法：值以第一格開頭、以第二格結尾就當佔位符（環境變數展開與角括號範本）。
# 「整個值裡一個英數字元都沒有」（空值、`***`、`---`）不寫在這裡，那是形狀不是名單。
placeholder_wrappers = [
  ["${", "}"],
  ["<", ">"],
]

# ③ 格式金鑰：已知前綴的樣式（Python 正則，比對整份文字）。
# 樣式本身刻意寫成正則而不是完整的假金鑰：這張卡的掃描面包含自己這張卡與那支檢查程式，
# 寫成完整字面值它會咬到自己。（`AKIA[0-9A-Z]{16}` 這一串不符合自己，因為 `[` 不在
# `[0-9A-Z]` 裡面。）長度刻意比真金鑰寬：必紅樣本裡的假金鑰要短到不會被版控平台的
# push protection 當成真的擋下來，所以樣式要連那種短的一起認。
#
# 每一條前綴都帶左邊界（前一個字元不准是英數字），因為前綴不夾邊界會誤咬字中間的巧合。
# 這不是想像出來的：立卡時實測，沒有左邊界的那一版把藍圖裡一條規則的 id 判成一把金鑰
# ——那個 id 裡有個英文字尾巴接上連字號，剛好把 OpenAI 那個兩字母前綴拼在字中間，
# 後面又跟著一長串小寫字母與連字號，長度也過關。那一筆本來會被放行清單摀住、
# 看起來像「放行有在用」，是收緊樣式之後才發現的。
key_patterns = [
  "(?<![A-Za-z0-9])AKIA[0-9A-Z]{16}",
  "(?<![A-Za-z0-9])ghp_[A-Za-z0-9]{16,}",
  "(?<![A-Za-z0-9])github_pat_[A-Za-z0-9_]{20,}",
  "(?<![A-Za-z0-9])sk-[A-Za-z0-9_-]{20,}",
  "-----BEGIN [A-Z ]*PRIVATE KEY-----",
]

# 掃描面扣掉這些前綴（不是放行，是「這裡不看」，跟卡的 scope 的 `!` 兩條一一對應）。
# 一個一句理由：
# governance/fixtures/ ——必紅樣本是獨立的迷你掃描根，裡面的假金鑰是刻意的，由後設測試單獨餵。
# .claude/             ——本機 agent 工具目錄，雲端 checkout 不會有；底下有工作樹副本，
#                        掃了會把同一批樣本算第二次。
# src/                 ——引擎樹。今天這張卡不看它，理由與解除的票號寫在上面 scope 那幾行。
scan_exempt_prefixes = [
  "governance/fixtures/",
  ".claude/",
  "src/",
]

# 明文放行：一條一個路徑前綴，命中的檔（含歷史 blob 記在那個前綴底下的）不判紅。
# 每條必須寫理由與到期日；「過期即紅」那一關由 exemptions-need-expiry 判。
# 跑完在 stderr 印哪幾條被用到、哪幾條沒被用到——放行清單長大這件事要看得見。
#
# 寫理由的時候不要在理由裡寫「目錄/檔名.副檔名」形狀的 token：refs-and-links-resolve
# 會把它當引用去解析，而每份必紅樣本都逐字複製這整段 [settings]，在樣本那棵迷你樹裡解析不到。
# 照實記兩件事，不要讓這兩條看起來比實際上更有用：
#
# 一、**今天這兩條都沒有對象**（立卡時實測，跑完的 NOTE 也會這樣印）。事故原文裡那兩個
#    八位十六進位的密碼值與那個密碼名字，在轉述時沒有排成賦值的形狀，第②層咬不到；
#    藍圖那邊同理。它們留著是因為那兩個目錄**不准改**，而規格要求它們被讀：哪天有人把
#    事故原文引得更完整、或藍圖多寫一句示範，命中的當下唯一的出路就是這條放行，而那時
#    去改事故資料才是真正錯的事。到期時回頭看還需不需要。
#
# 二、立卡時本來有一條「用到了」——但那是第③層的樣式沒夾左邊界、把藍圖裡一個規則 id
#    誤咬成金鑰，放行清單把那個誤咬摀住了。收緊樣式之後那一筆消失。**放行會讓自己的尺
#    壞掉這件事看不見**，所以那一行 NOTE（哪幾條被用到）不是裝飾。
[[settings.allow]]
prefix = "v2-audit/"
reason = "v2 的事故資料，是事故證據不是這棵樹的機密（那些密碼值早就公開兩年、事故也已經處置完），而且這個目錄不准改——真的命中的時候唯一的出路是放行，不是去改證據。今天實測沒有對象。"
expires = "2027-03-09"

[[settings.allow]]
prefix = "blueprint/"
reason = "規則藍圖。每張卡的規格欄裡都在講「哪種寫法會紅」，示範用的字樣本來就長得像違規。跟上面那個目錄同一個理由：那是資料與示範，不是機密，而且藍圖不准改。今天實測沒有對象。"
expires = "2027-03-09"
