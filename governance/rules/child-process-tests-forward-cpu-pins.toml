# 規矩卡：開子行程的考卷要帶三格處理器釘選
# 票 #1077；收尾（現有的檔改用共用小工具、放行一筆一筆拿掉）在 #1078。
# 上一代沒有對得上的事故（v2 的子行程問題是載入路徑，不是指令集），這一類是 v3 自己踩的：
# #721（10-08 主線紅）、#783、#1019、#1021、#1037、#1039、#1044→#1048 等，至少九次、三次紅到主線；
# 盤點在工作區 pstack-to-main 那份重複錯清單第 2 列。規則本身在決策紙
# verification-split-stand-in-wiring-and-cross-cpu-tolerance.md 第 6 條，這張卡只守子行程環境那一半。
id = "child-process-tests-forward-cpu-pins"
human = "開子行程的考卷要把雲端設好的三格處理器釘選帶進子行程：`tests/` 底下呼叫 `child_process_env(...)`（建計算子行程的環境，只繼承白名單）的每一處，都必須直接寫成共用小工具的第一個引數 `forward_cpu_pins(child_process_env(...))`（小工具住 `tests/engine/_cpu_pins.py`）。不包的話，雲端 job 層設好的三格（numpy 的向量指令、OpenBLAS 的核心、XLA 的指令集）不會跟進子行程，抽到有 AVX-512 的機器時子行程的數字就差最後一位。直接叫、`模組.函式` 叫、`import … as 別名` 再叫都算；包在別的東西裡（`dict(...)`、先指給名字再傳、字典展開）不算——審的人要一眼看得出那一處帶了釘選。立卡前就在的檔整批列在 `[[settings.allow]]`：一支檔一筆、記凍結當時沒包的處數 `calls`，那支檔沒包的處數必須等於 `calls`——多了是新寫的沒帶，少了或檔不在了就要把那一筆改小或拿掉，同一支檔寫兩筆也紅，放行清單不准比實況寬。子行程刻意要跟不帶釘選的正式工作行程同一環境的（終點探針，#1051），才開一筆放行寫理由。刻意沒管：把函式本身當值傳出去、`getattr` 取、在別的模組包一層再叫、另定義一支同名函式當小工具；產品程式自己開的子行程（正式工作行程刻意不帶釘選）。判準全住卡上的 [settings]；讀不到卡、放行那一格形狀壞掉（缺 path、calls 不是正整數）、共用小工具不在或沒有那支函式、考卷的 .py 剖不開，一律回 2 不回 0。"
scope = [
  "tests/**/*.py",
  "governance/rules",
]
check = "governance/checks/child_process_tests_forward_cpu_pins.py"
negative_fixture = "governance/fixtures/child-process-tests-forward-cpu-pins"
control_fixture = "governance/fixtures/child-process-tests-forward-cpu-pins/control"
# 該回 2 的樣本：樹裡沒有這張卡、共用小工具不在、小工具裡沒有那支函式、考卷剖不開、放行的 calls 不是正整數。
tool_broken_fixture = "governance/fixtures/child-process-tests-forward-cpu-pins-tool-broken"
declared_level = "blocking"
enforcer = "github-actions-job"
job = "verify"
# 列檔靠 git ls-files（外殼共用）；抽掉 git 這一跑就回 2。
external_tools = ["git"]
blood_debt = []
related_lessons = []
admission_issue = 1077

[mountpoint]
trigger = "pull_request，以及 push 到 main"
runs_on = "cloud-authority"
result_to = "GitHub Actions 的 verify job 結論"
blocks_merge = true

# 判準只住這裡。每一份樣本底下也帶一份同樣的 [settings]，因為每份樣本都是獨立的掃描根。
[settings]
tests_dir = "tests/"
# 建計算子行程環境的那支產品函式（aosr.runtime）。它在物理身分的程式範圍裡，改它會換身分，所以釘選從考卷這一側補。
child_env_name = "child_process_env"
helper_file = "tests/engine/_cpu_pins.py"
helper_name = "forward_cpu_pins"

# ── 立卡前就在的檔（#1077 凍結；收尾在 #1078，到期日統一 2027-02-26）──────────────
# 三種理由：檔裡至少一處自己帶三格（不一定每處都帶）、整支沒帶（要逐支看補了會不會反而不一致）、
# 刻意不帶（終點探針要跟正式工作行程同一環境）。本機三格是空的、沒有 AVX-512，本機跑不出差異，
# 逐支判斷要看雲端摘要的機器行（tests/conftest.py 的 machine_lines）。
# 按檔凍結只比處數：凍結的檔修掉一處、同時另寫一處沒包的，總數不變就看不出來（審查 #1081 點的）；凍結檔要改動時順手包好。

