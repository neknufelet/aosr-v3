# 規矩卡：型別警衛（好習慣卡，0 血債）
# 這張卡不是從某一筆 v2 事故長出來的。找碴席（cards-38.json 的 critic_v2）把 66 筆重掃一次，
# 逐筆確認沒有任何一筆的本體是「缺型別標註」或「型別對不上」——所以 blood_debt 是空的。
# 它的價值全在未來：一條型別規則收不回已經出過的事，只擋「從今天起別長歪」。
id = "type-guard"
human = "型別警衛，掃版控裡的每一支 .py（扣掉必紅樣本樹與本機工具目錄），兩層，第二層刻意獨立於 mypy。①`mypy` 嚴格模式跑那一整組檔：缺參數或回傳標註、型別對不上，一律紅。嚴格度只住在這張卡登記的那個設定檔的 `[tool.mypy]`（今天是 `pyproject.toml`），這支檢查自己不帶任何嚴格度旗標——設定檔不在、或 mypy 不在 PATH 上、或 mypy 自己崩掉（回一個不是「乾淨」也不是「有錯誤」的離開碼），一律回 2 不回 0；沒有尺、或量到一半死掉，「沒問題」這句話就不算數。②逃生門掃描，用 AST 判，**完全不看 mypy 的旗標與輸出**：標註位置（參數、回傳、變數標註、型別別名）出現 `Any` 就紅，巢狀的也算（`dict[str, Any]` 一樣咬）；`cast(Any, …)` 這個呼叫本身紅；`# type: ignore` 沒帶錯誤碼（方括號裡沒寫明是哪一種錯）紅。為什麼第②層不能靠 mypy：嚴格模式那一包不含 `disallow_any_explicit`，所以 `-> Any` 在純嚴格模式底下合法通過；`warn_unused_ignores` 也只抓「多餘的抑制」，抓不到「真的在壓一個錯誤」的那種。**這張卡不管抑制註解的理由與到期日**——那兩格由 exemptions-need-expiry 守，兩張卡看同一行的不同格，刻意不重疊（兩張卡掃同一件事會互相遮蔽，那是 v2 事故 guard-teeth-shadow-each-other 的形狀）。真的需要 `Any`（讀進來的動態資料型別本來就未知）就在這張卡的 `[[settings.allow]]` 具名放行那個檔，寫理由與到期日。掃描面上一支 .py 都沒有、某支 .py 剖不開、讀不到這張卡的 `[settings]`，一律回 2 不回 0。"

# 掃描面：進得了版控的每一支 .py，扣掉必紅樣本樹（那是別的掃描根，由後設測試單獨餵）
# 與本機 agent 工具目錄（雲端 checkout 不會有，底下還有工作樹副本會把同一批檔算兩次）。
# 加上所有規矩卡（門檻與放行清單住在其中一張上，這支檢查要打開每一張去找自己那一張），
# 以及 pyproject.toml——第①層真的會讀它（當 --config-file 餵給 mypy），讀了就要宣告。
scope = [
  "governance/rules",
  "pyproject.toml",
  "**/*.py",
  "!governance/fixtures",
  "!.claude",
]
check = "governance/checks/type_guard.py"
negative_fixture = "governance/fixtures/type-guard"
control_fixture = "governance/fixtures/type-guard/control"
tool_broken_fixture = "governance/fixtures/type-guard-tool-broken"
declared_level = "blocking"
enforcer = "github-actions-job"
job = "verify"
# mypy 列在這裡是認真的：抽掉它這支檢查回 2（後設測試第 4 回會驗），
# 因為第①層整層就是它在判。git 是共用外殼列舉檔案用的。
external_tools = ["git", "mypy"]

# 0 血債。這張卡不認領任何 v2 事故當血債：找碴席逐筆讀完 66 筆，沒有一筆的本體是缺標註
# 或型別對不上。原稿掛的 type-annotations-required 是治理提案（候選規則），不是事故。
blood_debt = []
related_lessons = ["guard-teeth-shadow-each-other"]
related_lessons_why = "只記關聯不算血債，而且它進來的方式跟別張卡不一樣：那筆事故沒有一個「缺標註」或「型別對不上」的現場，這張卡在它的現場咬不到任何東西。它跟這張卡的接點是兩句話。第一句在 what_happened 裡：「08-21 SCENE-2.0 RED 全 NotImplementedError、REDLINE-3 兩次擋 noqa/type: ignore」——當時真的有人想用抑制註解從檢查底下逃出去，被人擋掉兩次。那條線索只拿來設計第②層（機器從今天起會咬沒帶錯誤碼的抑制註解，不必靠人在 PR 上抓），不拿來冒充血債：事故當下那兩次是人擋的，機器面沒有東西可以咬，而且被擋的對象是別的檢查的抑制標記，不在這張卡的掃描面裡。第二句是那筆事故的本體——「堆疊語意重疊的 if 沒逐條證明會咬，被遮蔽條文日後當已保證」。它在這張卡上是反過來用的：它是這張卡刻意**不做**某件事的理由。抑制註解的理由與到期日已經由 exemptions-need-expiry 在守，這張卡只守錯誤碼那一格；兩張卡都去判同一格，改壞了不知道是哪一張在咬、改對了也不知道是誰放的，那就是這筆事故的形狀。真正承接這筆事故本體的是「每一條拒絕條文都要有只有它會擋的輸入案例」，那件事今天由每張卡的必紅樣本與後設測試第二回撐著，不是這張卡自己的規矩。"

[mountpoint]
trigger = "pull_request，以及 push 到 main"
runs_on = "cloud-authority"
result_to = "GitHub Actions 的 verify job 結論"
blocks_merge = true

# ── 門檻與名單只寫在這裡 ────────────────────────────────────────────────────
# 檢查程式沒有預設值：讀不到這一段就回 2，不回 0。
# 每一份必紅樣本底下也帶一份同樣的 [settings]（`allow` 那一格改成空的，只有控制樣本非空），
# 因為每份樣本都是獨立的掃描根，檢查程式只從掃描根自己的 governance/rules/ 讀。
[settings]
# 第①層的看門狗秒數。mypy 卡住的時候要在 job 那一層的分鐘上限之前先回 2，
# 不然整個 job 被 GitHub 硬砍，收據上看不出是誰卡住的。
# 這個數字怎麼定的：立卡當天在乾淨樹上實跑 mypy（冷快取、掃描面二十幾支 .py）量到的是
# 兩秒多，門檻取「比它大兩個數量級、又明顯小於 job 上限」。實測值寫在 PR 描述裡，
# 不寫在這裡也不寫在人話欄——那個數字會漂，而門檻本身就登記在下面這一行。
mypy_timeout_seconds = 300
# 第①層的尺住在哪（相對掃描根）。嚴格度全部寫在那個檔的 [tool.mypy]，
# 這支檢查只把它當 --config-file 餵下去，自己不帶任何嚴格度旗標
# ——不然設定檔被改寬了，卡面還會照樣宣稱「跑的是嚴格模式」。
config_file = "pyproject.toml"
# 掃描面上不看這些前綴（跟 scope 的兩條 `!` 一一對應：那邊是宣告給人看的掃描面，
# 這邊是給程式讀的）。
scan_exempt_prefixes = ["governance/fixtures/", ".claude/"]

# ── 第②層的 Any 放行清單 ───────────────────────────────────────────────────
# 一筆放行一個檔：那個檔裡標註位置的 Any 是誠實的（讀進來的資料型別本來就未知），
# 不是拿 Any 當偷懶。判準是「這個 Any 換成具體型別會變成謊」：是就在這裡具名放行，
# 不是就把型別寫對。放行只放過「標註位置出現 Any」這一條——同一個檔裡的
# `cast(Any, …)` 與沒帶錯誤碼的抑制註解照樣被咬。
# 跑完在 stderr 印一行：這一跑每個放行的檔各放過幾處、哪幾筆今天沒有對象。

[[settings.allow]]
path = "blueprint/remap_cards.py"
reason = "這支產生器從頭到尾在搬 json 讀出來的動態表（38 張卡的原始欄位、四份輸入檔、寫出去再讀回來自檢），那些表的值型別本來就未知，`dict[str, Any]` 是它們誠實的標註。要換成具體型別就得替 blueprint 那幾份 json 各寫一套 TypedDict，而那幾份 json 的欄位是人手改的、還會再長——寫死的型別會先變成謊。它也不是被 CI 當閘用的檢查程式，是一支可重跑、跑完自驗的產生器。"
expires = "2026-12-09"

# ── 這張卡刻意沒管的事（留在卡面，不要當成漏掉）────────────────────────────────
#
# 1) 第②層不管抑制註解的理由與到期日，也不管 `# noqa`。那兩格由 exemptions-need-expiry
#    守（它的 comment_markers 就登記著那幾種標記），這張卡只多守一格：錯誤碼。
#    刻意不把 `# noqa` 也拉進來要求「帶規則碼」——今天樹裡的 noqa 全部帶碼，零違規對象，
#    而沒有對象的規則是只會回綠的規則；真要立就等有對象再說。
#
# 2) 放行清單是一份人維護的清單，這是這張卡最大的洞：把一個檔加進清單，就等於在那個檔裡
#    把「標註位置不准出現 Any」整條關掉，機器擋不住。壓住它的只有三件事——清單在卡上
#    看得見、每一筆要寫理由、每一筆有到期日（過期即紅，由 exemptions-need-expiry 判）。
#    「這一筆該不該存在」要人看 PR。
#
# 3) 第②層只認 `Any` 這個名字（含 `typing.Any` 這種帶前綴的寫法）與字串形式的標註。
#    自己寫一個 `MyAny = Any` 再到處用那個別名就繞得過去——別名的宣告那一行會被咬
#    （型別別名也算標註位置），但用它的每一處咬不到。已知的洞，照實記。
#
# 4) 第②層不管「標註寫得夠不夠精確」。`list[object]`、`dict[str, object]` 過得去，
#    而它們跟 Any 的差別是「object 什麼都不能做，Any 什麼都能做」——前者還是型別安全的，
#    所以放它過去是對的，不是漏掉。
#
# 5) 第①層的掃描面是「進得了版控的 .py」，不是「mypy 自己會走到的每一個模組」。
#    第三方套件的型別由它們自己的型別套件決定（pyyaml 那份是 types-PyYAML，登記在
#    pyproject.toml 的 dev 群組）；套件沒有型別資訊的時候 mypy 嚴格模式會紅，那也是對的。
#
# 6) 第②層的第三條掃的是**註解 token**，不是字串。在文件字串或字串常數裡引用那個標記
#    （這張卡的檢查程式與卡面自己就在做這件事）不會被咬；反過來說，在真的註解裡把那個標記
#    當散文寫下來會被咬成「沒帶錯誤碼」。這是已知的誤咬形狀，代價很小（要講那件事就寫進
#    文件字串，或像這張卡一樣寫成中文的「抑制註解」），換到的是判準不必猜「這一行是散文
#    還是真的在抑制」——猜錯的方向會是漏抓，比誤咬糟。
#
# 7) 這張卡不驗「CI 上真的有一步在跑它」。有人把 verify 裡那一步刪掉，這張卡照樣綠。
#    今天壓住它的是 PR 審與 ci-jobs-cannot-die-quietly（那張卡保證留下來的每一步都不准
#    把離開碼吞掉）。要機器擋住「步驟被刪掉」得另立一條，形狀跟 green-must-be-real-green
#    驗「那個 job 裡真的有一步在跑 pytest」一樣，今天沒做（style-guard 的檔尾也記了同一條）。
