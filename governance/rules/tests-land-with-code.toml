# 規矩卡：產品程式與測試必須同一支合併請求落地
#
# 候選票：#170（從 #16 的分組獨立追蹤出來；#16 另一張語意簽章候選不由這張票關掉）。
#
# **沒有 v2 血債，照實寫空。** 藍圖（blueprint/cards-38.json）與來源規則
# （blueprint/collapse-by-failure.json）兩邊的事故欄都是空的，不編一筆事故進去認領。
# 決策紙 docs/decisions/reset-from-v2-lessons.md 允許明白標示「無血債」。
id = "tests-land-with-code"
admission_issue = 170
human = "一支合併請求改動 `src/` 底下的 Python 產品程式，同一段差異裡就必須有 `tests/` 底下的 Python 測試也動了。判的是**同行**，不是測試內容有沒有覆蓋到那一行——覆蓋是語意，機器判不出來，語意有效性仍然靠行為對照與獨立審查。範圍是**共同分支點到 head 的三點差異**，不是兩點：CI 餵的 base 是主線當下的頂端，主線在你開分支之後合進來的測試變更，在兩棵樹之間都不一樣，兩點差異會把那些考卷算成「這個 PR 動了測試」，於是只改產品的 PR 照樣綠——那道門縫不用惡意就走得過去（獨立重跑確認過）。看的是整段差異，不是最後一筆提交。產品側是任一側路徑命中登記的產品目錄底下、登記的副檔名（改名／複製的舊路徑與新路徑都算，刪除也算）；測試側只認登記的測試目錄底下、登記的副檔名，文件與資料檔一概不算。產品側有任何新增／修改／改名／複製時，測試側必須有新增、修改，或改名**進來**；只刪測試不算，把考卷改名搬出測試側也不算。產品側全部是刪除（整塊撤除）時，同行的測試刪除算同行。產品側一筆都沒有就乾淨，空差異（空提交、只改治理檔）是有效範圍，回 0 不回 2。第一版**不開 PR 層的豁免**，代價照實寫在這裡：改產品側一行註解、一個 docstring、純結構調整，都要動一支考卷；現有的放行機制放行的單位是「這支檔的這個函式」，套不到「這一個 PR」，要做就得發明一個自報欄位，同一支 PR 的作者自己就寫得出來——哪天真的被擋到痛了另走一張決策紙。差異用 `git diff --name-status -z -M` 讀：`-z` 所以檔名裡的空白與換行讀得對，`-M` 所以改名被認出來是改名而不是「刪一個、加一個」；輸出沒有以 NUL 收尾（被截斷）、認不出的狀態字母（含 `U` 未合併）、一側的狀態帶相似度數字、兩側的狀態不帶數字，一律回 2——未知狀態不准當成沒改。`GITHUB_EVENT_NAME=pull_request` 卻拿不到 base、head 或 base 那顆物件不在（淺 clone）、算不出共同分支點、這棵樹裡一個主線參照都找不到、根提交前面沒有範圍，也一律回 2；認不出主線就不准退回「量最後一筆」，那樣答案會取決於跑的時候 HEAD 停在哪一筆。必紅樣本靠一份宣告檔在系統暫存區重建一段**真的** git 歷史（內容逐位元從樣本樹裡真的那個檔讀進來，不只信宣告的字串），宣告的路徑是絕對路徑、夾了 `..` 或 `.git`、或解析之後跑出樣本樹（連結）一律回 2；真的 git 工作樹的根出現那份宣告檔回 2，真樹裡那份宣告檔只准住在這張卡宣告的樣本樹底下。產品側、測試側與副檔名只寫在這張卡的 `[settings]`，檢查程式沒有預設值：讀不到那一段、那三個鍵缺一個或多一個，一律回 2 不回 0。前提寫在卡面上：這是 PR 範圍的閘，繞過 PR 直推主線的路徑在它視野外（那靠主線 ruleset，見 merge-gate-read-back）。**它不證明測試有效**：換掉一支真考卷、補一支只會過的，題數沒變，這張卡放行，收集數地板也不會動——那個地板擋的是「題數掉下去」，不是「題目變空」。同行與題數兩件事都不是有效性的證據，那一格今天沒有機器在守，靠行為對照（突變／逐筆刪的證據）與獨立審查。"

# 掃描面不是檔案：這張卡判的是**一段差異**（哪些路徑在這支 PR 裡動了），不是最終那棵樹上的
# 一組檔。所以明寫 scope_kind = "commits"——scan-scope-has-no-holes 對這種卡只驗「宣告的
# 每一條在版控裡有對象」，不比集合。
#
# 下面三條，兩種東西：
# · 前兩條是它**判**的那兩側住在哪。**程式讀的是 [settings]**，不是這兩條
#   （scope_kind = "commits" 不比集合，所以「兩邊不一樣會被抓」那句話對這張卡是假的守衛，
#   不要拿它當保險——判準只有一個家，就是 [settings]）。
# · 第三條是它**讀**的那份資料：這支檢查會列舉 `governance/rules/` 底下每一張 .toml，
#   去找 id 是自己的那一張，讀它的 [settings]（判準）與樣本樹欄位（「宣告檔只准住在樣本樹
#   底下」那一條的家）。讀卡就是它的讀取面，要申報——鄰居 commit-author-allowlisted 同樣
#   把它讀的那份名單宣告在 scope 裡。不申報的讀取面等於卡面看不出它會去讀那裡。
scope = [
  "src/**/*.py",
  "tests/**/*.py",
  "governance/rules",
]
scope_kind = "commits"
check = "governance/checks/tests_land_with_code.py"
negative_fixture = "governance/fixtures/tests-land-with-code"
control_fixture = "governance/fixtures/tests-land-with-code/control"
# 該回 2 的樣本：宣告提到樣本樹裡沒有的檔、候選分支上一筆提交都沒有、宣告的路徑是絕對路徑／
# 夾了 ..／碰 .git、卡上的登記簿缺一格、樹裡根本沒有這張卡。都是「這一跑沒量到東西」，
# 不是「沒有違規」。
tool_broken_fixture = "governance/fixtures/tests-land-with-code-tool-broken"
declared_level = "blocking"
enforcer = "github-actions-job"
job = "verify"
external_tools = ["git"]

# 沒有 v2 血債（藍圖與來源規則的事故欄都是空的），也沒有判得上關聯的事故。照實留空，不編造。
blood_debt = []

[mountpoint]
trigger = "pull_request，以及 push 到 main"
runs_on = "cloud-authority"
result_to = "GitHub Actions 的 verify job 結論"
blocks_merge = true

# ── 登記簿：判準只寫在這裡 ─────────────────────────────────────────────────
# 檢查程式沒有預設值：這一段讀不到、或三個鍵缺一個多一個，它就回「這一跑不算數」，不回綠。
# 每一份樣本樹底下也各帶一份同樣的 [settings]（一張只有 id 與這一段的迷你卡），
# 因為每一份樣本都是一棵獨立的掃描根，檢查程式只讀那棵樹自己的卡。
[settings]
# 產品側住哪。今天只有一條：新家 src/ 底下（引擎一塊一塊長進來，見決策紙
# engine-not-imported-new-home-grows-block-by-block）。
product_paths = ["src/"]
# 測試側住哪。治理層的考卷與引擎的考卷都在 tests/ 底下（引擎那一籃住 tests/engine/），
# 兩籃都算「測試同行」——這張卡不管考卷放哪一籃，那是 green-must-be-real-green 的事。
test_paths = ["tests/"]
# 算哪幾種副檔名。只認 .py：考卷樹裡的說明文件與資料檔不算測試變更，產品側底下的
# 設定檔與標準答案也不算產品變更——搬一份資料檔不需要動考卷。
code_suffixes = [".py"]

# ── 這張卡刻意沒管的事（留在卡面，不要當成漏掉）─────────────────────────────
#
# 1) 測試寫得好不好不管。「刪一支真考卷、補一支只會過的」這張卡放行——它只看「有沒有動」。
#    **不要說這一格有 green-must-be-real-green 的收集數地板在守**：那個地板只擋「題數掉到
#    地板下面」，一換一的題數沒變，它不會動。整支考卷刪掉不補才會掉下去。所以「測試有效」
#    今天沒有機器在守，靠行為對照（突變、逐筆刪那種證據）與獨立審查——照實寫，不要誤稱有牙。
#
# 2) 覆蓋率不管。哪一行被測到是語意，機器判不出來；硬要判就會變成「為了讓閘變綠而寫的考卷」。
#
# 3) 繞過 PR 直推主線的路徑在視野外。那靠主線 ruleset（merge-gate-read-back）。
#
# 4) 第一版沒有豁免。代價寫在人話欄裡了：純註解、純 docstring、純結構調整也要動考卷。
#    這是選擇不做，不是沒看見——PR 層的豁免是自報欄位，作者自己就寫得出來。
#
# 5) 產品側與測試側之外的變更（治理程式、文件、workflow）一律不看：那些不是產品程式，
#    這張卡對它們沒有要求。
