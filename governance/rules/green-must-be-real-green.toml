job = "verify"
external_tools = ["git"]

# 血債：找碴席判「在事故當下會回紅」的只有這一筆。
blood_debt = ["skips-disguise-red-as-green"]
related_lessons = ["two-ways-to-run-one-suite"]
related_lessons_why = "找碴席判 lesson_bites = false，而且方向相反。那起是**假紅**不是假綠：裸 pytest 沒帶排除清單，多報 54 條早就入帳的環境相依紅；後來 nightly_hermetic.sh 從 manifest 逐一 deselect 才把數字對上。這張卡第四條要紅的正是「有 deselect」，所以在事故當下會判紅的反而是後來把假紅修好的那個版本，不是出事的那個版本。真正對得上那筆事故的是它自己的對策「不准有 expected-red 帳本、環境相依測試用 marker／importorskip 宣告、裸 pytest 就是唯一正式跑法」——其中「不准有 expected-red 帳本」得另立一張窄卡才咬得到。這張卡只承接得起它的後半段（跑法唯一、設定只寫在 pyproject），所以記關聯不記血債。"

# 收據在哪、每個籃子的收集數地板多少、地板離實跑數多遠算過期。門檻只寫在卡上，
# 不寫死在檢查程式裡。
#
# **一份成績單、一張籃子表**（決策紙 docs/decisions/engine-first-block-config-shape.md
# 的第三題：老闆 2026-09-11 拍板，同一工作、一次 pytest、一份收據，收據裡按 classname
# 前綴分兩個籃子、各籃各自一個最少題數，沒進籃子的紅）。一次 pytest 只產得出一份 junit
# （tests/conftest.py 的規矩），所以籃子不是靠跑兩次分的，是靠「考卷住哪個目錄」分的：
# 治理層的 15 支住 tests/ 根層，classname 長成 tests.test_build_status；
# 引擎的 1 支搬進 tests/engine/，classname 長成 tests.engine.test_aosr_runtime。
# 一個 testcase 命中哪個前綴就落進那一籃，取**最長符合**的前綴（tests. 與 tests.engine.
# 同時符合時算後者）。
#
# collected_floor 是那一籃實跑量到的收集數，加考卷會讓它往上長，這個數字要由那個 PR
# 一起改。上一版是單一籃子的 295（治理層＋引擎混算）。立卡當時寫 16（1 支「至少要有一張
# 卡」＋ 3 張卡 × 5 回合），到 11 張卡、6 回合的時候實跑已經是 74——地板停在 16 等於
# 沒有地板：掉掉一大半測試也還在地板上面（issue #35）。上一版的 295 是 2026-09-11 立
# 分層卡（票 #125）那一跑量到的；再上一版 282 是 2026-09-10 把第⑤條改成 fail-closed
# （認不出的行一律紅，票 #104）那一跑實跑量到的。歷史留在決策紙與 issue，不在這裡堆。
#
# 這兩個數字怎麼量的（2026-09-12，票 #148／#149 這一支 PR 重量了一次）：
# 當時 conftest 會為後設測試預跑全套；票 #140 已在 2026-09-14 拿掉預跑。現在量法是跑一次
# 帶 `--junitxml=governance/receipts/pytest.junit.xml` 的完整 pytest，再逐個 <testcase> 數
# classname 前綴——`tests.engine.` 與 `tests.` 各是一個實跑數，不是推算的。
#
# 引擎那一籃怎麼長到這裡的：第 2 刀（PR #153）把讀檔那 9 支的考卷放進 tests/engine/，
# 從 59 長到 158；那支 PR 的第一輪找碴補一支**逐常數**的凍結值考卷（37 筆）到 196；
# 第二輪再補「必填 path 餵 None 的訊息逐字相同」（5 筆）、`w_dip_from_bias`（4 筆）、
# 4 支預設路徑（12 筆）到 217；總驗收那一支再補裁判自己的控制組（`is_approx`，25 筆）、
# 「換 cwd 也指到同一個地方」（1 筆）、以及 `early_reflection` 的欄位型別（1 筆），到 244。
# 第 1 批「裁判補洞」（票 #161／#162／#163／#155）這一支補 23 筆到 267：訊息裁判的控制組
# （`test_config_judge_message.py` 的 `validate_message` 那一半）、答案檔與 case 表的
# id 唯一性（同一支的 #163 那一半、外加兩支載入器考卷各一條）、`fem_lane` 的讀檔接線
# （`test_config_cut2_fem_lane_wiring.py`：三個常數跟著突變後的 TOML 變、基線那一邊、
# 五筆私有載入器的壞值守門）。治理層那一籃 297 題是第 2 刀帶進來的 2 題（門檻不准硬編碼
# 那條守衛改寫成盯新家那一層——它是掃原始碼的守衛，不住引擎籃）。
# 第 2 批「守門根治」（票 #148／#149）這一支把治理層那一籃從 297 推到 323：分籃那一份共用
# 判準的考卷（`tests/test_bucket_classification_green.py`，含前綴邊界、類別名、撞名與祖先撞名回 2）
# 與「引擎那一籃由卡指名」改寫過的那一支（`tests/test_engine_test_placement_green.py`），
# 所以治理層的地板跟著調到 321；那一支 PR 沒有動引擎那一籃，267 維持不動（實跑也是 267）。
# 地板貼著實跑數填，不是留餘裕。
#
# 立卡 tests-land-with-code（票 #170）這一支把治理層那一籃再往上推：新卡自己的聚焦考卷
# 59 題，加上後設測試對新卡跑的 6 回合（六回合逐卡參數化，多一張卡就多 6 題），
# 實跑收集數量到 388——這個數字是 2026-09-12 在這一支工作樹上跑
# `uv run pytest --collect-only` 逐檔加出來的（治理層 388、引擎 267、合計 655，
# 跟同一棵樹全套跑出來的 655 題對得上），不是推算的。
# **票 #134 第一候選（材料那三支）把引擎那一籃從 267 調到 643**：這一支 PR 加了材料的
# 產品考卷（逐筆比對 76 個 case ＋ 7 個凍結值）、裁判的逐筆控制（每一筆 case 各一題的
# 刪／複製／改值）、donor 兩份舊考卷的承接、tracer 分支的正反例，以及「插值前的夾子」
# 那一行的突變對照。643 是這一支 PR 實跑量到的收集數
# （`governance/receipts/pytest.junit.xml` 逐題分籃數出來的），不是估的。
# 治理層那一籃沒有動（實跑也還是 388）。
#
# floor_stale_ratio 就是為了讓「地板忘了調」自己變成一條紅：某一籃的實跑數超過那一籃登記的
# collected_floor × 那一籃登記的倍數就紅。這個窗口的大小跟著那一籃的題數走：大的那一籃（幾百題）
# 容得下好幾張新卡才需要動地板，小的那一籃（個位數題）幾乎加一張考卷就頂到那條線——所以小的
# 那一籃的地板要貼著實跑數填，不能像大籃那樣留餘裕。倍數的值登記在下面，這裡不抄。
[junit]
path = "governance/receipts/pytest.junit.xml"
floor_stale_ratio = 1.25
# 哪一籃是引擎那一籃（票 #148）。這一格不是門檻是**權威**：寫了哪一籃，「載入引擎套件的
# 考卷住哪裡」就判哪一籃，檢查程式不准自己從籃子表猜。以前那個猜法（取最深的那幾籃）兩個
# 方向都失守：把這一籃從表裡刪掉，猜出來是空集合、整條守門靜靜關掉、全樹回 0；表裡多一籃
# （例如 tests.tools.），引擎考卷就多一個合法的家，搬過去不紅。
# 必填，而且指到的籃子必須真的在下面那張表裡——指不到就回 2（這一跑不算數），不是靜靜關掉。
engine_bucket = "tests.engine."

