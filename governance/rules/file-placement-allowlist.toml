# 規矩卡：檔案放哪裡走白名單，路徑名字一律純 ASCII（收窄版，只留今天有對象的兩條）
id = "file-placement-allowlist"
human = "檔案放哪裡走白名單，名字一律 ASCII，兩條：①repo 根層與 docs 根只准出現這張卡列出的檔名與目錄名，多一個檔、多一個目錄（含隱藏目錄）就紅——清單寫在這張卡自己的 [[allowlist]]，不寫死在檢查程式裡，改寬清單要走 PR；②git ls-files 全集（含未被忽略的未追蹤檔）的每一個路徑都必須是純 ASCII，非 ASCII 只准出現在卡宣告的必紅樣本樹底下，那是刻意的壞樣本、由後設測試單獨餵。這張卡只看白名單宣告的那幾層（根層與 docs 根，深度 1）；已核准的目錄裡面長多少子目錄、堆多少檔案它看不到，那要另一張卡。"
scope = [
  ".",
  "docs",
]
check = "governance/checks/file_placement_allowlist.py"
negative_fixture = "governance/fixtures/file-placement-allowlist"
control_fixture = "governance/fixtures/file-placement-allowlist/control"
declared_level = "blocking"
enforcer = "github-actions-job"
job = "verify"
external_tools = ["git"]

# 血債：找碴席（cards-38.json 的 critic_v2）判「在事故當下會回紅」的只有這一筆。
blood_debt = ["accumulating-disk-state-has-no-owner"]
related_lessons = [
  "docs-volume-buries-the-design",
  "shadow-skill-copy-survives-upstream-delete",
]
related_lessons_why = "docs-volume-buries-the-design：docs 那一層本卡順便擋得住「第四類目錄進來」，但那筆事故的病根是 636 份過程紀錄塞在合法的類別裡面、以及總量從 1046 漲到 1437——目錄名對、種類錯、數量爆，這一關全看不到，承接的是 doc-frontmatter-and-dates（逐類與總量份數上限都在那張卡上；2026-09-10 老闆拍板不另立 doc-size-cap，牙併進了那張卡），所以只記關聯不算血債。類別封閉那半留在這張卡：docs 根層准出現哪些目錄名由這裡的 [[allowlist]] 定。shadow-skill-copy-survives-upstream-delete：原本靠「vendor/ 不進版控」承接，那條收窄時拿掉了（今天零對象），而且那筆事故自己的 enforcer 欄就寫「不適用」，對策是架構性的（v3 不建實體副本），本來就不該靠機器檢查擋。"

[mountpoint]
trigger = "pull_request，以及 push 到 main"
runs_on = "cloud-authority"
result_to = "GitHub Actions 的 verify job 結論"
blocks_merge = true

# 白名單。一層一個 [[allowlist]]：dir 是那一層的目錄（"." 是 repo 根），
# files 是那一層准出現的檔名、dirs 是准出現的目錄名，沒有也要明寫 []。
# 今天的內容用實際的 git ls-files 定，不是想像出來的。
[[allowlist]]
dir = "."
files = [
  ".gitignore",
  # 兩份入口檔。它們必須住在根層才會被各家工具讀到（工具找的是 repo 根的固定檔名，
  # 不是某個子目錄），所以放這裡不是隨手放，是那些工具的硬限制。CLAUDE.md 是原稿（規矩節由
  # governance/render_entry.py 生成），AGENTS.md 是指向它的指路牌（2026-09-10 老闆改的，以前是
  # 逐字副本）；兩份都由規矩卡 entry-files-rendered-from-registry 守。
  "AGENTS.md",
  "CLAUDE.md",
  "DIRECTION.md",
  "handoff.md",
  "pyproject.toml",
  "uv.lock",
]
dirs = [
  # .claude 是本機 agent 工具目錄（雲端 checkout 不會有）。事故
  # accumulating-disk-state-has-no-owner 的對策把 SessionStart hook 掛在這裡，
  # 它在本機根層出現是預期的；不列進來的話老闆在主工作目錄跑後設測試會假紅。
  ".claude",
  ".github",
  "blueprint",
  "docs",
  "governance",
  # src 是新家（產品程式碼）的根：老闆 2026-09-11 下午拍板，上一代的引擎程式碼不搬進來，
  # v3 裡只有新家 src/aosr，一塊一塊重新長，從第一塊起就被現有的規矩全咬。
  # 今天底下還沒有任何檔（第一塊是票 #127）。這一條是正面定義（准出現這個目錄名），
  # 不是放行——這張卡的白名單本來就是「准出現什麼」的清單。
  # 決定與代價見 docs/decisions/engine-not-imported-new-home-grows-block-by-block.md。
  "src",
  "tests",
  "v2-audit",
]

# docs 只准三類，照決策紙 docs/decisions/docs-three-classes.md。
[[allowlist]]
dir = "docs"
files = []
dirs = [
  "cairn",
  "decisions",
  "design",
]
