# 規矩卡：新引擎的資料夾有高低順序，底下的不准去拿上面的東西。
#
# 這張卡在管什麼，用一句話講：新引擎的每個資料夾各站一層，
# 上面那層可以去拿下面那層的東西，反過來不行，也不准 A 去拿 B、B 又回頭去拿 A。
# 另外，只有最底下那一層（資料夾裡叫 runtime 的那一支檔）可以動 JAX
# （算數用的函式庫）的全域設定，以及環境變數（開機前給程式的設定）。
#
# 候選票：#125。決定這件事的那張紙：
# docs/decisions/engine-not-imported-new-home-grows-block-by-block.md
# （新引擎一塊一塊重新寫，每一塊從第一天起就被全部規矩管）。
#
# 為什麼要在寫第一塊之前就立這張卡：上一代那份程式今天就是繞成一圈一圈的
# （下面「實際量到的」那一段是數字）。一塊一塊重新寫的時候，那些圈是當場就要剪掉的東西。
# 卡先立著，寫到那一處的當下就會亮紅燈，逼人當場決定怎麼剪；
# 卡後立，那些拿反方向的寫法會先被抄進來，然後就變成沒人敢動的債。
id = "layers-import-downward-only"
admission_issue = 125
human = "新引擎的資料夾有高低順序，底下的不准去拿上面的東西，也不准繞成一圈；只有最底下那一層 `runtime` 可以動 JAX（算數用的函式庫）的全域設定和環境變數（開機前給程式的設定）。高低順序寫在這張卡的登記簿裡，檢查程式不另外存一份。誰在上誰在下是量出來的：被別人拿得最多的那個擺最底下。「去拿別的檔的東西」那一行寫在哪裡都算，寫在檔案開頭算，藏在某個函式裡也算。用 `from ...xxx` 那種往上數幾層的寫法，一律紅：它其實也是在往上拿，只是看不出來。同一層之間互相拿可以，但只要繞回自己就是一圈，紅。資料夾沒登記在順序表裡也紅：不知道它在第幾層，就判不出它是往上還是往下拿。跑的時候才決定要載入什麼的偷渡寫法，也只有最底下那一層能用，別處出現就紅。換個名字叫它一樣咬：卡上登記的是那個東西本人，不是它被寫成什麼樣子。連 `JAX_`、`XLA_` 開頭的設定名字被寫成一段文字都不行——把名字準備好交給別人去設，一樣是在動全域設定。這一條的舊帳是：上一代有一支檔在被載入的時候偷改了一次全域設定，整套測試從此跑在另一組設定上，而紅綠燈上只看得到「昨天會過、今天不過」。順序表、資料夾的位置、可以動的那幾個東西的名字，全部只住在這張卡的登記簿裡；登記簿讀不到、順序表寫壞、新引擎底下一支檔都沒有、某支檔看不懂，一律回「這一跑不算數」，不回綠。"

# 掃描面：新家底下每一支 .py，加上所有規矩卡（層次表住在卡上，這支檢查要打開每一張卡
# 去找自己那一張）。刻意寫成 glob 而不是 "src/aosr"：那樣會把新家底下的非 .py 檔
# （標準答案、設定範例）也宣告進來，而這支檢查一個字都不讀它們——宣告了沒掃到就是洞。
# 為什麼是 `**.py` 而不是常見的 `**/*.py`：這一條字串會被兩支程式各用一種 glob 語意讀
# ——載入器那一份（scan-scope-has-no-holes 展開掃描面用的）裡 `**/` 吃零個或多個目錄段，
# 而 refs-and-links-resolve 用的是 fnmatch，它的 `*` 跨得過斜線、`**/` 卻硬要求那個斜線
# 真的存在。今天新家底下還沒有子目錄，`**/*.py` 在 fnmatch 那邊命中零個，於是這一條會被
# 當成死引用（實測過）。`**.py` 兩邊讀出來都是「這個前綴底下每一支 .py」。
scope = [
  "governance/rules",
  "src/aosr/**.py",
]
check = "governance/checks/layers_import_downward_only.py"
negative_fixture = "governance/fixtures/layers-import-downward-only"
control_fixture = "governance/fixtures/layers-import-downward-only/control"
# 該回 2 的樣本：卡讀不到 [settings]、層次表把同一個模組登記兩層、套件根底下一支 .py
# 都沒有。三種都是「這一跑沒量到東西」，不是「沒有違規」。
tool_broken_fixture = "governance/fixtures/layers-import-downward-only-tool-broken"
declared_level = "blocking"
enforcer = "github-actions-job"
job = "verify"
external_tools = ["git"]

# 這張卡在還哪幾筆舊帳。三筆都是上一代真的發生過的事，編號逐筆回
# v2-audit/lessons.json 對過（每一跑還會再被別張卡對一次）：
#   core-layer-imports-orchestration-layer      底層的程式反過來去拿上層的東西
#   import-time-global-flip-poisons-suite       有一支檔一被載入就偷改全域設定，害整套測試
#   same-concern-many-implementations-no-owner  同一件事有好幾份做法，沒有人是主人
# 前兩筆放進 blood_debt：事故發生的那一天，這張卡就會當場亮紅燈。
# 第一筆的現場就是「底下的去拿上面的」；第二筆的現場就是「被載入的時候改了全域設定」
# ——這張卡「只有最底下那一層能動全域開關」那一條，就是從第二筆長出來的。
blood_debt = [
  "core-layer-imports-orchestration-layer",
  "import-time-global-flip-poisons-suite",
]
# 第三筆只記「有關係」，不算舊帳：這張卡看得到誰去拿誰，看不出兩支名字不同的程式
# 其實在算同一個東西。
related_lessons = ["same-concern-many-implementations-no-owner"]
related_lessons_why = "那筆的病是「同一件事有好幾份做法、沒有人是主人」，要判的是兩段程式在不在做同一件事，不是誰去拿誰。這張卡只看得出方向與有沒有繞成圈，看不出兩支名字不同的程式其實在算同一個東西，所以在事故當天它不會亮紅燈。記在這裡是因為兩件事同一個起因——沒有高低順序，就沒有「這件事該住在哪一層」這個問題，於是每一層都自己再寫一份。要真的接住那一筆得另立一張卡（同一個量只准有一個地方宣告它），今天還沒有對象，也還沒有卡。"

[mountpoint]
trigger = "pull_request，以及 push 到 main"
runs_on = "cloud-authority"
result_to = "GitHub Actions 的 verify job 結論"
blocks_merge = true

# ── 登記簿：順序表與名單只寫在這裡 ─────────────────────────────────────────
# 檢查程式自己沒有備份值：這一段讀不到，它就回「這一跑不算數」，不回綠。
# 每一份必紅樣本底下也各帶一份自己的登記簿（列的是那棵假樹裡的假資料夾名），
# 因為每一份樣本都是一棵獨立的小樹，檢查程式只讀那棵樹自己的卡。
[settings]
# 新引擎住在哪個資料夾，以及程式裡要拿它的東西時寫出來的名字。
# 這兩格跟上面 scope 那一條講的是同一件事，只是一邊寫給人看、一邊寫給程式讀；
# 兩邊哪天不一樣了，會被另一張卡（scan-scope-has-no-holes）抓出來。
package_root = "src/aosr"
package_name = "aosr"

# 順序表：由下往上，一層一組。底下那層不准去拿上面那層的東西；
# 同一組之間互相拿可以，但不准繞回自己。
# 資料夾自己的門面檔（`__init__.py`）不屬於任何一組，它站在最上面：
# 它可以去拿每一層，而任何一層去拿它就是在往上拿，紅。
#
# 順序是量出來的，不是想出來的。2026-09-11 從上一代那個程式庫的凍結標記開一份
# 唯讀的臨時副本（只讀，不改、不寫回去），把它引擎底下十一個資料夾、174 支程式檔
# 全部讀一遍，數「每個資料夾被別人拿走幾次」，由多到少是：
#   config 133／materials 115／geometry 80／physics 60／scoring 33／
#   records 10／reporting 7／dsp 4／zoning 1／calibration 0／search 0
# 「被拿得最多的擺最底下」這條規則直接給出下面的順序。
# 最上面那一組刻意合成一層：它們三個之間只有一條線（reporting 拿 records），
# 排成三層只是憑空多畫兩條界線。
# 量出來跟原本猜的不一樣的一件事：`zoning` 並不是「沒有人拿它」的末端——
# 上一代的 config 有一支檔在拿它（而它自己完全不拿別人）。這裡照「被拿幾次」
# 把它留在最上面那一組，所以那一條線在寫到那一塊的時候會亮紅燈。
# 為什麼不把它沉到最底下：那只是為了讓一條已知的反方向寫法不要紅，
# 等於把尺去配舊程式，而不是照真的依賴關係定順序。
# `runtime` 是新的：上一代沒有這個資料夾，它就是「唯一能動全域開關」的那個家。
layers = [
  ["runtime"],
  ["config"],
  ["materials"],
  ["geometry"],
  ["physics"],
  ["scoring"],
  ["dsp", "records", "reporting"],
  ["calibration", "search", "zoning"],
]

# 唯一能動全域開關的那個資料夾。它一定要是順序表最底下那一組裡的。
machine_module = "runtime"
# 「全域開關」指的是哪幾個東西。
# 怎麼比對：檢查程式先把程式裡每個名字追回它真正的出處（共用的那支小工具是
# governance/names.py），再拿出處跟下面這張表對——所以換個名字叫它照樣咬，
# 而且登記 `jax.config` 就連 `jax.config.update` 這種接在後面的一起咬。
# 刻意只登記這幾個：`os.getenv`（只是「讀」一個設定）沒登記，咬它只會逼人去開豁免；
# 真的會讓整套測試換一組行為的，是「寫」跟那幾個會翻全域開關的 JAX 入口。
# 一條一句它會改掉什麼：
#   jax.config                  全域設定物件本身（`update` 一次，之後整套算出來的東西都變了）
#   jax.experimental.enable_x64 把全域精度切成六十四位元；上下文管理器與函式兩種用法都從這裡進
#   jax.experimental.disable_x64 同一個開關的另一個方向
#   jax.default_device          全域預設裝置；換一台裝置算出來的數字就可能不一樣
#   os.environ                  行程的環境（JAX 有一半的開關是從這裡讀的）
#   os.putenv / os.unsetenv     同上，繞過 os.environ 那張表直接寫行程環境
# 2026-09-11 找碴席實測 B5：只登記 `jax.config` 的時候 `jax.experimental.enable_x64()` 回 0
# ——同一個開關換一個入口就整條繞過去，所以那一族要逐個登記。
machine_origins = [
  "jax.config",
  "jax.experimental.enable_x64",
  "jax.experimental.disable_x64",
  "jax.default_device",
  "os.environ",
  "os.putenv",
  "os.unsetenv",
]
# 環境變數（開機前給程式的設定）名字的開頭。一段文字以這幾個字開頭，
# 就是在講那一族全域開關，最底下那一層以外的地方不准提。
# 為什麼要多這一條：上面那一格只看得到「這一行直接去改設定」，
# 但有人可以把名字準備好、交給別人去設（回傳一張表、塞進去叫別的程式時帶的設定裡），
# 那樣就繞過去了——而名字本身是看得見的。
machine_env_prefixes = ["JAX_", "XLA_"]

# 「跑的時候才決定要載入什麼」的那幾個偷渡寫法。只准最底下那一層用，別處出現就紅。
# 比對方式跟上面那一族一樣（先追回出處再對表，所以換個名字叫它照樣咬）。
# 一條一句它做什麼：
#   importlib.import_module  拿一段跑的時候才算出來的文字，把別的檔載進來
#   importlib.__import__     同一件事，比較底層的那個入口
#   builtins.__import__      直接寫 `__import__(...)` 就是它（不必先去拿就在，工具有先備好）
#   sys.modules              已經載進來的東西的清單；用一段文字當鑰匙就撈得到任何一層
# 2026-09-11 別家模型來找碴，實測這三種寫法可以把同一條往上拿的線整條藏起來。
# 上一版把它們寫成「已知的洞」，這一版改成直接禁——理由見檔尾第 4 條。
dynamic_import_origins = [
  "importlib.import_module",
  "importlib.__import__",
  "builtins.__import__",
  "sys.modules",
]

# ── 實際量到的：這張卡一立，重寫那幾塊的時候哪幾處會亮紅燈 ────────────────
# 同一次唯讀的量測（上一代那份凍結的副本，每一支檔整份讀過，寫在函式裡的也算）。
# 上一代有十一對資料夾是互相拿的，每一對在重寫的時候都要當場選一個方向：
#   config <-> materials    config->materials 4／materials->config 5
#   config <-> scoring      config->scoring 3／scoring->config 45
#   dsp <-> physics         dsp->physics 4／physics->dsp 1
#   dsp <-> scoring         dsp->scoring 1／scoring->dsp 3
#   geometry <-> materials  geometry->materials 16／materials->geometry 2
#   geometry <-> physics    geometry->physics 6／physics->geometry 63
#   geometry <-> records    geometry->records 1／records->geometry 4
#   physics <-> records     physics->records 8／records->physics 2
#   physics <-> reporting   physics->reporting 2／reporting->physics 21
#   physics <-> scoring     physics->scoring 17／scoring->physics 27
#   reporting <-> scoring   reporting->scoring 12／scoring->reporting 5
# 照上面那張順序表判，會亮紅燈的是十二條線、53 處、31 支檔：
#   physics->scoring 17（8 支檔）／physics->records 8（3）／geometry->physics 6（5）／
#   scoring->reporting 5（5）／config->materials 4（3）／config->scoring 3（2）／
#   scoring->dsp 3（3）／materials->geometry 2（1）／physics->reporting 2（1）／
#   config->zoning 1（1）／geometry->records 1（1）／physics->dsp 1（1）
# 第一塊（config，票 #127）要剪的就是其中 6 支檔：config 反過來拿 materials 三支、
# 拿 scoring 兩支、拿 zoning 一支，六支都是真的會跑到的寫法，
# 沒有一支是「只在檢查型別的時候才成立」那種比較好拆的形式。
# 這些數字是在那份唯讀副本上真的跑程式數出來的，不是估的。
# 它們寫的是**上一代現在長什麼樣**，不是新引擎的目標——
# 新引擎一塊一塊重寫，結構隨便改，只有算出來的數值不准變。

# ── 這張卡故意沒管的事（寫在這裡，不要當成忘了做）──────────────────────────
#
# 1) 同一個資料夾裡面，檔跟檔之間怎麼互相拿，這張卡不看。高低順序是「資料夾」這一級的事，
#    不是「檔」這一級。同一個資料夾裡兩支檔互相拿、繞成一圈，這張卡看不到。
#    故意的：一個資料夾裡面怎麼寫是它自己的事，管到那一層會把「切資料夾」變成「切檔案」。
#    已知的缺口，照實寫下來。
#
# 2) 轉手一次就追不到。A 去拿 C 的東西，B 再從 A 把同一個東西拿走——B 那一行看起來只拿了 A，
#    這張卡畫的圖上就少一條線。原因是它一次只讀一支檔，看不到隔壁那支檔轉手了什麼。
#    要這樣繞，得特地多寫一支轉手的檔，那種改動在送審的時候看得見。
#
# 3) 「只在檢查型別的時候才去拿」那種寫法，照樣算。這是選擇，不是疏忽。
#    那種寫法的意思是「我確實依賴上面那一層，只是真的跑的時候不載入」；
#    放它過去，就等於允許用型別把反方向的依賴洗白。而且上一代那 6 支反方向的檔裡，
#    一支都沒有用那種寫法——今天放過它，等於憑空開一扇沒有人在用的門。
#    代價：真的只在型別上需要上面那一層的時候，得把那個型別搬到下面去，或者把方向倒過來。
#    這正是這張卡要逼出來的那個決定。
#
# 4) 「跑的時候才決定要載入什麼」那幾種偷渡寫法，不是「抓不到」，是**直接禁**。
#    第一版把它列成已知的缺口（理由是那段文字要等程式跑起來才知道是什麼）。
#    2026-09-11 別家模型來找碴，實測那個缺口夠大：同一條往上拿的線改用那三種寫法，
#    這支檢查全部回綠，前面幾條整組繞過去。所以改成登記在上面那張名單裡、
#    最底下那一層以外的地方出現就紅。
#    憑什麼可以直接禁：新引擎一塊一塊重寫，沒有哪一塊需要用一段文字把自己的檔載進來。
#    真的需要（外掛、可有可無的相依）就走最底下那一層、開一張票談，
#    那時候名單改一行，在送審的時候看得見。
#    代價：新引擎從此不能寫外掛那種載入方式。這是選擇不做，不是做不到。
#
# 5) 全域開關那一條只看新引擎底下。管規矩的程式自己會讀環境變數（例如把某個工具從路徑上
#    抽掉來測試），那些不在這張卡的範圍裡——它們不是產品程式，也沒有「一被載入就污染整套
#    測試」那個形狀。
#
# 6) 那一條咬的是「有沒有碰」，不是「有沒有在被載入的時候碰」。寫在函式裡面一樣紅。
#    故意比舊帳那一筆嚴一點：事故現場是在被載入的時候，但「拖到函式裡再改全域設定」
#    一樣看不出是誰改的，而要分辨這兩種，得先知道那個函式會不會在載入時被叫到——
#    那要等程式跑起來才知道。
#
# 7) 用 `from ...xxx` 那種往上數幾層的寫法，一律紅，不是悄悄放過。
#    第一版的程式把它跟「去拿新引擎外面的別人家套件」當成同一件事、兩種都丟掉不看，
#    找碴實測：同一條往上拿的線改寫成那種點點點的寫法就回綠了，而那明明是一行寫在那裡、
#    看得一清二楚的往上拿。這一版判紅，訊息裡直接說「這是往上數幾層的寫法」。
#    要拿就把名字寫全，讓它被判一次方向。
#
# 8) **這兩種寫法今天真的抓不到，照實寫下來**（2026-09-11 找碴實測）：
#    ①先用 `getattr(os, "environ")` 把那張設定表繞一手拿到手，再去改它；
#    ②先寫 `P = "JAX"`，再 `N = P + "_ENABLE_X64"` 把設定名字拼出來。
#    抓不到的原因：這支檢查只追得到「名字綁到哪裡」，追不到「某個呼叫回傳了什麼」，
#    也不會去算兩段文字拼起來變成什麼。
#    為什麼不補：兩種都要做一整套「資料在這支檔裡流到哪裡」的分析，那是另一個量級的工程；
#    而它們擋的是「有人刻意要繞」，這種寫法在送審的時候一眼就看得出來
#    （沒有人會為了正當理由把一個設定名字拆成兩半再拼回去）。成本不成比例，
#    所以是選擇不做，不是沒看見。
#
# 9) 順序表本身對不對，機器判不出來。它是人填的，改它就等於改判準。
#    壓住它的是兩件事：它寫在卡上、看得見，改它要送審；以及上面那一段實際量到的數字
#    ——改了順序就要重新量一次，會紅的地方是變多還是變少，在送審的時候看得見。
