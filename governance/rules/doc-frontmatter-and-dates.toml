# 規矩卡：docs 底下的設計文件與知識文件要有齊全的標頭；份數逐類與總量都有上限；
#         docs 三類與兩份入口檔的每一行有字元上限；三類裡面不准再分層
# 決策紙：docs/decisions/docs-three-classes.md（docs 只准三類、平行不分層、三道柵欄）。
#         這張卡是那張紙第二道柵欄（限數量）的機器版，加上「標頭齊全」這一條。
#
# 2026-09-10 老闆拍板：暫緩卡 doc-size-cap 不另立，它沒人守的兩顆牙併進這張卡
# （見 blueprint/cards-38.json 那張卡的 feasibility_v2 = "merged"）。併進來的是：
#   ③ docs 的總份數上限——那張卡 check_idea_v2 的「新增②總量上限」原文：「v2 的病是
#      『1046 份把 76 份設計埋掉』，那是總量問題，各類各自壓線通過照樣會重演」。
#   ④ 單行字元上限——那張卡 check_idea_v2 的「次閘保留體積」裡那一句（「曾有一行
#      1,027 字元」，事故 governance-file-has-no-guard 的 frontmatter 版本史那一行）。
# 那張卡另外兩顆牙本來就已經有人守，不重複開：入口檔的行數上限住在
# entry-files-rendered-from-registry（那張卡管一份幾行），類別封閉住在
# file-placement-allowlist（docs 根層准出現哪些目錄名）。
#
# 分工（刻意不重疊——兩張卡掃同一件事會互相遮蔽，那是 v2 事故 guard-teeth-shadow-each-other
# 的形狀，所以每一條都寫明誰在看哪一格）：
#   decision-paper-structure  ——決策紙那一層的 frontmatter 與取代鏈。這張卡不看決策紙的欄位，
#                                只把它算進份數；那一層的每一格由那張卡判。
#   file-placement-allowlist  ——docs 根層准出現哪些目錄名與檔名（深度一層）。第四類目錄
#                                進來由它咬，這張卡只印一行 NOTE 說「這一類沒登記、我不判它」。
#                                它看不到的是深度：那張卡自己的人話就寫「已核准的目錄裡面長
#                                多少子目錄它看不到」，這張卡的第⑤條補的就是那一段。
#   entry-files-rendered-from-registry
#                              ——入口檔有幾行（`[settings] max_lines`）。這張卡的第④條量的是
#                                同兩份檔的「每一行多寬」，不是幾行；兩個數字兩張卡，各一個家。
id = "doc-frontmatter-and-dates"
human = "docs 底下的設計文件與知識文件要有齊全的標頭，份數逐類有上限、全部加起來另有一個總量上限，docs 三類與兩份入口檔的每一行都有字元上限，三類裡面不准再分層。五條：①`docs/design` 與 `docs/cairn` 的每一份 .md，frontmatter 必填題目、建檔日、改檔日、種類、摘要，少一格或留空就紅；種類那一格的值必須跟它住的那個目錄同名（住 design 就要寫 design、住 cairn 就要寫 cairn），改檔日不准早於建檔日，日期讀不成日期也紅。**刻意不比 git 的提交日**——squash merge 之下作者寫檔那天不可能預知合併日，實測過，拿提交日當尺會變成作者滿足不了的要求。②三類各有份數上限：拿 `git ls-files` 的列舉集合逐類數 .md（以版控索引為準，不走檔案系統掃描——v2 就是用 rglob 把被忽略的檔算進去假紅），超過那一類登記在這張卡 `[settings]` 的上限就紅；`.gitkeep` 這種不是文件的檔不算。③docs 底下全部的 .md 加起來還有一個總量上限，超過就紅：v2 的病是一千多份文件把七十幾份設計埋掉，那是總量的病——各類各自壓在自己那條線下面、加起來照樣重演，所以逐類上限之外要有一條總量的線。④單行字元上限：docs 三類的每一份 .md，加上卡上 `line_extra_paths` 列的那兩份入口檔，每一行的字元數都不准超過卡上的 `max_line_chars`。v2 有一份治理檔的版本史寫成一行超過一千字元——那種一行沒有人讀得完，diff 也看不出改了哪裡。入口檔的規矩節本來就是一張卡一行整段人話，這一條立起來的同一個 PR 把產生器改成一張卡只渲染人話的第一句：那一段是產物，多寬由生成器決定，不由卡的作者寫多長決定。⑤三類裡面不准再開子目錄：docs 底下的檔只准住在「類別目錄／檔名」那一層，再深一層就紅——決策紙寫的是「平行不分層」，而 docs 根層的目錄白名單只看得到最上面那一層。三種上限都是初值，怎麼量出來的寫在卡的註解裡，要調就改卡、走 PR。分工：決策紙的欄位與取代鏈歸 decision-paper-structure（這張卡只數它的份數、不看它的欄位）；docs 根層准出現什麼歸 file-placement-allowlist（這張卡補它看不到的深度，類別封閉也歸它）；入口檔有幾行歸 entry-files-rendered-from-registry（那張卡管幾行，這張卡管每一行多寬）。刻意沒管：決策紙第三道柵欄「算得出來的不存檔」——一份手抄的架構圖跟一份真的設計文件長得一模一樣，機器判不出來，這一格靠人看 PR。讀不到這張卡的 `[settings]`、docs 那一層一個檔都沒有、某份 md 讀不開，一律回 2 不回 0。"

# 掃描面：docs 整層（三類的 md 要驗欄位、全部要數份數、量深度、量每一行多寬），
# 加上卡上 line_extra_paths 列的那兩份入口檔（第④條要量它們的每一行），
# 加上所有規矩卡（上限與名單都寫在卡上，這支檢查要打開每一張卡去找自己那一張
# ——真的讀了就要宣告）。入口檔那兩格同時寫在 [settings].line_extra_paths：
# 那邊是給程式讀的，這邊是宣告掃描面；兩邊不一致會被 scan-scope-has-no-holes 咬。
scope = [
  "docs",
  "CLAUDE.md",
  "AGENTS.md",
  "governance/rules",
]
check = "governance/checks/doc_frontmatter_and_dates.py"
negative_fixture = "governance/fixtures/doc-frontmatter-and-dates"
control_fixture = "governance/fixtures/doc-frontmatter-and-dates/control"
declared_level = "blocking"
enforcer = "github-actions-job"
job = "verify"
external_tools = ["git"]

# 血債：docs-volume-buries-the-design（v2-audit/lessons.json，legacy_id L37）。
# 那筆事故的 enforcer 欄逐字寫著「CI：docs 各類 `git ls-files -- docs/<class>` 計數上限測試
# ＋ 目錄 schema test」，v3_countermeasure 也寫「CI 以 git ls-files（index 為 authority，
# 不用 rglob，避免 ignored transcript 假紅）對每類計數設上限，超標即紅」——第②條就是那一句。
# 事故當下會回紅：docs/ 1046 份（agents 383、reviews 253、checkpoint 75、design 76），
# 任何一個合理的每類上限都被穿破。同一筆事故裡的 rglob 假紅（08-25 把 19 份被忽略的
# transcript 算進去，141 對 160）也一起避開了：這支檢查數的是列舉集合，不是檔案系統。
#
# 同一筆事故 doc-size-cap 那張暫緩卡原本也認領（它的 lesson_ids_v2 就是這一筆）。2026-09-10
# 老闆拍板那張卡不另立，總量上限（第③條）與單行字元上限（第④條）併進這張卡，見檔頭。
# 那筆事故的 v3_countermeasure 只寫了逐類上限；總量那一條是找碴席第二輪補的，理由抄在
# blueprint/cards-38.json 的 critic_v2.findings：「只有逐類上限、沒有總量上限，而 v2 的病
# 正是『各類各自不超標、加總把 design 埋掉』」。
#
# 事故自己記了一個這條機制擋不住的反例，照實抄在這裡不遮：「139 份 live 全屬已閉案封存，
# cap 150→24」——上限訂得鬆的時候，139 份在 cap 150 之下不會響，是人事後盤點才把上限砍到 24。
# 「上限訂多鬆才算鬆」機器判不了，只能靠人定期回頭看卡上那幾個數字。總量上限也吃同一個縫：
# 它擋得住「各類各自壓線、加起來爆掉」，擋不住「總量訂得太鬆」。
# 第②③條的血債是 docs-volume-buries-the-design；第④條（單行字元上限）的血債是
# governance-file-has-no-guard——那筆事故的 what_happened 逐字寫著「frontmatter 版本史
# 一行 1,027 字元」，在事故當下這一條會回紅（那份檔是 v2 的 standards 那個 repo 裡的
# 變更記錄，形狀對得上這張卡的掃描面：版控裡的文件。路徑刻意不寫全，那棵樹不在這裡，
# 寫了會被 refs-and-links-resolve 判成死引用——實測過，那一條當場咬了一筆）。
# 同一筆事故的另外幾半歸別張卡：入口檔由生成器
# 產出、手改即紅、行數上限，全在 entry-files-rendered-from-registry。
blood_debt = [
  "docs-volume-buries-the-design",
  "governance-file-has-no-guard",
]
related_lessons = ["index-docs-recopy-facts-that-drift"]
related_lessons_why = "index-docs-recopy-facts-that-drift 對到的是決策紙第三道柵欄「算得出來的不存檔」（那筆事故的病是文件抄了會漂的事實：識別字、路徑、「已完成／parked／零 caller」這種時間點狀態句）。這張卡查的是標頭有沒有齊、有幾份、住得多深、每一行多寬，查不到「抄進來的那句話今天還對不對」——同一份 md 標頭寫得再齊、每一行都不長，內文抄一份會過期的架構圖它照樣回綠。所以記關聯不算血債：在那筆事故當下這張卡回 0。那一句本來排給暫緩卡 derived-content-rendered-not-handwritten，2026-09-10 老闆拍板那張卡不另立（見 blueprint/cards-38.json 的 feasibility_v2 = \"merged\"）：它「生成物不准留佔位」那顆牙併進了 entry-files-rendered-from-registry，而「文件裡宣稱的設定值要跟實際設定檔一致」這半今天還是沒有機器在守——這一格照舊靠人看 PR。"

[mountpoint]
trigger = "pull_request，以及 push 到 main"
runs_on = "cloud-authority"
result_to = "GitHub Actions 的 verify job 結論"
blocks_merge = true

# 上限、欄位名與類別名只寫在這裡，不寫死在檢查程式（讀不到就回 2，不回 0）。
# 每一份必紅樣本底下也帶一份同樣形狀的 [settings]，因為每份樣本都是獨立的掃描根。
[settings]
# docs 那一層在掃描根裡的位置（相對掃描根，結尾一定帶斜線）。
docs_prefix = "docs/"
# 算「一份文件」的副檔名。.gitkeep 這種佔位檔不是文件，不算份數、也不驗欄位。
doc_suffix = ".md"
# 三類各自的份數上限，一類一格：鍵是 docs 底下那個目錄名，值是那一類准有幾份 .md。
# 這三個數字是**初值**，來源是立卡當天實跑 `git ls-files` 數出來的現況再留成長空間：
# decisions 當天 16 份（決策紙一題一檔，會持續長），design 與 cairn 當天各 0 份。
# 上限的意思不是「可以長到這裡」，是「長到這裡就得先刪再加」；要調就改這三行、走 PR。
class_caps = { decisions = 60, design = 40, cairn = 40 }
# docs 底下全部 .md 加起來的總量上限（第③條）。
# 這個數字怎麼定的：三類上限加起來是一百四十份，總量取它的八五折再湊成整數（一百二十）。
# 為什麼不等於三類相加：等於相加的總量上限永遠不會先響——三類都爆了它才爆，那就是一條
# 只會回綠的規矩，而 v2 的病正是「各類各自壓在自己那條線下面、加起來把設計埋掉」。
# 打八五折的意思是「三類不准同時逼近自己的上限」，先響的是總量這一條。
# 這個 PR 當天實跑數到十九份 .md（全在 decisions，design 與 cairn 各零；量法同上一行），
# 離這條線還很遠——留出來的空間是給後續的決策紙與設計文件長的，不是可以長到這裡。
total_cap = 120
# 每一行的字元數上限（第④條），docs 三類的 .md 與 line_extra_paths 那兩份入口檔共用一個數字。
# 這個數字是實跑量出來的，不是想像的。量法（`git ls-files` 的列舉集合，逐檔逐行取 max）：
#   改之前：入口檔最長一行 1143 字元（規矩節一張卡渲染整段人話），docs 最長一行 219 字元。
#   把產生器改成一張卡只渲染第一句之後：入口檔最長一行 411 字元
#   （ci-jobs-cannot-die-quietly 那張卡的第一句本來就長），docs 那邊不受影響、還是 219。
# 門檻取修完之後最寬鬆那個值再往上一點：440。這是棘輪不是理想值——它擋的是「從今天起
# 變得更糟」，順便逼新卡的第一句寫短。v2 那一行 1,027 字元在這條線之上，當下會回紅。
max_line_chars = 440
# 第④條除了 docs 三類之外還要量的檔（相對掃描根）。這兩份是入口檔，它們每次開工都會被讀，
# 一行讀不完的代價最大。這一格是掃描面宣告，不是門檻：它跟上面的 scope 一一對應，
# 由 scan-scope-has-no-holes 守著（宣告了沒掃是洞，掃了沒宣告是越權）。
# 照實記一個洞：入口檔「有哪幾份」的家在 entry-files-rendered-from-registry 的
# entry_files，這裡是第二份清單。哪天那張卡加了第三份入口檔而這一行沒跟上，第④條就量不到
# 那一份（是洞、不是假紅）。今天不改成跨卡去讀那一份：那會讓這張卡的每一份必紅樣本樹都得
# 多放一張別人的卡，而樣本樹是獨立掃描根、多一張卡就多一組要維護的 [settings]。
line_extra_paths = ["CLAUDE.md", "AGENTS.md"]
# 要驗 frontmatter 的類。值同時就是那一類的 md 該寫的種類——目錄名與種類同名，
# 所以「種類跟目錄不一致」是拿目錄名直接比出來的，不用另開一份對照表。
# 刻意不含 decisions：那一層的每一格由 decision-paper-structure 判（分工見檔頭）。
frontmatter_classes = ["design", "cairn"]
# frontmatter 必填的五格。少一格或值是空的都算沒填。
required_fields = ["title", "date_created", "date_modified", "kind", "summary"]
# 種類那一格的鍵名（值要等於它住的那個目錄名）。
kind_field = "kind"
# 兩個日期欄位的鍵名。後者不准早於前者。
date_created_field = "date_created"
date_modified_field = "date_modified"
