# 規矩卡：寫法警衛（好習慣卡，0 血債）
# 這張卡不是從某一筆 v2 事故長出來的。找碴席（cards-38.json 的 critic_v2）把 66 筆重掃一次，
# 確認沒有任何一筆的本體是這幾條寫法規則之一——所以 blood_debt 是空的，related_lessons 也空。
# 它的價值是「從今天起別長歪」：一條寫法規則的收益全在未來，不在補洞。
id = "style-guard"
human = "寫法警衛，掃版控裡的每一支 .py（扣掉必紅樣本樹與本機工具目錄），五條。①`print` 只准出現在輸出層——輸出層是這張卡 `[[settings.allow]]` 具名列出的那幾個檔，每筆帶理由與到期日（那兩格由 exemptions-need-expiry 那張卡守）；別的檔要對人說話就走 `governance/exit_codes.py` 的 `note()`，不要自己 print，因為散在各支程式裡的 print 混在判決輸出裡，看不出哪一行是收據哪一行是隨手記的。名字是**解析出來的、不是比字面**（共用零件 `governance/names.py`）：`p = print` 之後的 `p(...)`、`import builtins` 之後的 `builtins.print(...)`、`from builtins import print as w` 之後的 `w(...)` 都咬，三種都是實測戳出來的洞、各有一份必紅樣本；`sys.stdout.write` 與 `logging` 還是繞得過去，照實記在卡的檔尾。②字串拼路徑：`+` 拼出來的字串流進開檔／路徑／子程序參數（`open()`、`Path()`、`os.path.*` 系列、`subprocess` 的 argv）才紅，看到字串相加不會紅——判準刻意收窄成「拼接鏈裡有字串字面值，而且結果直接當參數、或先指給同一個作用域裡的一個名字再當參數」；乾淨樹裡 `blueprint/remap_cards.py` 就有一處 `json.dumps(...) + 換行` 的拼接，它流進的是檔案內容不是路徑，所以不咬。③開檔一律 `with`：`open(...)` 不在某個 `with` 的頭上就紅（`Path.read_text`／`write_text` 合法，它們自己關）。④函式的行數（不含文件字串）與分支數超過這張卡 `[settings]` 登記的門檻就紅；門檻怎麼量出來的寫在卡的註解裡，人話這裡不抄數字。⑤一支檔的行數超過這張卡 `[settings]` 登記的上限就紅。這一條數的是整份檔有幾行，空行、註解、說明文字全部算進去（第④條會把函式自己的說明扣掉，那是為了不罰寫說明；這一條問的是「一個人要看完這支檔要捲多少畫面」，說明也要捲，所以不扣）。為什麼要有它：一支檔大到看不完，改它的人就只能挑一段看一段改，旁邊那一段會不會被自己弄壞沒人知道；上一代那棵樹拆過大檔，拆完又長回去，因為從來沒有上限。上限是多少、怎麼定出來的、當時量到哪些數字，寫在這張卡登記簿旁邊的註解裡，人話這裡一樣不抄數字。這幾條之外的寫法規則交給 ruff：規則集與它自己的數字住在 `pyproject.toml` 的 `[tool.ruff]`（只有一份、走 PR 看得到），CI 有獨立一步 `uv run ruff check`。ruff 裝不起來這支檢查回 2 不回 0——ruff 是這張卡的另一半，它不在的時候「沒問題」這句話不算數。讀不到這張卡的 `[settings]`、掃描面上一支 .py 都沒有、某支 .py 剖不開，一律回 2 不回 0。"

# 掃描面：進得了版控的每一支 .py，扣掉必紅樣本樹（那是別的掃描根，由後設測試單獨餵）
# 與本機 agent 工具目錄（雲端 checkout 不會有，底下還有工作樹副本會把同一批檔算兩次）。
# 加上所有規矩卡：門檻與輸出層白名單都寫在卡上，這支檢查要打開每一張卡去找自己那一張。
scope = [
  "governance/rules",
  "**/*.py",
  "!governance/fixtures",
  "!.claude",
]
check = "governance/checks/style_guard.py"
negative_fixture = "governance/fixtures/style-guard"
control_fixture = "governance/fixtures/style-guard/control"
tool_broken_fixture = "governance/fixtures/style-guard-tool-broken"
declared_level = "blocking"
enforcer = "github-actions-job"
job = "verify"
# ruff 列在這裡是認真的：抽掉它這支檢查回 2（後設測試第 4 回會驗），
# 因為這張卡的另一半就是 CI 上那一步 uv run ruff check。
external_tools = ["git", "ruff"]

# 0 血債。這張卡不認領任何 v2 事故：找碴席把 66 筆重掃一次，沒有一筆的本體是寫法規則。
# 原稿曾掛 interpreter-environment-never-machine-bound，被找碴席判 unrelated 拿掉了
# ——那筆事故的五個失敗形狀全在 repo 原始碼之外（啟動方式、ambient path、site-packages、
# 套件清單），真正承接它的是 uv-single-entrypoint 那張卡。這裡不重掛。
blood_debt = []
related_lessons = []

[mountpoint]
trigger = "pull_request，以及 push 到 main"
runs_on = "cloud-authority"
result_to = "GitHub Actions 的 verify job 結論"
blocks_merge = true

# ── 門檻與名單只寫在這裡 ────────────────────────────────────────────────────
# 檢查程式沒有預設值：讀不到這一段就回 2，不回 0。
# 每一份必紅樣本底下也帶一份同樣的 [settings]（`allow` 那一格改成空的），
# 因為每份樣本都是獨立的掃描根，檢查程式只從掃描根自己的 governance/rules/ 讀。
#
# ④ 的兩個門檻怎麼定的（立卡當天用 AST 量真樹，不是想像的）：
#   量的對象是掃描面上每一支 .py 的每一個函式，巢狀的 def 各自算、外層不把內層算進去。
#   「行數」＝函式的起訖行數扣掉它自己的文件字串（這個 repo 的函式常常有很長的說明，
#    把說明算進行數等於在罰寫說明）；「分支數」＝函式身體裡 if／for／while／except／
#    with／三元／推導式／布林運算／assert／match case 的節點數。
#   門檻取「今天最寬鬆的那個函式再往上一點」，所以乾淨樹當天是 0 命中，而且任何一個
#   函式再長大就會紅。這是棘輪不是理想值：它擋的是「從今天起變得更糟」。
#   實際量到的最大值寫在 PR 描述裡，不寫在這裡也不寫在人話欄——那個數字會漂，
#   而門檻本身就登記在下面，要知道今天多寬看下面那兩行。
#
# ⑤ 的門檻（max_file_lines）怎麼定的，老闆 2026-09-11 拍板，四條證據：
#   a) 今天的樹量得到（版控裡的每一支 .py 扣掉必紅樣本樹，實跑數行數）：最長的一支是
#      tests/test_build_status.py 的 887 行，第二長 governance/status/collect.py 882 行，
#      沒有任何一支會被這個門檻咬到——立卡當天 0 支紅。
#   b) 上一代那棵樹量得到（本機 aosr-v2 那個 repo 的引擎目錄，實跑數行數，2026-09-11）：
#      174 支 .py 裡 17 支超過這個門檻，最長一支 3,448 行（多邊形最佳化那一支）。
#      那 17 支在新家一塊一塊重寫的時候本來就該拆——門檻定在這裡，等於把「本來就該拆」
#      變成寫到那一處的當下就會亮紅燈。
#   c) 上一代的舊帳（v2-audit/lessons.json 的 stats 段）：`god-file 1610→2486、7078→7451`
#      ——兩支大檔拆過一次，拆完又長回去，而且長得比拆之前還大。拆是一次性的動作，
#      沒有上限的話它不會留下來。旁邊那筆事故 homemade-contract-tool-missed-alias-imports
#      （L61）是那次拆檔的另一半代價：拆大檔用的自寫工具漏抓 import，砍掉被用的 re-export。
#      拆得愈晚愈大，那種代價就愈貴。
#   d) 業界有現成答案：這個數字是 Python 界 pylint 這支工具 `max-module-lines` 的預設值
#      （**未實跑複驗**——這棵樹沒裝 pylint，是照文件記的預設值寫的）。挑一個別人已經用了
#      很久的數，比自己發明一個看起來很合理的數少一次爭論。
#   這個數字跟 ④ 的兩個門檻不同：④ 是棘輪（取今天最寬鬆的再往上一點），⑤ 是外面拿進來的
#   標準值，今天的樹離它還有一段空間。要改它，一樣要走 PR 而且要附實測分布。
[settings]
max_function_lines = 68
max_function_branches = 42
max_file_lines = 1000

# ② 的路徑水槽（sink）：拼出來的字串流進這些呼叫就算「字串拼路徑」。
# 名單是資料、放在卡上，改寬要走 PR。刻意不含 write_text／read_text 這種
# 「內容」參數的呼叫——乾淨樹裡有兩處是把拼好的字串當**檔案內容**寫下去，那不是路徑。
path_sink_calls = ["open", "io.open", "Path", "pathlib.Path", "os.fspath"]
# 前綴比對：os.path 底下每一支（join／dirname／exists…）都算路徑水槽。
path_sink_prefixes = ["os.path."]
# 子程序：只看 argv 那一格（第一個位置參數，或關鍵字 args=），
# 不看 input=／env=／cwd= 之外的東西——那些不是「拼出來的路徑」。
subprocess_argv_calls = [
  "subprocess.run",
  "subprocess.Popen",
  "subprocess.call",
  "subprocess.check_call",
  "subprocess.check_output",
]
# ③ 這些呼叫一定要在 with 的頭上。
with_required_calls = ["open", "io.open"]
# 掃描面上不看這些前綴（跟 scope 的兩條 `!` 一一對應：那邊是宣告給人看的掃描面，
# 這邊是給程式讀的）。
scan_exempt_prefixes = ["governance/fixtures/", ".claude/"]

# ── ① 的輸出層白名單 ───────────────────────────────────────────────────────
# 一筆放行一個檔：那個檔裡的 print 是它的產品（CLI 輸出／收據行），不是拿來當 log。
# 判準是「這一行 print 是不是這支程式要交出去的東西」：是就在這裡具名放行，
# 不是就改寫法——治理層要對人說話走 governance/exit_codes.py 的 note()。
# 立卡那個 PR 就是照這個判準把 13 處「拿 print 當 NOTE」改成走 note()，清單才縮到三筆。

[[settings.allow]]
path = "governance/exit_codes.py"
reason = "這個檔就是輸出層本身：判決收據那一行、列舉模式的清單、HIT 與 FAIL、以及新加的 note()，全部住在這裡。整個治理層對外說的每一句話都從這幾支函式出去，所以 print 在這裡是產品不是紀錄。"
expires = "2026-12-08"

[[settings.allow]]
path = "blueprint/remap_cards.py"
reason = "產生器的命令列輸出：它跑完印的那一段統計（幾張卡、幾筆血債、幾個幽靈 id）就是它要交出去的東西，人照著那段判斷這一跑對不對。它不是被 CI 當閘用的檢查程式，沒有收據行的約定可走。"
expires = "2026-12-08"

[[settings.allow]]
path = "tests/test_fixture_runner.py"
reason = "後設測試第四回與第六回在卡宣告為空的時候，要把「已斷言為空、不是跳過」記到這一跑的輸出上，寫法是刻意關掉 pytest 的捕捉再印。那是這一跑的結果紀錄，改走別的管線就看不見了。"
expires = "2026-12-08"

[[settings.allow]]
path = "src/aosr/physics/room_paths.py"
reason = "新家第一個命令列工具（票 #181）：人看的路徑表、--json 的機器格式、--compare 的逐條判決，這三種標準輸出就是它要交出去的產品，跟 blueprint 那兩支產生器同一種東西。它不是被 CI 當閘用的檢查程式、也不在治理層，所以不走 governance/exit_codes.py 的 note()。列在這裡是為了讓豁免攤在卡上讓人審，而不是靠 sys.stdout.write 那條卡面自己記著的繞法。"
expires = "2026-12-08"

[[settings.allow]]
path = "blueprint/generate_config_cut1_answers.py"
reason = "產生器的命令列輸出，跟 blueprint/remap_cards.py 同一種東西：它跑完印的那幾行（寫到哪裡、每一支模組幾個常數幾筆探針）就是它要交出去的東西，人照著那段判斷這一跑對不對。它不是被 CI 當閘用的檢查程式、沒有收據行的約定可走；它跑在上一代自己的直譯器上（要拿上一代那 11 支模組的凍結值當標準答案），連 v3 的輸出層那支模組都不一定在，所以那些行只能是這支程式自己的產品。它的產物——新家那 11 支的標準答案檔——跟它住同一層（blueprint 底下）。"
expires = "2026-12-08"

# ── 這張卡刻意沒管的事（留在卡面，不要當成漏掉）────────────────────────────────
#
# 1) 原稿的「禁 sys.path」那條整條拿掉，不是漏掉。uv-single-entrypoint 那張卡的第二條
#    已經在守它（AST 判 sys.path 的 append／insert／extend 與指派，一律紅）。兩張卡掃同一
#    個對象、判同一件事，就是 v2 事故 guard-teeth-shadow-each-other 的形狀：改壞了不知道
#    是哪一張在咬，改對了也不知道是誰放的。一個對象一張卡。
#
# 2) ① 的白名單是一份人維護的清單，這是這張卡最大的洞（cards-38.json 的 still_leaky_reason
#    講的就是它）：把一整個檔加進白名單就等於在那個檔裡把這一條關掉，機器擋不住。壓住它的
#    只有三件事——清單在卡上看得見、每一筆要寫理由、每一筆有到期日（過期即紅，由
#    exemptions-need-expiry 判）。「這一筆該不該存在」要人看 PR。
#
# 3) ① 認的是「這個呼叫對象回指 builtins.print」，不是比字面（issue #47）。立卡當天只比
#    攤平後的字面，實測三種繞法全部 hits=0：`p = print` 之後 `p(...)`、`import builtins`
#    之後 `builtins.print(...)`、`from builtins import print as w` 之後 `w(...)`。
#    解析走共用零件 `governance/names.py`（三張卡同一份），三種各有一份必紅樣本盯著。
#    字面那一層留著當地板：別人寫 `from rich import print` 把它換成別的模組的同名函式，
#    那一行照樣咬——改判準只准變寬，不准變窄。屬性寫法刻意要求「底座真的回指 builtins
#    這個模組」，只比最後一段會把別人類別自己的 `self.print(...)` 誤咬。
#    還繞得過去的，照實記：`sys.stdout.write`、`logging`（今天樹裡零對象，沒有人用 logging，
#    先不咬——沒有對象的規則是只會回綠的規則）、`from builtins import *`（那一行之後看不見
#    綁定，這一條不像 type-guard 的星號那樣直接判紅，因為 print 不是只出自一個模組）、
#    跨檔 re-export（自家模組把 print 轉手出去，綁定解析只看一份檔自己的 import）、
#    以及執行期才決定的名字（`globals()["p"] = print`、`getattr(builtins, "print")`）。
#
# 4) ② 只認 `+`。f-string（`f"{a}/{b}"`）與 `%`／`.format()` 拼出來的路徑咬不到。刻意的：
#    實測乾淨樹裡 f-string 到處在拼子程序參數（`f"--junitxml={target}"` 這種），把 f-string
#    算進來會當場誤咬，而誤咬機比漏抓更糟。已知的洞，照實記。
#
# 5) ② 的資料流只走一手：拼接結果直接當參數，或先指給同一個作用域裡的一個名字再當參數。
#    經過函式回傳、經過 list／dict 中轉、跨作用域，都咬不到。
#
# 6) ③ 只認 `open`。`os.open`、`tempfile.NamedTemporaryFile`、`socket` 這些同樣需要顯式關閉
#    的資源不管——今天樹裡零對象。
#
# 7) ④ 量的是行數與分支數，不是「這個函式在做幾件事」。把一個大函式切成兩個一樣糾結的小函式
#    就過得去。這一條的價值是棘輪（不准比今天更糟），不是設計品質。
#    ruff 那半量的是另外兩種東西：循環複雜度（C901）與語句數（PLR0915），數字住在
#    pyproject.toml。刻意沒開 ruff 的 PLR0912（分支數）——分支數的門檻已經登記在這張卡上，
#    開了就有兩個家，那正是 thresholds-live-only-in-registry 在罰的事。
#    也刻意沒開 ruff 的 T20（print）：這一條的規矩不是「不准 print」而是「只准在輸出層」，
#    ruff 表達不了白名單，開了就得靠 lint 設定裡的整批豁免或一堆行內抑制去補，
#    那份清單會跟這張卡上的清單各自漂——而設定檔層級的整批豁免今天連
#    exemptions-need-expiry 都看不到（那張卡的檔尾第 4 條自己寫了）。
#
# 8) ⑤ 對每一種 .py 用同一個上限：治理層的程式、測試檔、以後新家的引擎程式，都是同一個數。
#    測試檔今天沒有另一個數，是刻意的：今天樹裡最長的那一支就是測試檔，離上限還有一段空間，
#    先立一個沒有對象的第二門檻只會多一個會漂的數字。要不要給測試檔另一個數，
#    等真的有一支測試檔被咬到那天再談——那時手上會有「它為什麼長成這樣」的實例可以看。
#
# 9) ⑤ 量的是行數，不是「這支檔在做幾件事」。把一支大檔切成兩支一樣糾結的檔就過得去，
#    切完之後兩支互相拿來拿去也不管（那是別的形狀，新家那邊由 layers-import-downward-only
#    在守，今天的治理層沒有卡在守）。這一條的價值是「大到沒人看得完」這個下限，不是模組設計。
#    ruff 那半也沒有對應的規則：pyproject.toml 的 select 裡沒有檔案長度那一類，
#    所以這一條只有這支程式在判，沒有第二道獨立實作當後盾。
