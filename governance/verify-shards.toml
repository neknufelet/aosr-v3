# schema 2：每片全套清點相同；未登記檔依 POSIX 路徑的 SHA-256 雜湊分片。
# _search_worker_cases 的 lru_cache 只在行程內；xdist 跨行程不保證共用，所以不登記。
# _report_cache 的單對物理（shared_control_pair）兩片各算一次，本機收據逐題時間約二十秒，接受、不登記；控制組結果（shared_control_result）那一群才是重算會變一百多秒的。
schema = 2
shards = ["shard-a", "shard-b"]
unregistered = "path-hash"

[evidence]
dir = "governance/receipts/shard"
expected = "expected.txt"
args = "pytest.args"
junit = "junit.xml"
manifest = "manifest.json"

