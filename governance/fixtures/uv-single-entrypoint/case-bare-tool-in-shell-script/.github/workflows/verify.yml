name: verify
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: 裝依賴（鎖死）
        run: uv sync --locked
      - name: 跑 lint（呼叫腳本，workflow 看起來很乾淨）
        run: bash scripts/lint.sh
