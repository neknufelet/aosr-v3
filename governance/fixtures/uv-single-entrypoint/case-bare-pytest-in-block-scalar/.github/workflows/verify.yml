name: verify
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: 裝依賴（鎖死）
        run: uv sync --locked
      - name: 跑測試（多行區塊，裸 pytest 藏在第二行）
        run: |
          set -euo pipefail
          pytest -q --junitxml=governance/receipts/pytest.junit.xml
