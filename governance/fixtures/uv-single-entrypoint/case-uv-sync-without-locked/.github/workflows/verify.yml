name: verify
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: 裝依賴（沒帶 --locked）
        run: uv sync
      - name: 跑檢查
        run: uv run python -m governance.checks.stub_check --scan-root .
