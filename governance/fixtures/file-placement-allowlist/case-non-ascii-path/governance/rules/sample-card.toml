# 樣本卡：只給 file-placement-allowlist 的必紅樣本用，不是真的規矩。
id = "sample-card"
human = "樣本卡：根層白名單放過 notes/，所以只剩「路徑必須純 ASCII」那一關會咬。"
scope = ["."]
check = "governance/checks/file_placement_allowlist.py"
negative_fixture = "governance/fixtures/sample-card"
control_fixture = "governance/fixtures/sample-card/control"
declared_level = "blocking"
enforcer = "github-actions-job"
job = "verify"
external_tools = ["git"]

[[allowlist]]
dir = "."
files = ["WHY.txt"]
dirs = ["governance", "notes"]

[mountpoint]
trigger = "pull_request"
runs_on = "cloud-authority"
result_to = "GitHub Actions 的 job 結論"
blocks_merge = true
