# 必紅樣本用的迷你卡：帶 id、[settings]，加這份樣本要的頂層 [[by_design]]。
# 每份樣本都是獨立的掃描根，檢查程式只從掃描根自己的 governance/rules/ 讀門檻，
# 所以每份樣本都要帶一份同樣的 [settings]。
# 刻意不寫 check 欄：樣本樹裡沒有 governance/checks/ 底下那支程式。
# `allow` 刻意是空的——樣本要證明的是「這一條會咬」，不是「白名單有在用」。
id = "style-guard"

[settings]
max_function_lines = 68
max_function_branches = 42
max_file_lines = 1000
path_sink_calls = ["open", "io.open", "Path", "pathlib.Path", "os.fspath"]
path_sink_prefixes = ["os.path."]
subprocess_argv_calls = [
  "subprocess.run",
  "subprocess.Popen",
  "subprocess.call",
  "subprocess.check_call",
  "subprocess.check_output",
]
with_required_calls = ["open", "io.open"]
scan_exempt_prefixes = ["governance/fixtures/", ".claude/"]
allow = []

[[by_design]]
path = "gone_tool.py"
reason = "樣本：假的命令列工具，print 就是它交給人的產品。"
[by_design.prints]
"main" = 1
