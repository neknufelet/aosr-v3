name: verify
on: [pull_request]
jobs:
  shard-a:
    runs-on: ubuntu-latest
    steps:
      - run: uv run python -m governance.status.record_step --name style_guard --out-dir governance/receipts/steps -- uv run python -m governance.checks.style_guard --scan-root .
      - run: uv run python -m governance.status.record_step --name refs_and_links_resolve --out-dir governance/receipts/steps -- uv run python -m governance.checks.refs_and_links_resolve --scan-root .
      - run: uv run python -m governance.status.record_step --name prepare --out-dir governance/receipts/steps -- uv run python -m governance.status.shard_prepare --shard shard-a
      - run: uv run python -m governance.status.record_step --name pytest --out-dir governance/receipts/steps -- uv run pytest --junitxml=governance/receipts/shard/junit.xml
      - run: uv run python -m governance.status.record_step --name seal --out-dir governance/receipts/steps -- uv run python -m governance.status.shard_seal --shard shard-a
  shard-b:
    runs-on: ubuntu-latest
    steps:
      - run: uv run python -m governance.status.record_step --name style_guard --out-dir governance/receipts/steps -- uv run python -m governance.checks.style_guard --scan-root .
      - run: uv run python -m governance.status.record_step --name refs_and_links_resolve --out-dir governance/receipts/steps -- uv run python -m governance.checks.refs_and_links_resolve --scan-root .
      - run: uv run python -m governance.status.record_step --name prepare --out-dir governance/receipts/steps -- uv run python -m governance.status.shard_prepare --shard shard-b
      - run: uv run python -m governance.status.record_step --name pytest --out-dir governance/receipts/steps -- uv run pytest @governance/receipts/shard/pytest.args --junitxml=governance/receipts/shard/junit.xml
      - run: uv run python -m governance.status.record_step --name seal --out-dir governance/receipts/steps -- uv run python -m governance.status.shard_seal --shard shard-b
  verify:
    runs-on: ubuntu-latest
    needs: [shard-a, shard-b]
    if: ${{ always() }}
    steps:
      - if: ${{ always() }}
        uses: actions/checkout@v4
      - if: ${{ always() }}
        uses: actions/download-artifact@v4
        with:
          pattern: receipts-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: governance/receipts/parts
      - if: ${{ always() }}
        env:
          AOSR_FINALIZER_NEEDS: ${{ toJSON(needs) }}
        run: uv run python -m governance.status.record_step --name green_must_be_real_green --out-dir governance/receipts/steps -- uv run python -m governance.checks.green_must_be_real_green --scan-root .
