name: verify
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 跑測試並產收據（實際跑法藏在腳本裡）
        run: bash scripts/run_tests.sh
      - name: 綠必須是真的綠
        run: python -m governance.checks.stub_check --scan-root .

