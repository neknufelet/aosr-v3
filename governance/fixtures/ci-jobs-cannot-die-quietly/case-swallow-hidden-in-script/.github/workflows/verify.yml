name: verify
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: uv run python -m governance.status.record_step --name checks --out-dir governance/receipts/steps -- bash scripts/run-checks.sh
