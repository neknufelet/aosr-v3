name: verify
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: uv sync --locked
      - run: |
          uv run python -m governance.status.record_step --name pytest --out-dir governance/receipts/steps -- uv run pytest &
