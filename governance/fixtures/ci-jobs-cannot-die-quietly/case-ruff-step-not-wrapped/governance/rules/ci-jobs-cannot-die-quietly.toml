# 樣本用的卡：只帶 id、check 與 [settings]。每一份樣本都是獨立的掃描根，檢查程式的門檻
# 只從掃描根自己的 governance/rules/ 讀，讀不到就回 2（不回 0）。
# 底下的 [settings] 與卡面註解從主卡 governance/rules/ci-jobs-cannot-die-quietly.toml 逐字複製。
id = "ci-jobs-cannot-die-quietly"
check = "governance/checks/ci_jobs_cannot_die_quietly.py"

# 門檻與名單只寫在這裡，不寫死在檢查程式（讀不到就回 2，不回 0）。
# 每一份樣本底下也帶一份同樣的 [settings]，因為每份樣本都是獨立的掃描根。
[settings]
# job 的 timeout-minutes 上限（分鐘）。缺席等於沒有上限、可以無聲卡死；
# 上限開太寬等於沒有上限。今天的數字用實跑時間定，不是想像的：
# 2026-09-09 主線最近兩跑的 verify job 各 51 秒與 48 秒
# （GitHub Actions run 34349380538 與 34349903662 的 started_at→completed_at），
# 15 分鐘約 18 倍，留給第一批 16 張卡都立完之後長大的後設測試。
max_timeout_minutes = 15

# 「把離開碼吞掉」的字樣。清單是資料、放在卡裡，改寬要走 PR。
swallow_snippets = [
  "|| true",
  "|| :",
  "|| exit 0",
  "; true",
  "; exit 0",
  "set +e",
  "2>/dev/null",
  "2> /dev/null",
  ">/dev/null 2>&1",
  "> /dev/null 2>&1",
]

# job 的 if: 裡出現這些字樣，失敗的前置也照跑、紅的被漂成綠的。
# `${{ always() }}` 這種寫法一樣命中（比對的是子字串）。
forbidden_job_ifs = ["always()"]

# 「這一步真的在跑檢查或測試」的判準。只有 checkout／setup 的 job 命不中，一律紅。
# 第三條是 2026-09-10 立狀態頁那個 PR 加的：狀態頁那個 job 真的在做事（從版控與 GitHub
# 現算一頁 HTML，算不出來回 2 讓整個 job 紅），但它跑的不是 governance.checks. 底下的檢查、
# 也不是 pytest。名單是資料、放在卡上，改寬要走 PR——這一筆改寬的是「什麼算真的在做事」，
# 不是把任何一條放鬆：命不中這三個字樣的 job 照樣被判成空 job。
work_markers = [
  "governance.checks.",
  "governance.status.",
  "pytest",
]

# 多段管線裡出現這些字樣，就算作者處理過中段的離開碼。
pipefail_markers = ["pipefail"]

# 這些 shell 本身就帶 pipefail：GitHub 的 `shell: bash` 是 `bash -eo pipefail {0}`。
# 預設的 `run:` 不是這個——預設是 `bash -e {0}`，沒有 pipefail，所以管線那一條才有對象。
pipefail_shells = ["bash"]

# 第⑤條：擋得住合併的那幾個 job 底下每一個 run: 要嘛包抄寫員、要嘛是水管步驟。
# 為什麼要有這一條：2026-09-10 之前 ruff 那一步刻意不包抄寫員，理由只寫在 workflow 的註解裡，
# 沒有機器在守——「哪一步准不包」活在註解裡，下一個人再加一步不包的，收據就再缺一格。
#
# 「哪幾個 job 適用」刻意**不**登記在這裡：那份名單的家是版控裡的
# governance/required-status-checks.txt（rule-card-required-fields 讀的也是那一份）。
# 舊版在這裡登記過一格 receipt_job = "verify"，那是同一個名字的第二個家——程式只讀卡上那個、
# 沒驗 workflow 裡真的有這個 job，所以 job 一改名第⑤條就靜默停用，而卡面看起來還在守。
# 2026-09-10 拿掉。
#
# 抄寫員（把那一步真實離開碼記成一片收據、原封不動回那個離開碼的那一層）那一串命令。
# 登記的是整串命令不是一個字樣：認的是命令**開頭**等於這一串，出現在別的位置一律不算
# （行內註解裡寫一次、或塞在 `--` 後面當被跑的對象，都不算包）。
wrapper_command = "uv run python -m governance.status.record_step"
# 水管步驟：不是檢查、沒有判決可記的那幾種命令。比對命令的第一個字；寫兩個字就比前兩個字
# （`uv sync` 是裝依賴，`uv run …` 不是，所以這裡登記的是兩個字那一種）。
#
# 名單是**資料**，而且只列今天受管 job（名單讀 governance/required-status-checks.txt）裡
# 真的有的水管步驟——今天那個 job 底下唯一沒包抄寫員的 `run:` 就是 `uv sync --locked`，
# 所以名單只有這一筆。哪天 verify 真的多一個水管步驟，再走 PR 把那一筆加回來；
# 名單上留一筆今天零對象的字，等於先開一道沒人看的門。
#
# 2026-09-11 收窄（老闆當場拍板）：舊名單是 ["uv sync", "git", "gh", "cp", "mkdir"]，
# 而這一條比的是命令**開頭**，所以 `git` 與 `gh` 這兩個入口整個字放行等於放行任意命令——
# `git -c alias.rc='!uv run python -m governance.checks.x --scan-root .' rc` 與
# （前一行 `gh alias set --shell` 之後的）`gh rc` 都會以水管身分過關，那一段的離開碼
# 進不了收據，而卡面看起來守著。第一種 2026-09-11 實測真的過關。剩下的 `cp`、`mkdir`
# 今天零對象，一起拿掉。
#
# 以後要加回來的規矩：`git`／`gh` 這種底下能跑任意命令的入口**不准整個字加**；
# 加到子命令那一級（例如 `git fetch`）只是比較窄，**不是證明**——`--upload-pack` 這一類參數
# 會把值交給本機 shell 跑（2026-09-11 在 /tmp 實測：`git ls-remote --upload-pack='touch <檔>'
# <repo>` 回 128，但那個檔真的被建立了）。真要加就得連參數樣式一起限制（不准出現 `-c`、
# `--upload-pack`、`--receive-pack`、`--exec`），不然就是接受這個殘留。
# 必紅樣本 case-plumbing-git-alias 守著「整個字加回去」那一種；git alias 與 gh alias 兩種
# 寫法另外在 tests/test_ci_command_segments.py 的 ADVERSARIAL 各佔一列。
plumbing_first_words = ["uv sync"]

# 第⑥條：推機器分支撞到非快進時，重疊上去再推幾次才放棄。
# 為什麼這張卡管重試次數：重試用完那一步就回非零、那個 job 紅，所以它是「不准無聲死掉」的
# 門檻不是裝飾——調小了收據會在還沒推上去之前就放棄，那一跑的證據跟著消失；調大了撞車的
# 那一跑會一直重推佔著 runner。兩邊都不對，所以第⑥條比的是**相等**，不是上限。
# 這個數字怎麼來的：今天同時在推 status 分支的最多是 receipt 與 status 兩個 job 加上另一條
# PR 那一跑，三個撞在一起最多重疊兩次；登記的是那個次數的兩倍再多一次，不是想像的大數字。
# 對象是 .github/workflows/status.yml 那兩個 job 的推分支那一步（step 的 env）。
push_max_attempts = 5

# ── 這張卡刻意沒管的事（留在卡面，不要當成漏掉）──────────────────────────────
#
# 1) cron 型 workflow 的 48 小時心跳（cards-38.json 的 check_idea_v2 第②段）沒做。
#    要判「上一次成功時間在 48 小時內」得讀 GitHub API，那違反「檢查不上網」；
#    剩下能機器判的只有「有沒有配對的心跳 job」，那擋不住心跳自己靜默死掉。
#    今天 .github/workflows/ 底下也沒有任何 cron。要立就得先拍板「准不准 CI 上網讀
#    GitHub 自己的狀態」——那題已經開在 merge-gate-read-back 名下。
#
# 2) 順序條款（貴的 job 要 needs 便宜前置、審查排在回歸之前）整條沒有。
#    找碴席第二輪的理由：「哪個 job 算驗收」沒有機器判準。
#
# 3) step 層的 `if:` 不管，只管 job 層。step 寫 `if: always()` 不會把紅漂成綠
#    （那一步跑起來，job 照樣紅）；真正在 step 層漂綠的是 continue-on-error，
#    那個第①條已經咬。
#
# 4) 可重用 workflow 的 job（`jobs.<id>.uses:`）今天會被第④條判成空 job。
#    GitHub 也不准那種 job 寫 timeout-minutes，所以第③條對它同樣不成立。
#    今天零對象；真的要用 reusable workflow 時要回來改這張卡。
#
# 5) 管線那一條只認換行後每一行裡的單一個 `|`，而且先把引號裡的內容剝掉
#    （`grep 'a|b'` 不算）。把管線寫成 `bash -c "..."` 裡的字串就繞得過去，
#    這是已知的洞。
#
# 6) 第⑤條認的是「job 的名字列在 governance/required-status-checks.txt 裡」。名單與 workflow
#    一起改名照樣過得去——那份名單是人寫的期望，「主線的 ruleset 真的把它掛成必要檢查」歸
#    merge-gate-read-back（那一支准上網回讀），「卡宣告的 job 真的存在而且真的接到 CI」歸
#    rule-card-required-fields 的第一關。這裡不重複掃同一個對象。
#
# 7) 第⑤條把 `run: |` 區塊拆成一行一個命令，空行與 `#` 開頭的註解行不算，行內註解在比對前
#    剝掉（引號留著）；一行再依 `&&`、`;`、`||`、`|` 切段，每一段各自判；分類只認兩種正面
#    形狀（開頭等於 wrapper_command、或前幾個字命中 plumbing_first_words），認不出就紅。
#
#    **漏放：今天一條都沒有。** 2026-09-10（issue #104）把整行引號那一條修掉了——舊版分類前
#    先剝掉引號，於是整行被一對引號包住的命令剝完變成空字串，被「沒有命令就沒有離開碼可記」
#    當殘骸跳過、段數 0、不紅，而 shell 真的會執行它。現在「殘骸」只認原始那一行去頭尾空白
#    後是空的、或以 `#` 開頭那兩種，其他每一行都要分類得出來。必紅樣本三棵在守：
#    case-whole-line-quoted、case-command-substitution、case-background-ampersand。
#    整張對抗清單（整行引號的三種寫法、`$(…)`、反引號、`eval`、`sh -c`／`bash -c`、
#    環境變數前綴、`exec`／`time`／`nohup`／結尾 `&`、Tab、續行、git alias、gh alias、
#    正常的抄寫員行與水管行）逐列餵過分類函式，表在 tests/test_ci_command_segments.py
#    的 ADVERSARIAL。
#
#    **誤紅（紅得安全，不是漏放）四條，今天都是零對象**：
#    (a) 抄寫員後面用 Tab（不是空格）隔開參數時會誤判成紅——認的是「命令等於 wrapper_command，
#        或 wrapper_command 後面接一個空格」。今天名單上那個 job 底下每一步都用空格。
#    (b) 反斜線續行的第二行會被當成獨立的一個命令而誤紅（切段只在一行之內做，不接續行）。
#        if／while 這類多行結構同理。今天名單上那個 job 底下每一步都是單獨一行。
#    (c) `sh -c "..."`／`bash -c "..."` 包起來的那一整段判成認不出而紅。引號裡的不切，所以
#        裡面那串命令這一支看不進去；看不進去就不放行。舊版把這一條記成漏放，那是寫反了
#        （2026-09-10 實測：`bash` 不在水管名單、也不是抄寫員開頭，本來就會紅）。
#        第②條那個「把管線塞進 `bash -c` 字串就繞得過去」的洞還在，那是第②條的事。
#    (d) 環境變數前綴（`FOO=1 uv run …`）判成認不出而紅。這是選的，不是漏的：另一條路是
#        「先剝掉開頭的 KEY=VALUE 再判」，但那等於在分類前多開一道自己寫的剝皮工序，
#        剝錯就是新的漏放。要改成放行得先有真的對象，那時回來改這張卡。
#    (a)(b)(c)(d) 真的踩到時都要回來改這張卡，不是在 workflow 那邊繞。
#
# 8) 第⑥條只看 step 層的 `env:`。把 PUSH_MAX_ATTEMPTS 搬去 job 層、workflow 層，或改用
#    `${{ }}` 算出來的值，這一條就咬不到。今天零對象（status.yml 兩處都寫在 step 的 env），
#    真的搬上去時要回來改這張卡。另一個已知的洞：這一條只認 PUSH_MAX_ATTEMPTS 這個鍵名，
#    換個鍵名等於換個家。
#
# 9) 整支檢查回 2（讀不到門檻、讀不到那份名單、workflow 剖不開）會蓋掉同一跑其他五條的判決
#    ——那一跑就只剩「這一跑不算數」一句話。刻意接受：2 一樣擋合併、不會無聲，跟「回綠但其實
#    什麼都沒掃」不是同一件事。
#
# 10) verify 新增一步、而那一步本來就不印判決收據那一行時（例如 ruff），第⑤條會逼它包抄寫員，
#     於是它會出現在收據裡，而 receipt-schema-complete 會要求它印判決行——那一格要在**同一個
#     PR**登記進 governance/rules/receipt-schema-complete.toml 的 report_optional_names。
#     那張卡的檔尾寫了這件事的完整版與一個實例。
