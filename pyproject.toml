[project]
name = "aosr-v3-governance"
version = "0.1.0"
description = "aosr-v3 治理層：規矩卡、檢查程式、必紅樣本"
requires-python = ">=3.12"
# pyyaml：規矩卡 ci-jobs-cannot-die-quietly 要對 .github/workflows/*.yml 做真的 YAML 剖析。
# 為什麼不自己寫最小剖析：那張卡要分得清 job 層與 step 層的同名鍵、要把 timeout-minutes
# 讀成數字、要看得懂流式寫法（`{continue-on-error: true}`）與引號。縮排／正則的子集剖析
# 每一種都繞得過去，等於一個只會回綠的檢查——那是這個 repo 的頭號死因。
# 放在正式依賴不是 dev 群組：CI 是 `uv sync --locked` 之後直接 `uv run python -m
# governance.checks.<x>`，檢查程式跑起來就要有它。它不在的時候那支檢查回 2，不回 0。
dependencies = ["pyyaml>=6.0"]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# 模組搜尋路徑只在這裡宣告一次。tests/ 底下沒有 __init__.py，pytest 預設只把 tests/ 自己
# 放進搜尋路徑，`import governance` 與 `from tests.conftest import …` 都會找不到；拿掉這一行
# 實測就是 ModuleNotFoundError: No module named 'governance'。
# 刻意寫在設定裡、不寫在程式裡：規矩卡 uv-single-entrypoint 的第二條禁止任何
# sys.path.append／insert／extend（連由 __file__ 推出來的自我定位也禁），理由是那種寫法
# 一支程式一份、改了看不出來，而設定只有一份、走 PR 看得到。CI 跑檢查那邊不靠這一行：
# `uv run python -m governance.checks.<x>`（cwd 在 repo 根）本來就 import 得到。
pythonpath = ["."]
addopts = "-q"
# 不寫 .pyc（避免子程序拿到 __pycache__ 裡的舊位元碼）：pytest 沒有對應的 ini 選項，
# PYTHONDONTWRITEBYTECODE 是環境變數。同效設定寫在 tests/conftest.py 的
# sys.dont_write_bytecode = True；跑子程序的三個地方（後設測試、檢查裡的探針、
# 產收據那一跑）另外把那個環境變數帶進子程序。
# pytest 設定只准住在這個檔——另開 pytest.ini／tox.ini／setup.cfg 會被
# green-must-be-real-green 判紅（第二套設定等於第二種跑法）。
