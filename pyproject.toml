[project]
name = "aosr-v3-governance"
version = "0.1.0"
description = "aosr-v3：治理層（governance/、blueprint/）靠 cwd 跑、不打包；裝進環境的只有新家引擎 src/aosr"
requires-python = ">=3.12"
# pyyaml：規矩卡 ci-jobs-cannot-die-quietly 要對 .github/workflows/*.yml 做真的 YAML 剖析。
# 為什麼不自己寫最小剖析：那張卡要分得清 job 層與 step 層的同名鍵、要把 timeout-minutes
# 讀成數字、要看得懂流式寫法（`{continue-on-error: true}`）與引號。縮排／正則的子集剖析
# 每一種都繞得過去，等於一個只會回綠的檢查——那是這個 repo 的頭號死因。
# 放在正式依賴不是 dev 群組：CI 是 `uv sync --locked` 之後直接 `uv run python -m
# governance.checks.<x>`，檢查程式跑起來就要有它。它不在的時候那支檢查回 2，不回 0。
#
# pydantic：新家第一塊 `src/aosr/config`（票 #127）要用它——照抄的上游模組裡
# `spl_output` 用它定義 `SplOutputConfig`，新蓋的 `early_reflection` 用它定義
# `EarlyReflectionConfig`（兩者都是 frozen、extra 不准多、非有限值不准收）。上一代的
# 那一塊整塊靠它，v3 在這一塊之前沒有 pydantic。放正式依賴不是 dev 群組，理由同 pyyaml：
# 新家的模組是產品程式，不是只有檢查程式跑起來才需要它，而 CI 是 `uv sync --locked`。
# 第一塊（config，第 2 層）落地的時候**還沒有 JAX**：那一塊 12 支模組一支都不碰它，
# 而第 2 層本來就不准載入 JAX（決策紙 engine-first-block-config-shape 第二題）。JAX 是
# 第二塊（materials，第 3 層）帶進來的，見上面那一段——兩件事不衝突：依賴在清單上，
# 不等於第 2 層去載入它（那一條由分層卡與 #136 那張考卷守）。
# jax／jaxlib／flax／numpy：新家第二塊 `src/aosr/materials`（票 #134）要用它們——材料回應是
# 一個 JAX 的 pytree（會被 `jax.tree_util` 拆開再組回去、可以穿過 `jax.jit` 的資料結構），
# `flax.struct` 提供那個「葉子與靜態中介資料分開」的容器，`numpy` 負責 `from_alpha` 那段
# eager 的插值與夾擠。**版本釘死在 donor 鎖檔量到的那一組**（產生答案那一跑的環境記在答案檔的 `env` 檔頭裡）：標準答案
# 是在那一組上跑出來的，浮點的 dtype 與值跟著它們走，用別的版本比出來的差異分不清是「新家寫錯」
# 還是「函式庫換了」。只加這三支模組真的需要的，不搬上一代整包依賴。
# 放正式依賴不是 dev 群組，理由同 pydantic：新家的模組是產品程式。
# **第 2 層仍然不准載入 JAX**（決策紙 engine-first-block-config-shape 第二題）：這幾個依賴
# 進來的是第 3 層 `materials`，`config` 底下一支都不碰它們；全域開關只有 `runtime` 能動
# （規矩卡 layers-import-downward-only）。
dependencies = [
    # cython：pydiso 0.2.0 從原始碼產生擴充模組的正式建置輸入；因為本專案刻意關掉它的
    # build isolation，不能只放 dev 群組。>=3.1 是 pydiso build extra 自己宣告的下限，
    # 真正安裝版本仍由 uv.lock 鎖成一份。
    "cython>=3.1",
    "flax==0.12.7",
    # gmsh：第七段正式路徑切鞋盒四面體網格並交出節點與元素；產品執行時會直接 import，
    # 所以不是 dev 工具。4.15.2 是第 1 段跨行程重現與存根簽章實測的版本，釘住避免 API 漂移。
    "gmsh==4.15.2",
    "jax==0.10.1",
    "jaxlib==0.10.1",
    # meson：pydiso 原始碼建置的底層建置系統；no-build-isolation 下必須在正式環境先存在。
    # >=1.5 保留 pydiso 所需的現代 Meson 能力，實際解析版本仍由 uv.lock 鎖住。
    "meson>=1.5",
    # meson-python：讓 Python 的建置前端呼叫 Meson 編出 pydiso；同樣因關掉 build isolation
    # 放正式依賴。>=0.15 是 pydiso 0.2.0 build extra 宣告的相容下限，精確版由 uv.lock 決定。
    "meson-python>=0.15",
    # mkl：pydiso 真正解複數稀疏系統時載入的執行期函式庫，產品沒有退回解法，故為正式依賴。
    # 2026.1.0 是第 1 段預載與殘差實測版本；與 mkl-devel 同版釘住，避免 ABI 不一致。
    "mkl==2026.1.0",
    # mkl-devel：提供 pydiso 原始碼建置要讀的標頭與 pkg-config 資料，雲端 sync 當場需要，
    # 不能只放 dev 群組。版本與執行期 mkl 同釘 2026.1.0，避免建置面和載入面的 ABI 分家。
    "mkl-devel==2026.1.0",
    # ninja：Meson 實際驅動編譯步驟的建置器；no-build-isolation 下是正式安裝鏈的一環。
    # >=1.11 是這條建置鏈採用的能力下限，精確解析結果由 uv.lock 固定。
    "ninja>=1.11",
    "numpy==2.4.6",
    "pydantic>=2.13",
    # pydiso：第七段唯一的中央處理器稀疏直接解，產品執行時使用且明定沒有退回，故為正式依賴。
    # 0.2.0 是第 1 段複數對稱解、執行緒 API 與本地存根簽章實測版本，所以精確釘住。
    "pydiso==0.2.0",
    "pyyaml>=6.0",
    # scikit-fem：第七段以 MeshTet、P2、Basis 與表單組裝有限元素矩陣，屬產品正式路徑。
    # 12.0.2 是第 1 段組裝與本地存根簽章實測版本；精確釘住避免組裝 API 與答案一起漂。
    "scikit-fem==12.0.2",
    # scipy：scikit-fem 的數值底座，也提供交給 pydiso 的 csr_matrix；產品執行時必要，非 dev。
    # 1.17.1 是第 1 段解題版本，並與 scipy-stubs 的 1.17.1 系列對齊，故精確釘住。
    "scipy==1.17.1",
    # setuptools_scm：pydiso 從原始碼建置時產生版本資訊；no-build-isolation 下須在正式環境。
    # >=8 是這條建置鏈採用的能力下限，精確解析版本交由 uv.lock 固定。
    "setuptools_scm>=8",
]

[dependency-groups]
# ruff：規矩卡 style-guard 的另一半。那張卡自己那幾條（print 只准在輸出層、字串不准拼路徑、
# 開檔一律 with、函式不准超過門檻、整支檔不准超過行數上限）由
# governance/checks/style_guard.py 判；ruff 補的是它
# 蓋不到的另外幾種寫法（見下面 [tool.ruff.lint] 的 select）。
# 放在 dev 群組不是正式依賴：CI 是 `uv sync --locked` 之後 `uv run ruff check`，
# dev 群組本來就會被裝進來（跟 pytest 同一組）；而檢查程式跑起來只需要 ruff 在 PATH 上，
# 不需要 import 它。ruff 不在的時候 style_guard 回 2，不回 0。
#
# mypy：規矩卡 type-guard 的第①層。那支檢查自己 spawn `mypy`（所以只需要它在 PATH 上，
# 不需要 import 它），嚴格度全部寫在下面的 [tool.mypy]。types-PyYAML 是 pyyaml 的型別套件
# ——沒有它，`import yaml` 在嚴格模式下是「來源不明的套件」，那張卡整支回不了綠。
# 兩個都放 dev 群組：CI 是 `uv sync --locked` 之後 `uv run python -m governance.checks.type_guard`，
# dev 群組本來就會裝進來。mypy 不在 PATH 上的時候那支檢查回 2，不回 0。
#
# pytest-xdist：pytest 的平行外掛（把測試分給幾個子程序同時跑）。後設測試每張卡六回合、
# 每回合起一個獨立子程序去掃唯讀的樣本樹，回合之間沒有共用狀態，所以平行不改判準，只改牆上
# 時間。`-n auto`（下面 addopts）寫在設定裡而不是 CI 命令列：設定只有一份、走 PR 看得到，
# 而且「產收據那一跑」（tests/conftest.py 起的那個子程序）也就一起平行了。
# 放 dev 群組不是正式依賴：檢查程式跑起來不需要它，只有 `uv run pytest` 需要。
dev = [
    "pytest>=8.3",
    "pytest-xdist>=3.6",
    "ruff>=0.14",
    "mypy>=1.18",
    "types-PyYAML>=6.0",
    # scipy-stubs：scipy 官方維護的靜態型別宣告，只供 mypy 使用，所以放 dev 群組；
    # ~=1.17.1 限在與正式 scipy 1.17.1 相容的系列，第 1 段已驗 csr_matrix 是具體型別。
    "scipy-stubs~=1.17.1",
]

[build-system]
# 釘 hatchling 版本：跟 jax/numpy 那組同一條標準——打包工具也是產生可重現環境的一格，
# 不釘就每次現抓一個版本（本機 WHEEL 檔記的版本是 1.32.0），浮點答案對不上的時候分不清
# 是函式庫換了還是打包工具換了。
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# 只打包新家 src/aosr（editable 裝進環境後 `uv run python -m aosr.…` 一句就跑得動）。
# src/typings 只是 mypy 讀的本地宣告，不在 packages 清單，因此不會成為 aosr wheel 的一部分；
# 它也不在 src/aosr 底下，不會被分層卡誤認成 aosr 的產品層。
# 治理層 governance/ 與 blueprint/ 照舊靠 cwd 跑（`uv run python -m governance.checks.<x>`），
# 不打包它們，免得根層與 docs 根冒出白名單外的檔（file-placement-allowlist）。
packages = ["src/aosr"]

[tool.uv]
# package = true：讓 uv 把 src/aosr 以 editable 方式裝進 .venv。這樣 `import aosr` 不靠
# pytest 的 pythonpath 也能解析，而 package 預設就是 true——寫明是為了跟上一版
# package=false 對照，並把「為什麼裝」講清楚。CI 的 `uv sync --locked` 不重鎖：鎖檔跟
# pyproject 對不上就紅，所以 uv.lock 要跟這支一起提交。
package = true
# pydiso 0.2.0 的原始碼建置要直接看同一個環境裡的 MKL 與上述建置工具；隔離環境看不到
# mkl-devel 的 pkg-config 資料。這是只對 pydiso 的建置設定，不是放寬其他套件。
no-build-isolation-package = ["pydiso"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 模組搜尋路徑只在這裡宣告一次。tests/ 底下沒有 __init__.py，pytest 預設只把 tests/ 自己
# 放進搜尋路徑，`import governance` 與 `from tests.conftest import …` 都會找不到；拿掉這一行
# 實測就是 ModuleNotFoundError: No module named 'governance'。
# 刻意寫在設定裡、不寫在程式裡：規矩卡 uv-single-entrypoint 的第二條禁止任何
# sys.path.append／insert／extend（連由 __file__ 推出來的自我定位也禁），理由是那種寫法
# 一支程式一份、改了看不出來，而設定只有一份、走 PR 看得到。CI 跑檢查那邊不靠這一行：
# `uv run python -m governance.checks.<x>`（cwd 在 repo 根）本來就 import 得到。
# `src` 那一條是給新家用的（老闆 2026-09-11 下午拍板：上一代的引擎程式碼不進來，
# v3 裡只有新家 src/aosr，一塊一塊重新長）：新家的 `import aosr.…` 靠這一條解析得到。
# 第一塊 config（票 #127）與第二塊 materials（票 #134）都已經長在那裡。
# 決定與代價見 docs/decisions/engine-not-imported-new-home-grows-block-by-block.md。
# `testpaths` 刻意不動：這一條只讓模組找得到，不讓新家的測試進 `uv run pytest` 的預設
# 收集面；它們什麼時候、以什麼形狀進雲端 verify 是票 #120 的事。
pythonpath = [".", "src"]
# `-n auto`：後設測試分給「跟核心數一樣多」的工人（worker，平行跑測試的子程序）同時跑。
# 為什麼可以平行：每一回合本來就是一個獨立子程序、掃描根是唯讀的樣本樹，回合之間不共用狀態。
# 為什麼是 auto 不是一個數字：數字就是門檻，門檻只准住在卡或設定的登記簿，而這裡真正要說的是
# 「有幾顆核心就開幾個」，不是某個挑出來的值。
# 產收據那一跑（tests/conftest.py 在開跑前起的那個子程序）繼承同一份設定，所以它也平行；
# 而那一跑只在主控（controller，分派測試的那個程序）起一次——工人不再往下套一層，判斷寫在
# tests/conftest.py 的 pytest_sessionstart 裡。
addopts = "-q -n auto"
# 不寫 .pyc（避免子程序拿到 __pycache__ 裡的舊位元碼）：pytest 沒有對應的 ini 選項，
# PYTHONDONTWRITEBYTECODE 是環境變數。同效設定寫在 tests/conftest.py 的
# sys.dont_write_bytecode = True；跑子程序的三個地方（後設測試、檢查裡的探針、
# 產收據那一跑）另外把那個環境變數帶進子程序。
# pytest 設定只准住在這個檔——另開 pytest.ini／tox.ini／setup.cfg 會被
# green-must-be-real-green 判紅（第二套設定等於第二種跑法）。

# ── ruff（規矩卡 style-guard 的另一半）────────────────────────────────────────
# 規則集與它自己的數字只住在這裡：一份、走 PR 看得到。CI 上獨立一步跑
# `uv run ruff check`，ruff 的離開碼直接變成 verify 這個 job 的結論，不包在別的程式裡
# （包起來就多一層可以把它吞掉的地方）。
[tool.ruff]
extend-exclude = [
  # 必紅樣本是一棵棵獨立的迷你掃描根，裡面的壞寫法是刻意的道具，由後設測試單獨餵。
  "governance/fixtures",
  # 本機 agent 工具目錄（雲端 checkout 不會有）；底下有工作樹副本，掃了會把同一批檔算兩次。
  ".claude",
]

[tool.ruff.lint]
# 只挑跟寫法警衛那幾條相關、而且不跟卡上的門檻搶家的規則：
#   PTH     路徑一律走 pathlib（style_guard 的第②條只咬「拼出來的字串流進路徑 API」，
#           os.path.* 那一整族的替換由這一條管）
#   SIM115  開檔要用 with（跟第③條同一件事，多一道獨立實作當後盾）
#   C901    循環複雜度（第④條量的是行數與分支數，這是第三種量法，不是同一個數字）
#   PLR0915 語句數（同上，又一種量法）
# 刻意沒開 T20（print）：那一條的規矩不是「不准 print」而是「只准在輸出層」，
# ruff 表達不了白名單，開了就得靠設定裡的整批豁免或一堆行內抑制去補，那份清單會跟
# 卡上那份各自漂。刻意沒開 PLR0912（分支數）：分支數的門檻已經登記在卡上，開了就有兩個家。
# 兩件事的理由完整寫在 governance/rules/style-guard.toml 的檔尾第 7 條。
select = ["PTH", "SIM115", "C901", "PLR0915"]

[tool.ruff.lint.mccabe]
# 循環複雜度上限。用實跑分布定，不是想像的：立卡當天全樹最複雜的函式是
# blueprint/remap_cards.py 的 check_card_v2（ruff 量到 25），門檻取它再往上一點。
# 這是棘輪不是理想值——它擋的是「從今天起變得更糟」，不是宣稱今天的樹已經夠好。
max-complexity = 26

[tool.ruff.lint.pylint]
# 語句數上限。立卡當天全樹最多語句的函式是 48 個，ruff 的預設剛好就是 50；
# 明寫出來是為了讓「今天有多寬」看得見，而不是藏在工具的預設值裡。
max-statements = 50

# ── mypy（規矩卡 type-guard 的第①層）─────────────────────────────────────────
# 嚴格度只住在這裡：一份、走 PR 看得到。檢查程式 governance/checks/type_guard.py 自己不帶
# 任何嚴格度旗標，它只把這個檔當 --config-file 餵給 mypy；讀不到這個檔就回 2，不回 0
# （沒有尺就不出結論）。每一份必紅樣本樹底下也帶一份同樣的 [tool.mypy]，因為每份樣本
# 都是獨立的掃描根。
#
# 刻意沒有任何 per-module 的 override（`[[tool.mypy.overrides]]`）：設定檔層級的整批豁免
# 今天連 exemptions-need-expiry 都看不到（那張卡的檔尾第 4 條自己寫了），開一條就等於在
# 版控裡多一個沒人守的放行。真的要放過某一行，就寫成帶錯誤碼的行內 ignore
# ——那一行由 type-guard 守錯誤碼、由 exemptions-need-expiry 守理由與到期日。
[tool.mypy]
# strict 是一個 bundle，這個 repo 要的就是它整包（含 disallow_untyped_defs 與
# warn_unused_ignores）。刻意不逐條列開：列開就會有人以為可以逐條關掉。
strict = true
# tests/ 底下沒有 __init__.py，pytest 的 pythonpath 讓 `from tests.conftest import …`
# 跑得起來，但 mypy 光看路徑會把 tests/conftest.py 同時當成 `conftest` 與 `tests.conftest`
# 兩個模組名（實測就是 "Source file found twice under different module names"）。
# 這一行叫 mypy 用「相對 cwd 的路徑」決定模組名，那個歧義就消失。
explicit_package_bases = true
# 新家 src/aosr 與本地存根的模組搜尋路徑。跟上面 [tool.pytest.ini_options] 的 pythonpath 那一條
# 是同一件事的兩份宣告：那邊讓跑測試的時候 `import aosr.…` 找得到，這邊讓型別檢查的時候
# 找得到。少了這一行，tests/ 底下 import 新家的檔會被 mypy 判成
# 「Cannot find implementation or library stub for module named "aosr"」（實測），
# 於是 type-guard 那張卡整支紅——不是因為型別錯，是因為它根本沒讀到那個套件。
# src/typings 這一格不是逐模組豁免；它只是告訴 mypy 去哪裡找我們寫的第三方型別宣告。
# 寫在設定裡而不是程式裡，理由同上面那一條：設定只有一份、走 PR 看得到。
mypy_path = ["src", "src/typings"]
