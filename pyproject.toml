[project]
name = "aosr-v3-governance"
version = "0.1.0"
description = "aosr-v3 治理層：規矩卡、檢查程式、必紅樣本"
requires-python = ">=3.12"
# pyyaml：規矩卡 ci-jobs-cannot-die-quietly 要對 .github/workflows/*.yml 做真的 YAML 剖析。
# 為什麼不自己寫最小剖析：那張卡要分得清 job 層與 step 層的同名鍵、要把 timeout-minutes
# 讀成數字、要看得懂流式寫法（`{continue-on-error: true}`）與引號。縮排／正則的子集剖析
# 每一種都繞得過去，等於一個只會回綠的檢查——那是這個 repo 的頭號死因。
# 放在正式依賴不是 dev 群組：CI 是 `uv sync --locked` 之後直接 `uv run python -m
# governance.checks.<x>`，檢查程式跑起來就要有它。它不在的時候那支檢查回 2，不回 0。
dependencies = ["pyyaml>=6.0"]

[dependency-groups]
# ruff：規矩卡 style-guard 的另一半。那張卡自己那四條（print 只准在輸出層、字串不准拼路徑、
# 開檔一律 with、函式不准超過門檻）由 governance/checks/style_guard.py 判；ruff 補的是它
# 蓋不到的另外幾種寫法（見下面 [tool.ruff.lint] 的 select）。
# 放在 dev 群組不是正式依賴：CI 是 `uv sync --locked` 之後 `uv run ruff check`，
# dev 群組本來就會被裝進來（跟 pytest 同一組）；而檢查程式跑起來只需要 ruff 在 PATH 上，
# 不需要 import 它。ruff 不在的時候 style_guard 回 2，不回 0。
#
# mypy：規矩卡 type-guard 的第①層。那支檢查自己 spawn `mypy`（所以只需要它在 PATH 上，
# 不需要 import 它），嚴格度全部寫在下面的 [tool.mypy]。types-PyYAML 是 pyyaml 的型別套件
# ——沒有它，`import yaml` 在嚴格模式下是「來源不明的套件」，那張卡整支回不了綠。
# 兩個都放 dev 群組：CI 是 `uv sync --locked` 之後 `uv run python -m governance.checks.type_guard`，
# dev 群組本來就會裝進來。mypy 不在 PATH 上的時候那支檢查回 2，不回 0。
#
# pytest-xdist：pytest 的平行外掛（把測試分給幾個子程序同時跑）。後設測試每張卡六回合、
# 每回合起一個獨立子程序去掃唯讀的樣本樹，回合之間沒有共用狀態，所以平行不改判準，只改牆上
# 時間。`-n auto`（下面 addopts）寫在設定裡而不是 CI 命令列：設定只有一份、走 PR 看得到，
# 而且「產收據那一跑」（tests/conftest.py 起的那個子程序）也就一起平行了。
# 放 dev 群組不是正式依賴：檢查程式跑起來不需要它，只有 `uv run pytest` 需要。
dev = ["pytest>=8.3", "pytest-xdist>=3.6", "ruff>=0.14", "mypy>=1.18", "types-PyYAML>=6.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# 模組搜尋路徑只在這裡宣告一次。tests/ 底下沒有 __init__.py，pytest 預設只把 tests/ 自己
# 放進搜尋路徑，`import governance` 與 `from tests.conftest import …` 都會找不到；拿掉這一行
# 實測就是 ModuleNotFoundError: No module named 'governance'。
# 刻意寫在設定裡、不寫在程式裡：規矩卡 uv-single-entrypoint 的第二條禁止任何
# sys.path.append／insert／extend（連由 __file__ 推出來的自我定位也禁），理由是那種寫法
# 一支程式一份、改了看不出來，而設定只有一份、走 PR 看得到。CI 跑檢查那邊不靠這一行：
# `uv run python -m governance.checks.<x>`（cwd 在 repo 根）本來就 import 得到。
# `src` 那一條是給新家用的（老闆 2026-09-11 下午拍板：上一代的引擎程式碼不進來，
# v3 裡只有新家 src/aosr，一塊一塊重新長）：新家的 `import aosr.…` 靠這一條解析得到。
# 今天 src/ 底下還沒有任何檔——第一塊由票 #127 長出來，這一行先立著、不是死設定。
# 決定與代價見 docs/decisions/engine-not-imported-new-home-grows-block-by-block.md。
# `testpaths` 刻意不動：這一條只讓模組找得到，不讓新家的測試進 `uv run pytest` 的預設
# 收集面；它們什麼時候、以什麼形狀進雲端 verify 是票 #120 的事。
pythonpath = [".", "src"]
# `-n auto`：後設測試分給「跟核心數一樣多」的工人（worker，平行跑測試的子程序）同時跑。
# 為什麼可以平行：每一回合本來就是一個獨立子程序、掃描根是唯讀的樣本樹，回合之間不共用狀態。
# 為什麼是 auto 不是一個數字：數字就是門檻，門檻只准住在卡或設定的登記簿，而這裡真正要說的是
# 「有幾顆核心就開幾個」，不是某個挑出來的值。
# 產收據那一跑（tests/conftest.py 在開跑前起的那個子程序）繼承同一份設定，所以它也平行；
# 而那一跑只在主控（controller，分派測試的那個程序）起一次——工人不再往下套一層，判斷寫在
# tests/conftest.py 的 pytest_sessionstart 裡。
addopts = "-q -n auto"
# 不寫 .pyc（避免子程序拿到 __pycache__ 裡的舊位元碼）：pytest 沒有對應的 ini 選項，
# PYTHONDONTWRITEBYTECODE 是環境變數。同效設定寫在 tests/conftest.py 的
# sys.dont_write_bytecode = True；跑子程序的三個地方（後設測試、檢查裡的探針、
# 產收據那一跑）另外把那個環境變數帶進子程序。
# pytest 設定只准住在這個檔——另開 pytest.ini／tox.ini／setup.cfg 會被
# green-must-be-real-green 判紅（第二套設定等於第二種跑法）。

# ── ruff（規矩卡 style-guard 的另一半）────────────────────────────────────────
# 規則集與它自己的數字只住在這裡：一份、走 PR 看得到。CI 上獨立一步跑
# `uv run ruff check`，ruff 的離開碼直接變成 verify 這個 job 的結論，不包在別的程式裡
# （包起來就多一層可以把它吞掉的地方）。
[tool.ruff]
extend-exclude = [
  # 必紅樣本是一棵棵獨立的迷你掃描根，裡面的壞寫法是刻意的道具，由後設測試單獨餵。
  "governance/fixtures",
  # 本機 agent 工具目錄（雲端 checkout 不會有）；底下有工作樹副本，掃了會把同一批檔算兩次。
  ".claude",
]

[tool.ruff.lint]
# 只挑跟寫法警衛那四條相關、而且不跟卡上的門檻搶家的規則：
#   PTH     路徑一律走 pathlib（style_guard 的第②條只咬「拼出來的字串流進路徑 API」，
#           os.path.* 那一整族的替換由這一條管）
#   SIM115  開檔要用 with（跟第③條同一件事，多一道獨立實作當後盾）
#   C901    循環複雜度（第④條量的是行數與分支數，這是第三種量法，不是同一個數字）
#   PLR0915 語句數（同上，又一種量法）
# 刻意沒開 T20（print）：那一條的規矩不是「不准 print」而是「只准在輸出層」，
# ruff 表達不了白名單，開了就得靠設定裡的整批豁免或一堆行內抑制去補，那份清單會跟
# 卡上那份各自漂。刻意沒開 PLR0912（分支數）：分支數的門檻已經登記在卡上，開了就有兩個家。
# 兩件事的理由完整寫在 governance/rules/style-guard.toml 的檔尾第 7 條。
select = ["PTH", "SIM115", "C901", "PLR0915"]

[tool.ruff.lint.mccabe]
# 循環複雜度上限。用實跑分布定，不是想像的：立卡當天全樹最複雜的函式是
# blueprint/remap_cards.py 的 check_card_v2（ruff 量到 25），門檻取它再往上一點。
# 這是棘輪不是理想值——它擋的是「從今天起變得更糟」，不是宣稱今天的樹已經夠好。
max-complexity = 26

[tool.ruff.lint.pylint]
# 語句數上限。立卡當天全樹最多語句的函式是 48 個，ruff 的預設剛好就是 50；
# 明寫出來是為了讓「今天有多寬」看得見，而不是藏在工具的預設值裡。
max-statements = 50

# ── mypy（規矩卡 type-guard 的第①層）─────────────────────────────────────────
# 嚴格度只住在這裡：一份、走 PR 看得到。檢查程式 governance/checks/type_guard.py 自己不帶
# 任何嚴格度旗標，它只把這個檔當 --config-file 餵給 mypy；讀不到這個檔就回 2，不回 0
# （沒有尺就不出結論）。每一份必紅樣本樹底下也帶一份同樣的 [tool.mypy]，因為每份樣本
# 都是獨立的掃描根。
#
# 刻意沒有任何 per-module 的 override（`[[tool.mypy.overrides]]`）：設定檔層級的整批豁免
# 今天連 exemptions-need-expiry 都看不到（那張卡的檔尾第 4 條自己寫了），開一條就等於在
# 版控裡多一個沒人守的放行。真的要放過某一行，就寫成帶錯誤碼的行內 ignore
# ——那一行由 type-guard 守錯誤碼、由 exemptions-need-expiry 守理由與到期日。
[tool.mypy]
# strict 是一個 bundle，這個 repo 要的就是它整包（含 disallow_untyped_defs 與
# warn_unused_ignores）。刻意不逐條列開：列開就會有人以為可以逐條關掉。
strict = true
# tests/ 底下沒有 __init__.py，pytest 的 pythonpath 讓 `from tests.conftest import …`
# 跑得起來，但 mypy 光看路徑會把 tests/conftest.py 同時當成 `conftest` 與 `tests.conftest`
# 兩個模組名（實測就是 "Source file found twice under different module names"）。
# 這一行叫 mypy 用「相對 cwd 的路徑」決定模組名，那個歧義就消失。
explicit_package_bases = true
# 新家 src/aosr 的模組搜尋路徑。跟上面 [tool.pytest.ini_options] 的 pythonpath 那一條
# 是同一件事的兩份宣告：那邊讓跑測試的時候 `import aosr.…` 找得到，這邊讓型別檢查的時候
# 找得到。少了這一行，tests/ 底下 import 新家的檔會被 mypy 判成
# 「Cannot find implementation or library stub for module named "aosr"」（實測），
# 於是 type-guard 那張卡整支紅——不是因為型別錯，是因為它根本沒讀到那個套件。
# 寫在設定裡而不是程式裡，理由同上面那一條：設定只有一份、走 PR 看得到。
mypy_path = "src"
