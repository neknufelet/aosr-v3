name: acceptance

# 只核合併請求內文的驗收結論是否指到當前 head（規矩卡 acceptance-verdict-points-at-head）。
# verify 核程式與完整測試；兩個名稱分開且都在必要檢查名單，edited 只重跑這一支。
# 不准加 job 層 if 或 PR 路徑、分支過濾；ci-jobs-cannot-die-quietly 的設定與必紅樣本守住。
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    # 沒有上限等於可以無聲卡死；上限數字登記在規矩卡 ci-jobs-cannot-die-quietly 的 [settings]。
    # 這一支只裝依賴、跑一支檢查，實際一分鐘內；10 分鐘是寬的上限。
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.21"
      - name: 裝依賴
        run: uv sync --locked
      - name: 合併請求內文的驗收結論要指到要合的那顆提交（讀 GitHub 的事件檔，不上網）
        # head 從事件檔的 pull_request.head.sha 讀，不拿 GITHUB_SHA（那是假想合併提交）。
        run: uv run python -m governance.status.record_step --name acceptance_verdict_points_at_head --out-dir governance/receipts/steps -- uv run python -m governance.checks.acceptance_verdict_points_at_head --scan-root .
