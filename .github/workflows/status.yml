name: status

# 掛在 verify 之後，不併進 verify 那個 job。兩個 job，都只寫機器分支 status：
#   receipt——每一次 verify 跑完（主線的、PR 的都算）把那一跑合成一份機器收據推上去。
#   status ——只在主線那一跑之後重算狀態頁，而且用 `needs:`（GitHub 的前置宣告）等 receipt 跑完才開始。
#
# 為什麼是 workflow_run（GitHub 的「某個 workflow 跑完了」事件）而不是同一個 push 事件：
# 這一頁要寫得出「主線最近一次 verify（雲端檢查）的結論」，而同一個 push 事件裡兩個 workflow
# 是並行的——`needs:` 跨不了 workflow，所以那時候問 GitHub，verify 還在跑，頁面上會是
# 「還在跑或沒有結論」。掛在 verify 跑完之後，那一格才是真的結論。
#
# 刻意**不**過濾 conclusion == success：verify 紅的時候更需要有一頁看得見的紅字、一份寫著紅的收據。
# 過濾成只在綠的時候重算，等於主線紅了狀態頁還停在上一次的綠——那正是這個 repo 最恨的假綠。
#
# 刻意**不**過濾分支：收據一跑一份，PR 的那一跑也要有（PR 合不合只看雲端，決策紙
# docs/decisions/receipts-two-layers-cloud-on-status-branch.md）。狀態頁只認主線，由 status job 自己的 if 擋。
on:
  workflow_run:
    workflows: [verify]
    types: [completed]
  workflow_dispatch:
    inputs:
      verify_run_id:
        # 手動替某一跑補收據（PR 上改了這份 workflow 而還沒合進主線時，只有這條路試得到
        # receipt job——workflow_run 永遠跑主線上的那份 workflow 檔）。留空就是重算狀態頁。
        description: "要補收據的 verify run id（留空＝只重算狀態頁）"
        required: false
        default: ""

# 只有這一支 workflow 拿得到寫的權限，而且只寫 status 那條分支（verify 那邊還是 contents: read）。
# actions: read 是 receipt job 下載 verify 那一跑上傳的 artifact 用的；寫了 permissions 區塊之後
# 沒列的權限一律沒有，少這一行 gh run download 會被拒。
permissions:
  contents: write
  actions: read
  # 狀態頁要問票（issue，待辦票）與 PR（合併請求）：里程碑、開著的票、關掉的票，
  # 以及「這張票是被哪個 PR 關掉的」那一句圖查詢（GraphQL 的 closedByPullRequestsReferences）。
  # 寫了 permissions 區塊之後沒列的權限一律沒有，所以這兩行要明寫——今天這個 repo 是公開的、
  # 公開資料本來就讀得到，但那是「剛好讀得到」不是「宣告過讀得到」，改成私有就會斷。
  issues: read
  pull-requests: read

jobs:
  receipt:
    # 只在 verify 跑完之後（或手動指定了某一跑）合成收據。job 層的 if 只做這個篩選，不漂綠。
    if: ${{ github.event_name == 'workflow_run' || inputs.verify_run_id != '' }}
    runs-on: ubuntu-latest
    # 上限由規矩卡 ci-jobs-cannot-die-quietly 的 [settings] 定；這一支的工作很少
    # （下載一份 artifact、問兩支 GitHub API、寫一份 JSON、推一筆提交），取跟 verify 同一個上限。
    timeout-minutes: 15
    # 刻意**沒有** concurrency（併發組，GitHub 用來讓同組一次只跑一個的機制）。
    # 2026-09-10 拔掉的：兩個 job 本來共用 `status-branch` 這一組、`cancel-in-progress: false`。
    # GitHub 的語意不是「排成一列全部會跑」——同一組只留**一個** pending，新來的一跑會把
    # 既有那個還沒開始的取消掉。主線 verify run 34452456923 的收據就是這樣沒了：08:00 那一輪
    # 排在後面，被下一個進來的踢掉，而且沒有人看得見。
    # 現在改成不排隊、誰先跑誰先推，撞到非快進（別的一跑先推了）就重新疊到最新的 status 上再推，
    # 次數上限寫在下面那一步自己的 env 裡（用完回非零，讓這個 job 紅，不安靜地丟掉收據）。
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OUT_NAME: receipt
      GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
      # 要合成收據的是哪一跑：事件帶的那一跑，手動觸發時用輸入的那個。
      AOSR_VERIFY_RUN_ID: ${{ github.event.workflow_run.id || inputs.verify_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 推 status 分支要這個 checkout 留下來的憑證（GITHUB_TOKEN）；整條歷史是為了 status
          # 分支切得過去（淺 clone 上 fetch 別的分支再 switch，實測會踩到孤兒物件的坑）。
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.21"
      - name: 裝依賴
        run: uv sync --locked
      - name: 下載 verify 那一跑上傳的片段（沒有就紅：那一跑沒留證據，收據合不成）
        run: gh run download "$AOSR_VERIFY_RUN_ID" --pattern "receipts-*" --dir "$RUNNER_TEMP/artifacts"
      - name: 合成收據（GitHub 記的紅綠 ＋ 每一步的離開碼，對不上就寫進收據；合不成回 2）
        run: uv run python -m governance.status.build_receipt --run-id "$AOSR_VERIFY_RUN_ID" --artifacts "$RUNNER_TEMP/artifacts" --out "$RUNNER_TEMP/$OUT_NAME"
      - name: 推到只有機器寫的 status 分支（撞到非快進就重疊上去再推；歷史全留，不 force）
        env:
          # 重推幾次才放棄。寫在這裡（看得見、改得動）不寫死在程式模組層——這是門檻。
          # 5 的來源：今天同時在推的最多就是 receipt 與 status 兩個 job 加上另一條 PR 那一跑，
          # 三個撞在一起最多重疊兩次；5 是它的兩倍再多一次，不是想像的大數字。
          PUSH_MAX_ATTEMPTS: "5"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pushed=""
          attempt=1
          while [ "$attempt" -le "$PUSH_MAX_ATTEMPTS" ]; do
            git fetch origin status
            git switch -C status origin/status
            mkdir -p receipts
            cp -a "$RUNNER_TEMP/$OUT_NAME"/receipts/. receipts/
            git add receipts
            git commit -m "receipt: verify run $AOSR_VERIFY_RUN_ID 的收據（由 run $GITHUB_RUN_ID 合成，第 $attempt 次嘗試）"
            if git push origin status; then
              pushed="yes"
              break
            fi
            echo "第 $attempt 次推被拒（多半是別的一跑先推了，非快進）——重新疊到最新的 status 上再來"
            attempt=$((attempt + 1))
          done
          if [ -z "$pushed" ]; then
            echo "推了 $PUSH_MAX_ATTEMPTS 次都沒推上去：這一跑的收據沒進 status 分支，讓這個 job 紅"
            exit 1
          fi

  status:
    # 等 receipt 那個 job 把收據推完再開始算這一頁：兩個 job 並行的時候，status 常常在收據還沒
    # 推上去之前就算完，頁上「關掉的票對不對得到綠收據」那一格先紅一輪，下一次重算才綠
    # （票 #88）。這一行只管順序；兩邊會不會同時推同一條分支，由推那一步自己重推顧。
    needs: receipt
    # 只等 receipt「跑完」，不要求它綠——receipt 紅的時候更要有一頁看得見的紅字，那是這份檔頭
    # 本來就寫的理由。所以外面包一層 `!cancelled()`（GitHub 的表達式：整跑沒被取消就成立），
    # 讓 receipt 紅掉或被 skip（手動觸發不帶 run id，那條路只重算狀態頁）時這一頁照算。
    # 刻意不寫 `always()`：規矩卡 ci-jobs-cannot-die-quietly 的 [settings].forbidden_job_ifs
    # 把它列成禁字，而且 always() 連「這一跑被使用者取消」都照跑，那才是把紅漂成綠。
    # 括號裡是原本的篩選：只認主線那一跑；手動觸發而沒指定 run id 時也重算一頁。
    if: ${{ !cancelled() && ((github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main') || (github.event_name == 'workflow_dispatch' && inputs.verify_run_id == '')) }}
    runs-on: ubuntu-latest
    # 上限由規矩卡 ci-jobs-cannot-die-quietly 的 [settings] 定；這一支的工作比 verify 少
    # （一支程式問幾支 GitHub API、寫一份 HTML、推一筆提交），取跟 verify 同一個上限。
    timeout-minutes: 15
    # 同樣沒有 concurrency，理由跟上面那個 job 一樣（同組只留一個 pending，會把排在後面的
    # 那一跑整個取消掉）。這一頁重算的順序由 `needs: receipt` 顧，推分支撞車由重推顧。
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      # 產出物刻意寫在版控樹外面（runner 的暫存目錄 $RUNNER_TEMP 底下）：這一頁不進主線，
      # 也不准在樹裡留殘留。這裡只寫目錄名字，不寫 ${{runner.temp}}——job 層的 env 拿不到
      # runner 這個 context（實測 GitHub 直接拒收整份 workflow：Unrecognized named-value）。
      OUT_NAME: status-page
      # 狀態頁程式要問 GitHub（里程碑、票、最近一跑的結論），`gh` 要有票才問得到。
      GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
      # 這一頁反映的是哪一跑的 verify（手動觸發時沒有這一格，頁面就只寫 commit）。
      AOSR_VERIFY_RUN_ID: ${{github.event.workflow_run.id}}
    steps:
      - uses: actions/checkout@v4
        with:
          # 時間軸要從整條歷史算「每張卡是哪一天進主線的」，淺 clone 算不出來。
          # 推 status 分支也要這個 checkout 留下來的憑證（GITHUB_TOKEN）。
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.21"
      - name: 裝依賴
        run: uv sync --locked
      # 「關掉的票對不對得到綠收據」那一格讀的是收據分支上的收據，而它只讀本機已經有的 ref
      # （不上網）。這個 job 已經用 needs 等 receipt 推完才開始，但這一步照樣留著：checkout
      # 之後到這一步之間還有時間差，而且別條 PR 那一跑的 receipt 也可能在這中間推上去，
      # 先拉一次讀到的才是最新那幾份。
      - name: 把收據那條分支拉到最新
        run: git fetch origin status
      - name: 算出狀態頁（算不出來就回 2，不產一頁沒資料的）
        run: uv run python -m governance.status.build_status --out "$RUNNER_TEMP/$OUT_NAME"
      - name: 推到只有機器寫的 status 分支（撞到非快進就重疊上去再推；歷史全留，不 force）
        env:
          # 重推幾次才放棄，同上面那個 job（門檻寫在看得見的地方，不寫死在程式模組層）。
          PUSH_MAX_ATTEMPTS: "5"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pushed=""
          attempt=1
          while [ "$attempt" -le "$PUSH_MAX_ATTEMPTS" ]; do
            git fetch origin status
            git switch -C status origin/status
            cp -a "$RUNNER_TEMP/$OUT_NAME"/. .
            git add index.html .nojekyll
            git commit --allow-empty -m "status: $GITHUB_RUN_ID 算出來的一頁（第 $attempt 次嘗試）"
            if git push origin status; then
              pushed="yes"
              break
            fi
            echo "第 $attempt 次推被拒（多半是別的一跑先推了，非快進）——重新疊到最新的 status 上再來"
            attempt=$((attempt + 1))
          done
          if [ -z "$pushed" ]; then
            echo "推了 $PUSH_MAX_ATTEMPTS 次都沒推上去：這一頁沒進 status 分支，讓這個 job 紅"
            exit 1
          fi
