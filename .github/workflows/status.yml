name: status

# 掛在 verify 之後，不併進 verify 那個 job。
#
# 為什麼是 workflow_run（GitHub 的「某個 workflow 跑完了」事件）而不是同一個 push 事件：
# 這一頁要寫得出「主線最近一次 verify（雲端檢查）的結論」，而同一個 push 事件裡兩個 workflow
# 是並行的——`needs:` 跨不了 workflow，所以那時候問 GitHub，verify 還在跑，頁面上會是
# 「還在跑或沒有結論」。掛在 verify 跑完之後，那一格才是真的結論。
#
# 刻意**不**過濾 conclusion == success：verify 紅的時候更需要有一頁看得見的紅字。
# 過濾成只在綠的時候重算，等於主線紅了狀態頁還停在上一次的綠——那正是這個 repo 最恨的假綠。
on:
  workflow_run:
    workflows: [verify]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# 只有這一支 workflow 拿得到寫的權限，而且只寫 status 那條分支（verify 那邊還是 contents: read）。
permissions:
  contents: write

# 兩次快速合併就是兩次推到同一條分支，後面那次會被拒（非快進）。排隊、不取消：
# 每一次合併都該留下一份自己的頁，歷史全留。
concurrency:
  group: status-page
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    # 上限由規矩卡 ci-jobs-cannot-die-quietly 的 [settings] 定；這一支的工作比 verify 少
    # （一支程式問幾支 GitHub API、寫一份 HTML、推一筆提交），取跟 verify 同一個上限。
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      # 產出物刻意寫在版控樹外面（runner 的暫存目錄）：這一頁不進主線，也不准在樹裡留殘留。
      OUT_DIR: ${{runner.temp}}/status-page
      # 狀態頁程式要問 GitHub（里程碑、票、最近一跑的結論），`gh` 要有票才問得到。
      GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
      # 這一頁反映的是哪一跑的 verify（手動觸發時沒有這一格，頁面就只寫 commit）。
      AOSR_VERIFY_RUN_ID: ${{github.event.workflow_run.id}}
    steps:
      - uses: actions/checkout@v4
        with:
          # 時間軸要從整條歷史算「每張卡是哪一天進主線的」，淺 clone 算不出來。
          # 推 status 分支也要這個 checkout 留下來的憑證（GITHUB_TOKEN）。
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.21"
      - name: 裝依賴
        run: uv sync --locked
      - name: 算出狀態頁（算不出來就回 2，不產一頁沒資料的）
        run: uv run python -m governance.status.build_status --out "$OUT_DIR"
      - name: 推到只有機器寫的 status 分支（歷史全留，不 force）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin status
          git switch status
          cp -a "$OUT_DIR"/. .
          git add index.html .nojekyll
          git commit --allow-empty -m "status: $GITHUB_RUN_ID 算出來的一頁"
          git push origin status
