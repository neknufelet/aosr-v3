name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # 只讀，給規矩卡 issues-closed-only-by-merged-pr 那一步用（問關掉的票是被哪個 PR 關的）。
  # 明寫出來的理由：這個區塊一旦寫了任何一格，沒寫到的每一格都會被設成 none，
  # 「公開 repo 本來就讀得到」這句話在那之後就不保證了——與其賭，不如把要讀的那一格寫出來。
  # 寫回 GitHub 的權限（重開票）不在這裡，那是票務守衛自己那一份 workflow 的事。
  issues: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # 沒有上限等於可以無聲卡死（GitHub 的預設 360 分鐘不是宣告，是沒人想過這件事）。
    # 由規矩卡 ci-jobs-cannot-die-quietly 帶進來，上限數字登記在那張卡的 [settings]。
    # 15 分鐘的來源：2026-09-09 主線最近兩跑的這個 job 各 51 秒與 48 秒（run 34349380538、
    # 34349903662），約 18 倍，留給第一批 16 張卡都立完之後長大的後設測試。
    timeout-minutes: 15
    # 不要在樹裡留編譯快取。__pycache__ 已經在 .gitignore 裡、列舉時本來就被扣掉，
    # 所以這一行不是為了掃描集合乾淨，是為了跑完不在別人的掃描根裡留雜物。
    # commit-author-allowlisted 要看的範圍。PR 上 checkout 出來的 HEAD 是 GitHub 合出來的
    # 假想合併提交，那一筆不會進主線，所以兩端都明寫 PR 事件裡的 base.sha 與 head.sha；
    # push 到 main 時這兩個是空字串，檢查改用 HEAD~1..HEAD（每次 push 就是一次 PR 合併）。
    # 刻意放在 job 這一層、不是某個步驟：GitHub 給**每個**步驟 GITHUB_EVENT_NAME=pull_request，
    # 後設測試那一步跑乾淨樹時也要看得到範圍，不然它會判「PR 卻拿不到 base」而回 2。
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      AOSR_RANGE_BASE: ${{ github.event.pull_request.base.sha }}
      AOSR_RANGE_HEAD: ${{ github.event.pull_request.head.sha }}
      # 唯一准上網的那一支檢查（merge-gate-read-back）用 gh 讀主線的 ruleset，gh 沒 token 拒跑。
      # 放在 job 層：後設測試那一步的第 1／2／5 回也會叫起它。權限照舊 contents: read，只讀。
      GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
    # 每一支檢查那一步都包一層 governance.status.record_step（收據的抄寫員）：它把那一步真正的
    # 離開碼（0／1／2 分得開）、判決收據那一行、最後幾行輸出記成一片，寫進被 .gitignore 忽略的
    # governance/receipts/steps/，然後**原封不動**回子程序的離開碼——它不裁判、不吞。
    # 紅綠的權威仍是 GitHub 記的每一步結論；status.yml 的 receipt job 把兩邊交叉比對後合成
    # 一份收據推到 status 分支（決策紙 docs/decisions/receipts-two-layers-cloud-on-status-branch.md）。
    # 2026-09-10 起這個 job 底下每一個 run: 要嘛包這一層、要嘛是水管步驟（裝依賴那種），
    # 由規矩卡 ci-jobs-cannot-die-quietly 的第⑤條守著——之前 ruff 那一步不包，理由只寫在
    # 註解裡，沒有機器在守，收據上就少那一格。
    steps:
      - uses: actions/checkout@v4
        with:
          # 兩張卡都要整條歷史，少一個都不准改成淺 clone：
          # commit-author-allowlisted 要看 base..head 整段提交——預設的淺 clone 拿不到
          #   base 那顆物件，git log 會非零退出、檢查回 2。
          # secrets-never-committed 要掃**全部歷史**的每一顆 blob——淺 clone 裡舊提交
          #   根本不在物件庫裡，一個「加進來又刪掉」的金鑰列不出來。那張卡因此自己也驗
          #   「這棵樹是不是淺的」（rev-parse --is-shallow-repository 回 true 就回 2），
          #   所以把這一行拿掉不會變成安靜回綠，會變成回 2 擋住合併。
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.21"
      - name: 裝依賴
        run: uv sync --locked
      - name: 把 status 分支上的機器收據鏡到被忽略的目錄（三張收據卡與後設測試讀這裡；不上網，checkout 已帶 origin/status）
        run: uv run python -m governance.status.record_step --name mirror_receipts --out-dir governance/receipts/steps -- uv run python -m governance.status.mirror_receipts
      - name: 規矩卡必填欄位——自己跑一次乾淨樹
        run: uv run python -m governance.status.record_step --name rule_card_required_fields --out-dir governance/receipts/steps -- uv run python -m governance.checks.rule_card_required_fields --scan-root .
      - name: 離開碼誠實——自己跑一次乾淨樹
        run: uv run python -m governance.status.record_step --name check_exit_code_honest --out-dir governance/receipts/steps -- uv run python -m governance.checks.check_exit_code_honest --scan-root .
      - name: 斷言不准鎖死數量——自己跑一次乾淨樹
        run: uv run python -m governance.status.record_step --name assertions_not_pinned_to_counts --out-dir governance/receipts/steps -- uv run python -m governance.checks.assertions_not_pinned_to_counts --scan-root .
      - name: 進度待辦不准手寫進版控——自己跑一次乾淨樹
        run: uv run python -m governance.status.record_step --name status_page_computed_not_typed --out-dir governance/receipts/steps -- uv run python -m governance.checks.status_page_computed_not_typed --scan-root .
      - name: 入口檔的規矩節等於重生結果、指路牌等於登記的那一段、生成段不留佔位、不超過行數上限——自己跑一次乾淨樹
        # 判決住在產生器（模組 governance.render_entry）裡，這一步跟它自己的 `--check` 那條路
        # 跑的是同一支函式（同一個 problems／targets），不是第二份實作。
        # 這裡刻意不寫產生器的檔案路徑：ci-jobs-cannot-die-quietly 會把 workflow 原文裡任何
        # 長得像腳本的 token 當成「這個 job 叫到的腳本」收進掃描面，寫了就變成卡面上沒宣告的越權。
        run: uv run python -m governance.status.record_step --name entry_files_rendered_from_registry --out-dir governance/receipts/steps -- uv run python -m governance.checks.entry_files_rendered_from_registry --scan-root .
      - name: 決策紙一題一檔、取代關係雙向、鏈不成環——自己跑一次乾淨樹
        run: uv run python -m governance.status.record_step --name decision_paper_structure --out-dir governance/receipts/steps -- uv run python -m governance.checks.decision_paper_structure --scan-root .
      - name: docs 的標頭要齊、逐類與總量份數有上限、每一行有字元上限、三類裡面不准再分層——自己跑一次乾淨樹
        run: uv run python -m governance.status.record_step --name doc_frontmatter_and_dates --out-dir governance/receipts/steps -- uv run python -m governance.checks.doc_frontmatter_and_dates --scan-root .
      - name: 每次開工會載入的檔不准出現模型名、CLI 名、用量字樣——自己跑一次乾淨樹
        # 掃描面是入口檔加決策紙，字典（三張清單）只住在那張卡的 [settings]，
        # 這一步讀不到字典就回 2，不回 0。
        run: uv run python -m governance.status.record_step --name no_model_names_in_entry_files --out-dir governance/receipts/steps -- uv run python -m governance.checks.no_model_names_in_entry_files --scan-root .
      - name: 檔案放哪裡走白名單、路徑純 ASCII——自己跑一次乾淨樹
        run: uv run python -m governance.status.record_step --name file_placement_allowlist --out-dir governance/receipts/steps -- uv run python -m governance.checks.file_placement_allowlist --scan-root .
      - name: 雲端工作不准無聲死掉——自己跑一次乾淨樹
        run: uv run python -m governance.status.record_step --name ci_jobs_cannot_die_quietly --out-dir governance/receipts/steps -- uv run python -m governance.checks.ci_jobs_cannot_die_quietly --scan-root .
      - name: 路徑與連結都要解析得到、不准指到 repo 外——自己跑一次乾淨樹
        run: uv run python -m governance.status.record_step --name refs_and_links_resolve --out-dir governance/receipts/steps -- uv run python -m governance.checks.refs_and_links_resolve --scan-root .
      - name: 測試不准依賴環境現況、不准寫進真 repo——自己跑一次乾淨樹
        run: uv run python -m governance.status.record_step --name tests_isolated_from_real_env --out-dir governance/receipts/steps -- uv run python -m governance.checks.tests_isolated_from_real_env --scan-root .
      - name: 提交身分在名單裡——自己跑一次乾淨樹
        # 範圍從 job 那一層的 AOSR_RANGE_BASE／AOSR_RANGE_HEAD 來。
        run: uv run python -m governance.status.record_step --name commit_author_allowlisted --out-dir governance/receipts/steps -- uv run python -m governance.checks.commit_author_allowlisted --scan-root .
      - name: 環境交給 uv 管、uv run 是唯一入口——自己跑一次乾淨樹
        run: uv run python -m governance.status.record_step --name uv_single_entrypoint --out-dir governance/receipts/steps -- uv run python -m governance.checks.uv_single_entrypoint --scan-root .
      - name: 門檻數字只准住在卡的登記簿——自己跑一次乾淨樹
        run: uv run python -m governance.status.record_step --name thresholds_live_only_in_registry --out-dir governance/receipts/steps -- uv run python -m governance.checks.thresholds_live_only_in_registry --scan-root .
      - name: 掃描面不准有洞（宣告的 scope 要等於實際列舉的檔案集合）——自己跑一次乾淨樹
        run: uv run python -m governance.status.record_step --name scan_scope_has_no_holes --out-dir governance/receipts/steps -- uv run python -m governance.checks.scan_scope_has_no_holes --scan-root .
      - name: 合併門口的設定從伺服器回讀比對——唯一准上網的檢查（決策紙 merge-gate-check-may-read-github）
        # 期望住在卡上的 [settings]，放行住在同一張卡的 [[settings.allow]]；放行缺席或過期回 2、不上網。
        run: uv run python -m governance.status.record_step --name merge_gate_read_back --out-dir governance/receipts/steps -- uv run python -m governance.checks.merge_gate_read_back --scan-root .
      - name: 關掉的票都要有一個合進主線的關票 PR——第二支准上網的檢查（決策紙 hand-closed-issues-block-merge）
        # 期望（哪個 repo、主線叫什麼）住在卡上的 [settings]，放行住在同一張卡的 [[settings.allow]]；
        # 放行缺席或過期回 2、不上網。守衛那一層在票被關的當下重開，這一步是合併門口的第二層。
        run: uv run python -m governance.status.record_step --name issues_closed_only_by_merged_pr --out-dir governance/receipts/steps -- uv run python -m governance.checks.issues_closed_only_by_merged_pr --scan-root .
      - name: 雲端收據欄位齊全、每個數字有證據——讀鏡像（上面那一步鏡的）自己跑一次乾淨樹
        run: uv run python -m governance.status.record_step --name receipt_schema_complete --out-dir governance/receipts/steps -- uv run python -m governance.checks.receipt_schema_complete --scan-root .
      - name: 算數的收據來自雲端那一跑、自報離開碼不算——讀鏡像自己跑一次乾淨樹
        run: uv run python -m governance.status.record_step --name receipt_authority_is_the_cloud_run --out-dir governance/receipts/steps -- uv run python -m governance.checks.receipt_authority_is_the_cloud_run --scan-root .
      - name: 收據不准由被查的那一跑寫、不准由人寫——讀鏡像自己跑一次乾淨樹
        run: uv run python -m governance.status.record_step --name four_roles_different_actors --out-dir governance/receipts/steps -- uv run python -m governance.checks.four_roles_different_actors --scan-root .
      - name: 文件裡的 commit sha 與雲端 run id 必須解析得到——自己跑一次乾淨樹（sha 對本機物件庫，run id 對鏡像）
        run: uv run python -m governance.status.record_step --name identity_strings_generated --out-dir governance/receipts/steps -- uv run python -m governance.checks.identity_strings_generated --scan-root .
      - name: 每筆放行都要有理由與到期日——自己跑一次乾淨樹
        run: uv run python -m governance.status.record_step --name exemptions_need_expiry --out-dir governance/receipts/steps -- uv run python -m governance.checks.exemptions_need_expiry --scan-root .
      - name: 密碼、金鑰、.env 不准進版控，歷史也要掃——自己跑一次乾淨樹
        # 這一步要整條歷史。checkout 那邊的 fetch-depth: 0 是它的前提；淺 clone 上這支檢查
        # 回 2（不准在看不到舊提交的樹上宣稱掃過全歷史）。
        run: uv run python -m governance.status.record_step --name secrets_never_committed --out-dir governance/receipts/steps -- uv run python -m governance.checks.secrets_never_committed --scan-root .
      - name: 寫法警衛——自己跑一次乾淨樹
        # ruff 是這張卡的另一半（下一步），這一步只在 ruff 裝不起來的時候回 2。
        run: uv run python -m governance.status.record_step --name style_guard --out-dir governance/receipts/steps -- uv run python -m governance.checks.style_guard --scan-root .
      - name: ruff——寫法警衛的另一半（規則集與它的數字住在 pyproject.toml 的 [tool.ruff]）
        # 刻意獨立一步、不併進上一步：ruff 的離開碼要直接變成這個 job 的結論。
        # 2026-09-10 起改成跟別步一樣包抄寫員。原本不包的理由是「包在別的程式裡就多一層
        # 可以把它吞掉的地方」——但抄寫員不是別的程式，它是原封不動回子程序離開碼的那一層
        # （0 就 0、1 就 1、2 就 2，被訊號殺掉回 128 加訊號號碼），而且它自己有必紅樣本在守；
        # 不包的代價反而更大：收據上 ruff 只剩雲端記的紅綠，0／1／2 三種結局分不開，
        # 而「哪一步准不包」只活在這幾行註解裡，沒有機器在守。規矩卡的第⑤條現在守這件事。
        run: uv run python -m governance.status.record_step --name ruff --out-dir governance/receipts/steps -- uv run ruff check
      - name: 型別警衛——型別對不上就紅、公開函式一律要有標註、逃生門一律紅——自己跑一次乾淨樹
        # 刻意不另開一步 `uv run mypy`：mypy 是這張卡第①層的判決本身（它自己 spawn mypy，
        # 而且必紅樣本要靠它在迷你掃描根上回 1），另開一步就是同一個判決有兩個家。
        # 嚴格度住在 pyproject.toml 的 [tool.mypy]；mypy 不在或自己崩掉，這一步回 2 不回 0。
        run: uv run python -m governance.status.record_step --name type_guard --out-dir governance/receipts/steps -- uv run python -m governance.checks.type_guard --scan-root .
      - name: 後設測試（每張卡六回合），順手把 junit 收據寫到卡宣告的路徑
        run: uv run python -m governance.status.record_step --name pytest --out-dir governance/receipts/steps -- uv run pytest --junitxml=governance/receipts/pytest.junit.xml
      - name: 綠必須是真的綠——收據不准有 skip、收集數不准低於地板
        run: uv run python -m governance.status.record_step --name green_must_be_real_green --out-dir governance/receipts/steps -- uv run python -m governance.checks.green_must_be_real_green --scan-root .
      - name: 上傳收據片段（前面紅了也要傳——那正是要留證據的時候）
        # 步驟層的 `if: !cancelled()`，不是 job 層的 always()：前面有一步紅了這個 job 照樣是紅
        # （步驟的 if 改不了 job 的結論），這一步只負責把片段與 junit 帶出去給 receipt job 合成收據。
        # 沒有片段就報錯：一片都沒有等於連第一步都沒跑，那份 artifact 不該安靜地是空的。
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: governance/receipts
          if-no-files-found: error
          retention-days: 30
