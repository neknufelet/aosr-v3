name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.21"
      - name: 裝依賴
        run: uv sync --locked
      - name: 檢查程式自己跑一次乾淨樹
        run: uv run python -m governance.checks.rule_card_required_fields --scan-root .
      - name: 後設測試（每張卡五回合）
        run: uv run pytest
