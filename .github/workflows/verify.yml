name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # 沒有上限等於可以無聲卡死（GitHub 的預設 360 分鐘不是宣告，是沒人想過這件事）。
    # 由規矩卡 ci-jobs-cannot-die-quietly 帶進來，上限數字登記在那張卡的 [settings]。
    # 15 分鐘的來源：2026-09-09 主線最近兩跑的這個 job 各 51 秒與 48 秒（run 34349380538、
    # 34349903662），約 18 倍，留給第一批 16 張卡都立完之後長大的後設測試。
    timeout-minutes: 15
    # 不要在樹裡留編譯快取。__pycache__ 已經在 .gitignore 裡、列舉時本來就被扣掉，
    # 所以這一行不是為了掃描集合乾淨，是為了跑完不在別人的掃描根裡留雜物。
    # commit-author-allowlisted 要看的範圍。PR 上 checkout 出來的 HEAD 是 GitHub 合出來的
    # 假想合併提交，那一筆不會進主線，所以兩端都明寫 PR 事件裡的 base.sha 與 head.sha；
    # push 到 main 時這兩個是空字串，檢查改用 HEAD~1..HEAD（每次 push 就是一次 PR 合併）。
    # 刻意放在 job 這一層、不是某個步驟：GitHub 給**每個**步驟 GITHUB_EVENT_NAME=pull_request，
    # 後設測試那一步跑乾淨樹時也要看得到範圍，不然它會判「PR 卻拿不到 base」而回 2。
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      AOSR_RANGE_BASE: ${{ github.event.pull_request.base.sha }}
      AOSR_RANGE_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 兩張卡都要整條歷史，少一個都不准改成淺 clone：
          # commit-author-allowlisted 要看 base..head 整段提交——預設的淺 clone 拿不到
          #   base 那顆物件，git log 會非零退出、檢查回 2。
          # secrets-never-committed 要掃**全部歷史**的每一顆 blob——淺 clone 裡舊提交
          #   根本不在物件庫裡，一個「加進來又刪掉」的金鑰列不出來。那張卡因此自己也驗
          #   「這棵樹是不是淺的」（rev-parse --is-shallow-repository 回 true 就回 2），
          #   所以把這一行拿掉不會變成安靜回綠，會變成回 2 擋住合併。
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.21"
      - name: 裝依賴
        run: uv sync --locked
      - name: 規矩卡必填欄位——自己跑一次乾淨樹
        run: uv run python -m governance.checks.rule_card_required_fields --scan-root .
      - name: 離開碼誠實——自己跑一次乾淨樹
        run: uv run python -m governance.checks.check_exit_code_honest --scan-root .
      - name: 斷言不准鎖死數量——自己跑一次乾淨樹
        run: uv run python -m governance.checks.assertions_not_pinned_to_counts --scan-root .
      - name: 進度待辦不准手寫進版控——自己跑一次乾淨樹
        run: uv run python -m governance.checks.status_page_computed_not_typed --scan-root .
      - name: 入口檔的規矩節等於重生結果、兩份逐字相同、不超過行數上限——自己跑一次乾淨樹
        # 判決住在產生器（模組 governance.render_entry）裡，這一步跟它自己的 `--check` 那條路
        # 跑的是同一支函式（同一個 problems／targets），不是第二份實作。
        # 這裡刻意不寫產生器的檔案路徑：ci-jobs-cannot-die-quietly 會把 workflow 原文裡任何
        # 長得像腳本的 token 當成「這個 job 叫到的腳本」收進掃描面，寫了就變成卡面上沒宣告的越權。
        run: uv run python -m governance.checks.entry_files_rendered_from_registry --scan-root .
      - name: 決策紙一題一檔、取代關係雙向、鏈不成環——自己跑一次乾淨樹
        run: uv run python -m governance.checks.decision_paper_structure --scan-root .
      - name: 檔案放哪裡走白名單、路徑純 ASCII——自己跑一次乾淨樹
        run: uv run python -m governance.checks.file_placement_allowlist --scan-root .
      - name: 雲端工作不准無聲死掉——自己跑一次乾淨樹
        run: uv run python -m governance.checks.ci_jobs_cannot_die_quietly --scan-root .
      - name: 路徑與連結都要解析得到、不准指到 repo 外——自己跑一次乾淨樹
        run: uv run python -m governance.checks.refs_and_links_resolve --scan-root .
      - name: 測試不准依賴環境現況、不准寫進真 repo——自己跑一次乾淨樹
        run: uv run python -m governance.checks.tests_isolated_from_real_env --scan-root .
      - name: 提交身分在名單裡——自己跑一次乾淨樹
        # 範圍從 job 那一層的 AOSR_RANGE_BASE／AOSR_RANGE_HEAD 來。
        run: uv run python -m governance.checks.commit_author_allowlisted --scan-root .
      - name: 環境交給 uv 管、uv run 是唯一入口——自己跑一次乾淨樹
        run: uv run python -m governance.checks.uv_single_entrypoint --scan-root .
      - name: 門檻數字只准住在卡的登記簿——自己跑一次乾淨樹
        run: uv run python -m governance.checks.thresholds_live_only_in_registry --scan-root .
      - name: 掃描面不准有洞（宣告的 scope 要等於實際列舉的檔案集合）——自己跑一次乾淨樹
        run: uv run python -m governance.checks.scan_scope_has_no_holes --scan-root .
      - name: 每筆放行都要有理由與到期日——自己跑一次乾淨樹
        run: uv run python -m governance.checks.exemptions_need_expiry --scan-root .
      - name: 密碼、金鑰、.env 不准進版控，歷史也要掃——自己跑一次乾淨樹
        # 這一步要整條歷史。checkout 那邊的 fetch-depth: 0 是它的前提；淺 clone 上這支檢查
        # 回 2（不准在看不到舊提交的樹上宣稱掃過全歷史）。
        run: uv run python -m governance.checks.secrets_never_committed --scan-root .
      - name: 寫法警衛——自己跑一次乾淨樹
        # ruff 是這張卡的另一半（下一步），這一步只在 ruff 裝不起來的時候回 2。
        run: uv run python -m governance.checks.style_guard --scan-root .
      - name: ruff——寫法警衛的另一半（規則集與它的數字住在 pyproject.toml 的 [tool.ruff]）
        # 刻意獨立一步、不併進上一步：ruff 的離開碼要直接變成這個 job 的結論，
        # 包在別的程式裡就多一層可以把它吞掉的地方。
        run: uv run ruff check
      - name: 型別警衛——型別對不上就紅、公開函式一律要有標註、逃生門一律紅——自己跑一次乾淨樹
        # 刻意不另開一步 `uv run mypy`：mypy 是這張卡第①層的判決本身（它自己 spawn mypy，
        # 而且必紅樣本要靠它在迷你掃描根上回 1），另開一步就是同一個判決有兩個家。
        # 嚴格度住在 pyproject.toml 的 [tool.mypy]；mypy 不在或自己崩掉，這一步回 2 不回 0。
        run: uv run python -m governance.checks.type_guard --scan-root .
      - name: 後設測試（每張卡六回合），順手把 junit 收據寫到卡宣告的路徑
        run: uv run pytest --junitxml=governance/receipts/pytest.junit.xml
      - name: 綠必須是真的綠——收據不准有 skip、收集數不准低於地板
        run: uv run python -m governance.checks.green_must_be_real_green --scan-root .
