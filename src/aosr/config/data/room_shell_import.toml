# 房間殼匯入檢查的設定（票 #1299）：使用者上傳的 Rhino 標準檔讀成房間殼之後，
# 檢查程式拿這幾格當界線。這一份只管「讀進來、檢查、說人話」，不碰任何聲學計算。
#
# 每一格的出處（主對話 2026-11-26 定，老闆授權「你們先想辦法」）：
# - 焊點距離：兩個頂點相距不到這個長度就當同一點。轉檔出來的座標四捨五入到 0.1 毫米，
#   所以取 0.1 毫米；比它大會把真的分開的點黏在一起。
# - 共平面：法線夾角與平面距離都在界內的三角形算同一個平面，用來數「合併後的面數」。
#   0.5 度與 5 毫米是畫圖誤差的量級，不是物理門檻。
# - 太小的三角形：面積小於 1 平方公分的列提醒（不擋）；切網格時會重切。
# - 接近平行：兩個朝向彼此的平面夾角在這個度數內，列出來給人看（只列、不擋）。
#   5 度是討論稿第 16 條的預設，文獻未核（未驗，推測），之後補。
# - 列平行面對時只看面積至少這麼大的平面，太小的面不會造成顫動回聲。
# - 合併後的平面數上限：超過就擋，面太多時之後的計算會失控。
# - 檔案大小上限：只讀本機上傳的房間殼，正常檔案在 1 MB 以內。

weld_m = "0.0001"
coplanar_angle_deg = "0.5"
coplanar_offset_m = "0.005"
min_triangle_area_m2 = "0.0001"
parallel_angle_deg = "5"
parallel_min_area_m2 = "0.1"
max_planes = 400
max_file_bytes = 52428800
