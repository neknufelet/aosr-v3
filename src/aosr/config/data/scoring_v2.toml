schema_version = "aosr.scoring.v2.alpha1"
status = "probe-only"

[response]
equivalence_db = 0.5
equivalence_sweep_db = [0.25, 0.5, 1.0]

[fem]
low_hz = 20.0
high_hz = 200.0
evaluation_axis = "log-1-24-octave"

[ism]
low_hz = 200.0
high_hz = 1000.0
max_delay_ms = 20.0
samples_per_fringe = 5

[listening_cross]
profile = "local_cross_7"
radius_m = 0.10
order = ["center", "front", "back", "left", "right", "up", "down"]
frame_tolerance = 1e-6
min_horizontal_projection_norm = 1e-9

[dip_eligibility]
min_width_oct = 0.16666666666666666
required_points = 3
require_center = true

[rfz_v2]
window_ms = 20.0
receiver_role = "center"
band_status = "unresolved"
threshold_status = "unresolved"
