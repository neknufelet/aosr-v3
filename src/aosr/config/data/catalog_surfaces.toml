# 文獻頻帶吸音率的硬面材料（門、窗、木地板、石膏板、磚、混凝土）。
# 數字原樣照手冊，不換算；材料層照決策紙 catalog-absorption-random-incidence-paris-inversion 換成阻抗表。

# 換成阻抗表時取點：涵蓋整條產品頻率軸（20 Hz 起、高頻到 2 萬 Hz 上下），每八度 6 點，以 1000 Hz 對齊（頻帶中心落在點上）；表內對數內插跟逐點反推最多差約 2.2%（12 筆實算，阻抗）。
[table]
lowest_hz = 10.0
highest_hz = 24000.0
points_per_octave = 6
reference_hz = 1000.0

[[surface]]
id = "door_wood_solid"
label = "實心木門"
band_center_hz = [125.0, 250.0, 500.0, 1000.0, 2000.0, 4000.0, 8000.0]
absorption = [0.14, 0.10, 0.06, 0.08, 0.10, 0.10, 0.10]
links = ["https://pyroomacoustics.readthedocs.io/en/stable/pyroomacoustics.materials.database.html", "https://www.ptb.de/cms/fileadmin/internet/fachabteilungen/abteilung_1/1.6_schall/1.63/abstab_wf.zip"]
notes = ["估計，非本件實測：手冊的無規入射頻帶吸音率，125 Hz 以下用 125 Hz 的值延伸，低頻共振（門板、窗、架高地板）沒有算進去。"]
source = """
pyroomacoustics materials database（材料資料庫網頁）列 wooden_door：Solid wooden door。
這份表與 PTB（德國聯邦物理技術研究院）吸音率表 abstab_wf.xls 同源：本 repo furniture_materials.toml 已逐列核過的 3 mm 單層玻璃（PTB 第 207 列）與 16 mm 木板＋40 mm 龍骨（PTB 第 420 列）兩列，數字與這份表逐帶相同；其餘列沒有回 PTB 原表逐列核對（未驗，推測同源）。
吸音率當無規入射值，依決策紙 catalog-absorption-random-incidence-paris-inversion：log10 頻率內插、兩端延伸、Paris 公式反推硬側實數阻抗。
"""

