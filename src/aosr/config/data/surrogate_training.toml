# 網頁替新切法建替身（surrogate，縮減模型）時，訓練材料與留出材料怎麼抽、建模預設用幾個行程（#1098）。
# 建模停止規則不在這裡：照 fem_reduced.toml（殘差達標或完整解預算用完就停）；
# 替身准不准用由精度契約登記簿那兩把留出尺判，不由這裡判。
# 數字是工程暫定：照 #990 r4 與 #561 分區示範房那兩次的做法推廣到任意切法；調整走 PR。

[training]
# 訓練材料的隨機組：固定種子、組數。另外一定有：全部原牆、方案存檔那一份（跟全部原牆不同時）、
# 每個家族的角點（每一片都同一個角點）、一組各片輪流不同家族的混搭。
seed = 1098202611110
random_sets = 30

[holdout]
# 留出材料（只拿來驗、不拿來建）的隨機組：另一個種子。另外一定有：全部原牆、方案存檔那一份（跟全部原牆不同時）、
# 一組各片輪流不同家族、厚度與空腔都取中間值的混搭。
seed = 1098202611199
random_sets = 7

[sampling]
# 隨機組裡每一片「維持原牆」的機率，照組序輪流（每個機率一樣多組）。
bare_probabilities = [0.0, 0.2, 0.4, 0.6, 0.8]
# 隨機組每幾組有一組用剛背安裝（rigid），其餘貼在原牆上（on_wall，網頁預設）：同一份切法兩種安裝方式共用一份替身。
rigid_every = 3

[sampling.family_weights]
# 隨機組裡要貼材料的片抽哪個家族的機率；家族要等於搜尋設定（material_gradient.toml 的 [[family]]），加起來是 1。
# 48K 有厚度與空腔兩個連續變數，抽多一點。
glass_wool_48k = 0.5
glass_wool_24k = 0.25
glass_wool_96k = 0.25

[compute]
# 建模與留出驗證的完整解行程數（#1036 實量：109 分區示範房 4 行程、稠密段實體核數）。
workers = 4
