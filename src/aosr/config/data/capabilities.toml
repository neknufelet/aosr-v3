# 能力與驗證範圍表（票 #315 第一刀；第二刀照找碴報告修誠實度與接線）。
#
# **這一份在做什麼。** 一句話：哪個入口、在什麼條件下、真的被驗過——寫成機器讀得到的表。
# 一個入口一節（`[[entry]]`），一個條件組合一條（`[[entry.capability]]`）；一條條件組合是
# 「房型 × 材料形式 × 頻率範圍 × 輸出欄位」四格的乘積。`status` 只有三個值：
#
# - `validated`   今天真的量過，而且指名完整測試 id 與答案檔（`evidence` 不准空）。
# - `experimental` 接得上、跑得動，但這一版沒有可指名的驗證收據。
# - `unsupported` 這一版根本不吃這種輸入；入口收到就明確報錯，不假裝算得出來。
#
# **為什麼要這一張。** 上一代的事故形狀是「程式能吃某種輸入，但沒有人說得出它驗過沒有」——
# 能力邊界只存在於最後一個改它的人的記憶裡。表寫出來之後，邊界是資料、可以被機器咬。
#
# **第一版只寫今天真的驗過的組合**（票上的規矩）：寧可少寫，不寫沒量過的。
# 每一條 `evidence` 都是人在這一刀用 `--collect-only` 對過的測試節點、加上真的讀得到的
# 答案檔；`note` 說明這條為什麼是這個 status。找不到真的碰得下去的證據就標 `experimental`，
# 不假裝 validated。
#
# **材料形式的代號。** `real_frequency_independent_impedance` 是「六面各一個與頻率無關的
# 實數阻抗」——三路報表的命令列今天只吃這一種。複數阻抗（帶虛部）與逐頻阻抗（每面一個
# 頻率對阻抗的數列）接得到求解層、但報表入口與有限元素入口這一版沒有把它們接出去，
# 所以標 `unsupported`，指向票 #309。

[[entry]]
name = "three_lane_report"
module = "aosr.physics.three_lane_report_cli"
note = "三路接合物理量報表；輸入 JSON 的 impedance_pa_s_per_m_by_wall 六面各一個正實數。散射係數 scattering_by_wall 另一種材料形式，逐面一個落在 [0,1] 的係數。"

[[entry.capability]]
room = "shoebox"
materials = "real_frequency_independent_impedance"
frequency_hz = [20.0, 11166.0]
outputs = [
  "fem_energy",
  "direct_energy",
  "reflected_energy",
  "interference_energy",
  "late_energy",
  "total_energy",
  "t20_s",
  "t30_s",
]
status = "experimental"
evidence = []
note = "整條細軸與逐帶平均在正式幾何路與有限元素網格上逐位守住；命令列印出頂層與七個八度帶。參考房 6.0×4.0×3.0 公尺、四倍特性阻抗。這一條標 experimental：表上指名的考卷都把有限元素求解換成假的（只用假能量驗接線與加權），而正式細軸那題 test_solve_fem_energy_matches_direct_solver_on_official_mesh 也只是同一批函式重算再比，沒有對獨立參考答案；真的碰到正式網格的有限元素契約在 fem_rigid 那一節，不在這裡。頻率範圍是宣告的細軸，三處頻率上限一致性考卷把表上整數端點對著正式細軸首尾守住。適用範圍按兩把尺分開講（票 #337 落地的逐階分工，決策紙 stage-nine-reflection-order-is-a-setting.md 的「代價」那一段，數字照抄、不是這一版重新量的）：絕對聲壓級這把尺——吸音集中在大面時會少算，單一大面（天花板）最壞 −0.97 dB，地板與天花板都處理、四面硬牆那種常見的房更壞，另一條量測線量到 −1.90 dB；要報絕對值就要把這一格讀進去。候選排名這把尺——夠用：Spearman 0.993、前五名全中、反序率 0.4%。升高交接階數 K 對兩把尺效果相反：對排名有效，對絕對值救不回來。交接階數 K 哪些值驗過（票 #341）：**只有 K=3 有考卷在守數值**——上面講的那些數字、逐位守住的那幾題、以及輸入檔不給 K 時的預設，全部是 K=3；程式收 1 到 8（room_paths.SUPPORTED_MAX_ORDER 的上限），報表也印得出當次用的 K，但那個範圍裡除了 K=3 之外沒有任何一題考卷在比數值，所以這一條的 experimental 只蓋到 K=3，別的 K 是「收得下、沒有驗過數值」。票 #305 把反彈點精確落在交線的路徑改為同一點消化所有相交牆面；整齊座標與挪開座標都有考卷守到合法上限並核對階數帳，但不把這項可用性考卷當成 K≠3 的數值驗證。"

