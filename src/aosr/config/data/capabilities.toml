[[entry]]
name = "fem_rigid"
module = "aosr.physics.fem_rigid"
note = "正式 P2 剛性參考房；剛性邊界（六面 gamma=0）與 FEniCS 凍結答案逐點比對。"

[[entry.capability]]
room = "shoebox"
materials = "rigid_walls"
frequency_hz = [10.0, 20.0]
outputs = ["pressure_abs", "pressure_phase_deg"]
status = "validated"
evidence = [
  "tests/engine/test_fem_rigid_contract.py::test_fem_lane_rigid_pressures_meet_the_analytical_contract",
  "blueprint/reference_fem_rigid.json",
]
note = "A/B 兩組共九個考點逐點對獨立解析模態解，題目與網格身分取自答案檔 blueprint/reference_fem_rigid.json。頻率範圍寫考卷真的蓋到的九點上界（最高 20 Hz）——剛性解析契約的物理上限就是 20 Hz；有限元素路的頻率軸本身到 300 Hz，那是軸不是這一條驗過的範圍。1/3 八度帶平均（third_octave_mean_energy_db）不住這張表：表上這一條只宣告逐點壓力。"

[[entry.capability]]
room = "shoebox"
materials = "real_frequency_independent_impedance"
frequency_hz = [10.0, 226.27]
outputs = ["pressure_abs", "pressure_phase_deg"]
status = "validated"
evidence = [
  "tests/engine/test_fem_fenics_answers.py::test_frozen_mesh_pressures_meet_fenics_contract",
  "blueprint/fem_fenics_answers.json",
]
