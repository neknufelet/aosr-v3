[[entry]]
name = "late_energy"
module = "aosr.physics.late_energy_cli"
note = "晚期混響能量逐頻核對表；上一代答案是第二類相容紀錄，差距照量、不作通過判決。"

[[entry.capability]]
room = "shoebox"
materials = "real_frequency_independent_impedance"
frequency_hz = [125.0, 8000.0]
outputs = [
  "alpha_by_wall",
  "alpha_bar",
]
status = "validated"
evidence = [
  "tests/engine/test_late_energy_contract.py::test_result_keeps_physical_properties_and_reference_metadata[flat]",
  "tests/engine/test_late_energy_contract.py::test_result_keeps_physical_properties_and_reference_metadata[lowabs]",
  "tests/engine/test_late_energy_cli.py::test_compare_names_report_band_without_a_legacy_answer",
  "tests/engine/test_report_bands_8khz.py::test_late_energy_capability_row_spans_exactly_the_report_band_centers",
]
note = "七個八度帶的六面吸收率 alpha_by_wall 用的是材料層那支 Paris 無規入射函式（materials/catalog_absorption.complex_random_incidence_absorption）；考卷叫它、產品也叫它，所以這一格是查接線、不是獨立重算——那一支函式本身由材料層真的獨立驗過：test_catalog_absorption.py::test_complex_paris_matches_independent_4096_point_values 對 4096 點數值積分真值逐點比對。alpha_bar 這一格才有獨立性：考卷自己拿房長乘出面積、對六面吸音率做面積加權平均再逐頻比對，不是把產品的加權再跑一次（漏掉面積權重、寫成算術平均在這裡紅）。新增考卷用相同實數阻抗真的算到 8000 Hz，並守住該帶沒有上一代答案時明說而不阻擋。上一代答案是第二類相容紀錄、不作通過判決，所以輸出欄只宣告驗得到的物理性質這兩欄，不把不作判決的比較欄算進來；輸入題目取自答案檔 blueprint/reference_art_flat.json 與 blueprint/reference_art_lowabs.json 的 parameters（六面各一個與頻率無關的實數阻抗）。"

[[entry]]
name = "catalog_absorption"
module = "aosr.materials.catalog_absorption"
note = "型錄頻帶吸音率換成阻抗；最後一段走 Paris 無規入射反推。"

[[entry.capability]]
room = "none"
materials = "catalog_band_absorption"
# 範圍是宣告的細軸；既有三題用自訂頻率軸，新題另以正式細軸驗 4000 與 8000 Hz 型錄端帶。
# 軸端仍由三處頻率上限一致性考卷對正式細軸的首點與末點取整值，不靠型錄帶數反推。
frequency_hz = [20.0, 11166.0]
outputs = ["impedance_pa_s_per_m", "clamped", "extrapolated"]
status = "validated"
evidence = [
  "tests/engine/test_catalog_absorption.py::test_catalog_interpolates_alpha_on_log_frequency_before_inversion",
  "tests/engine/test_catalog_absorption.py::test_catalog_above_one_is_clamped_at_center_and_extended_points",
  "tests/engine/test_catalog_absorption.py::test_catalog_flatly_extends_end_bands_and_marks_only_outside_points",
  "tests/engine/test_catalog_absorption.py::test_catalogs_ending_at_four_or_eight_kilohertz_cover_the_official_axis",
]
note = "這條組合的方向是型錄頻帶吸音率換成細軸阻抗：先在對數頻率上內插原始型錄 α，再逐點反推阻抗，並標夾值 clamped 與延伸 extrapolated。表上指名的前三題守反向路與細軸內插；新增一題用正式細軸守只到 4000 Hz 與到 8000 Hz 的型錄都能算完，且端帶外照規則平坦延伸。正向「阻抗 → 吸音率」那題不是這條。這條與房型無關，room 固定寫 none。頻率範圍由三處上限一致性考卷對正式細軸首尾守住。"

[[entry]]
name = "timbre_evaluator"
module = "aosr.scoring.timbre"
note = "音色平衡第一層評估器（票 #345）：吃一份候選 × 喇叭 × 接收點的細軸總能量，量傾斜、起伏（均方根與峰谷清單）、對目標偏差，只量不打分。"

[[entry.capability]]
room = "none"
materials = "three_lane_report_total_energy"
# 範圍照它吃的那份報表（three_lane_report）宣告的細軸；評估器自己要求的覆蓋範圍住品質登記簿，
# 資料蓋不到的那一段標 data_coverage_short，不在這裡假裝蓋得到。
frequency_hz = [20.0, 11166.0]
outputs = [
  "tilt_db_per_octave",
  "residual_rms_db",
  "features",
  "target_deviation_rms_db",
  "deviation_curve",
]
status = "experimental"
evidence = []
note = "量法照 #345 五格；門檻與目標全是 baseline；鑑別力對型錄候選未量。它吃的三路報表那一列是 experimental，這一條不准比它高。考卷 tests/engine/test_scoring_timbre.py 全用程式造的曲線、不跑物理，所以只證明量法照定義跑，不證明對真報表的鑑別力；真報表接線的整合考卷在 #359。這個評估器與房型、材料無關，room 固定寫 none，materials 寫它吃的是哪一種資料。"

[[entry]]
name = "reflections_and_echo_evaluator"
module = "aosr.scoring.reflections"
note = "反射與顫動回音第一層評估器（票 #351）：兩聲道主位與周圍點逐路徑、逐區、逐帶只量不算代價。第二層代價照登記簿從原始量重算；只看主位兩支、四區已判完的非負超標取平均，10 dB 比例尺與四區等權是基線。逐區超標標記與顫動警戒不被平均解除；周圍點不進分數，顫動只待複核不淘汰。300 Hz–1 kHz 沿用 −10 dB 沒有另外出處。"

[[entry.capability]]
room = "shoebox"
materials = "real_frequency_independent_impedance"
frequency_hz = [20.0, 11166.0]
outputs = ["reflections", "zones", "total_window_energy_db", "wall_pairs"]
status = "experimental"
evidence = []
note = "頻率範圍寫的是它吃的整條細軸（跟上游報表那一列同一條）；兩種評估範圍分開：早期反射（reflections、zones、total_window_energy_db）逐細軸點只評 300 Hz–8 kHz（登記簿 reflections_and_echo.frequency_range_hz）；牆對（wall_pairs）是 21 個 1/3 八度子帶，精確帶界約 88 Hz 到 11.31 kHz（最高子帶上緣高過細軸末點 11166 Hz；老闆 09-24 拍加回 10 kHz 這一帶），顫動警戒清單是標稱 400 Hz–10 kHz（登記簿 reflections_and_echo.flutter_alert_band_centers_hz），400 Hz 以下只當診斷。現版只用時間窗篩選，窗內不同延遲沒有給不同代價，尚未完整處理反射的時間聽感；未含喇叭指向性。材料不隨頻率變，逐帶沒有鑑別力，待 #309。路徑用整房合成散射，顫動用逐面散射；家具不在模型，沒有空氣吸收。第 3 階以上與補算路徑沒有答案檔比對；只做兩聲道。上游報表仍是 experimental，本條不高於上游。第二層代價照登記簿從原始量重算；只看主位兩支、四區已判完的非負超標取平均，10 dB 比例尺與四區等權是基線。逐區超標標記與顫動警戒不被平均解除；周圍點不進分數，顫動只待複核不淘汰。300 Hz–1 kHz 沿用 −10 dB 沒有另外出處。"
