key = "timbre_balance.smoothing_width_octave_tilt"
value = 0.3333333333333333
unit = "oct"
status = "baseline"
source_kind = "engineering_recommendation"
source = "測試基線，未查證；正式值等 #358"

[[purpose.setting]]
key = "timbre_balance.smoothing_width_octave_ripple"
value = 0.16666666666666666
unit = "oct"
status = "baseline"
source_kind = "engineering_recommendation"
source = "測試基線，未查證；正式值等 #358"

[[purpose.setting]]
