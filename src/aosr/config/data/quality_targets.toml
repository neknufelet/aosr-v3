source = "票 #430 老闆 2026-09-22 拍板；跟 reverberation.target_t20_nominal_s_by_band 合起來才是區間，算法與出處寫在那一條；8000 Hz 帶 0.25–0.6 秒（名義 0.425、容許 0.175）自 #437 生效"
