source_kind = "engineering_recommendation"
source = "測試基線，未查證；正式值等 #358"

[[purpose.target]]
key = "timbre_balance.peak_depth_db"
value = 3.0
unit = "dB"
cost_shape = "beyond_threshold_only"
worse_reference = 9.0
status = "baseline"
source_kind = "engineering_recommendation"
source = "測試基線，未查證；正式值等 #358"

[[purpose.target]]
