[[purpose.setting]]
key = "timbre_balance.min_points"
value = 12
unit = "1"
status = "baseline"
source_kind = "engineering_recommendation"
source = "測試基線，未查證；正式值等 #358"

[[purpose.target]]
key = "timbre_balance.target_tilt_db_per_octave"
value = 0.0
unit = "dB/oct"
cost_shape = "in_range_best"
tolerance = 1.0
worse_reference = 2.0
status = "calibrated"
source_kind = "product_choice"
source = "三個數字出處不同種，登記簿一條只有一格出處種類，所以整條標產品選擇、逐項寫明：value 0 由票 #368 拍板，來自標準那條以平均聲壓級為中心的平坦容許帶（原文沒有印這個數字，是形狀換算）；tolerance 1.0 由票 #376 拍板，是把同一條 ±3 dB 容許帶換算到傾斜擬合段 80–4000 Hz（5.64 個八度、純傾斜兩端各偏半個跨距，上限 1.06）取的整數；worse_reference 2.0 由票 #376 拍板，沒有原文可引，是產品選擇（代價到 1 落在 3.0 dB／八度，等於兩端各差 ±8.5 dB）"
source_id = "ITU-R BS.1116-3"
source_version = "02/2015"
locator = "§8.3.4.1 Figure 2（印刷頁 15–16）；另見 EBU Tech 3276 第 2 版 §2.4 Fig. 2（p.7）"
conditions = "每支喇叭各自在參考聆聽點量 1/3 八度頻響、粉紅噪音；容許帶以平均聲壓級 Lm 為中心的平坦參考，不是傾斜目標"
frequency_range_hz = [50.0, 16000.0]
context = "小損傷主觀測試用的參考聆聽房（雙聲道）"
verification_digest = "sha256:8b4b442c5933b6ea030d025ea5f63c0c1799c23f8e86380fb315197b621abd9c"

[[purpose.target]]
key = "timbre_balance.target_deviation_rms_db"
value = 0.0
unit = "dB"
cost_shape = "less_is_better"
worse_reference = 6.0
status = "baseline"
source_kind = "engineering_recommendation"
source = "測試基線，未查證；正式值等 #358"

[[purpose.target]]
key = "timbre_balance.residual_rms_db"
value = 0.0
unit = "dB"
