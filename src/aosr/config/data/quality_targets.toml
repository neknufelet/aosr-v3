# 殘響目標區間由名義值與逐帶容許量生成；三張等長表的同一索引代表同一中心頻帶。
# 目標區間（nominal 與 tolerance 兩條）在票 #430 升成正式數字；其餘仍是暫定基線，另由 #339 清單拍板。
# 8000 Hz 帶 0.25–0.6 秒自 #437 起生效。
[[purpose.setting]]
