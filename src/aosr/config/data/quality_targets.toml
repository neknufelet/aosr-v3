source_kind = "engineering_recommendation"
source = "測試基線，未查證；正式值等 #358"

[[purpose.setting]]
key = "reverberation.target_t20_nominal_s_by_band"
value = [0.5, 0.45, 0.45, 0.45, 0.45, 0.45, 0.425]
unit = "s"
status = "calibrated"
source_kind = "product_choice"
source = "票 #430 老闆 2026-09-22 拍板：目標區間 0.3–0.6 秒（中心 0.45），依據是老闆的實務判斷；IEC 60268-13（給一般居家聆聽室的標準）只讀到別的論文轉述的 0.3–0.6 秒，原文付費沒讀到，不當出處。這一格跟容許量那一格合起來才是區間：250–4000 Hz 是 0.45±0.15；125 Hz 是 0.5±0.2（0.3–0.7 秒）——下限不動，上限照兩份標準的容許帶往上翹：標準原文只給兩個端點（200 Hz 比中頻多 0、63 Hz 比中頻多 0.25 秒），在對數頻率上拉直線，125 Hz 多 0.25×ln(200/125)÷ln(200/63)＝0.10 秒。程式只罰超出區間的量，區間內不分高下。8000 Hz 那一帶拍的是 0.25–0.6 秒（EBU 3276 的畫法，只准偏短），原本等晚期混響算得到那一帶才加進頻帶清單，自 #437 起已加進清單。查到的居家文獻（Kaplanis 等 2019 的聽感實驗：超過 0.4 秒開始不討喜）記在票 #430；8000 Hz 帶 0.25–0.6 秒（名義 0.425、容許 0.175）自 #437 生效"
source_id = "ITU-R BS.1116-3"
source_version = "02/2015"
locator = "§8.2.3.1 Figure 1（印刷頁 14）；另見 EBU Tech 3276 第 2 版 §2.3 Fig. 1（p.6）"
conditions = "兩份標準的容許帶是相對平均殘響 Tm、用 1/3 八度量的；這裡只借它的低頻走勢（上限從 200 Hz 往 63 Hz 多讓到 0.3 秒、下限從 100 Hz 起），中頻的絕對區間是產品選擇"
frequency_range_hz = [63.0, 8000.0]
context = "標準是評估用的參考聆聽房；這一條的用途是居家兩聲道聆聽室"
verification_digest = "sha256:8b4b442c5933b6ea030d025ea5f63c0c1799c23f8e86380fb315197b621abd9c"

