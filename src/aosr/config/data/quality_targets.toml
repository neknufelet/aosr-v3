source = "測試基線，未查證；正式值等 #358"

# 聆聽區六條數字都是工程暫定基線：主分項容許帶先按小幅位置差不罰、再用較寬尺度正規化；
# 最差偏差另用較寬門檻守底線。正式值要另行校準，不從這組暫定數字升格推定。
[[purpose.target]]
key = "listening_area_stability.tilt_weighted_mean_deviation"
value = 0.0
unit = "dB/oct"
cost_shape = "in_range_best"
tolerance = 0.5
worse_reference = 2.0
status = "baseline"
source_kind = "engineering_recommendation"
source = "測試基線，未查證；正式值等 #358；in_range_best 的代價 1 落在容許帶外再加上 worse_reference，不是落在 worse_reference"

[[purpose.target]]
