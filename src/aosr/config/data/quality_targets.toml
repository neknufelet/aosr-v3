# 品質登記簿 schema 第 1 版。每一條各自帶狀態：baseline 是測試基線（佔位、不是產品標準），
# calibrated 是老闆拍過、帶得出結構化出處的正式數字。
# 升等的唯一出口：那一格數字由老闆在票上拍板、同一支合併請求帶一張決策紙、出處欄逐格補齊
# （查證線索來自票 #358 的查證表）。哪幾條已經升等，由考卷 tests/engine/test_quality_targets.py
# 的名冊擋著——偷偷把一條改成 calibrated 會紅。
