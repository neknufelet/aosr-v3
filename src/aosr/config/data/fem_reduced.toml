# 有限元素替身方程式（投影式降階）建模設定（#561）。
# 決策紙：docs/decisions/fem-reduced-model-jax-evaluation-for-stage-three.md。
# 數字照 #610 實驗那一版建模腳本（工作區 610-rom 的建模程式）抄來，是工程暫定，不是驗證門檻；
# 替身準不準由精度契約登記簿那兩條留出材料的尺判，不由這裡的停止值判。

[build]
# 起點：從訓練材料裡平均挑幾組、每組在頻率軸上平均挑幾個頻點，全部完整解當第一批快照。
initial_impedance_count = 4
initial_frequency_count = 16
# 殘差貪婪補點：每輪從還沒解過的（材料、頻點）裡用固定種子抽幾個候選，
# 量替身殘差，取殘差最大的幾個完整解、補進快照。
candidates_per_round = 96
batch = 32
# 抽到的候選最大相對殘差不超過這個值就停（只是選點的停止值，子集最大值不是全部候選的上界）。
stop_residual = 0.01
# 完整解（每次一個分解、每支喇叭各解一次）次數上限；到了就停，不再補點。
max_full_solves = 400
# 每次完整解的相對殘差 ‖b−Au‖/‖b‖ 超過這個值就報錯，不收這個快照。
full_solve_max_relative_residual = 1.0e-9
# 奇異值小於最大奇異值乘這個比例的方向丟掉（截斷）。
svd_relative_cutoff = 1.0e-12
# 候選抽樣的固定種子（#610 那一次的種子）。
greedy_seed = 61020261012
