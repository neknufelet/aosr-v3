source = """
土屋裕造〈家具の吸音特性とその使用例〉，戶田建設技術研究報告 39，2013.10，表－2、圖－2 S1／S2 https://www.toda.co.jp/lucubration/pdf/v615.pdf ；
PTB abstab_wf.xls selection_table 第 483／484 列轉錄 Beranek Music, Acoustics and Architecture (1962) 的皮／布座席比 https://www.ptb.de/cms/fileadmin/internet/fachabteilungen/abteilung_1/1.6_schall/1.63/abstab_wf.zip ；
Nocke 2017 αObj 換算式；數字依 defaults-proposal.md 第 2.1、2.3 節。
"""
conditions = """
估計，非本件實測；參考的是合成皮，真皮無同類實測。戶田 S1 整件吸音面積除以該沙發自己的外露六面 4.234 m²，
得 0.248／0.377／0.396／0.316／0.219／0.135，取兩位；深 0.70 m 為提案推測，原文 D2,700 mm 未解。
下界取 S2 靠牆量測除以同面積；上界逐帶取 S1 除五面 3.352 m² 與布面預設乘 Beranek 皮／布比的較大者。
