status = "estimated"
source_kind = "object_measurement_conversion"
source = """
Acoustic Facts 宣告 447 Abstracta Akunok Sofa 2 Seater https://api.acousticfacts.com/measurement-report/product/447/0?locale=en ；
289 Offecct Float High Large Sofa https://api.acousticfacts.com/measurement-report/product/289/0?locale=en ；
290 Offecct Smallroom Sofa 1500 https://api.acousticfacts.com/measurement-report/product/290/0?locale=en ；
303 Götessons Sofa sound booth Freely https://api.acousticfacts.com/measurement-report/product/303/0?locale=en ；
座椅上界另含 316 Götessons Hang On https://api.acousticfacts.com/measurement-report/product/316/0?locale=en ；
沙發下界另含土屋裕造，戶田建設技術研究報告 39，2013 https://www.toda.co.jp/lucubration/pdf/v615.pdf ；
Nocke 2017 Lärmbekämpfung 12(6) 199–202 https://akustikbuero-ol.de/images/akustikbuero-ol/pdf/Laermbekaempfung_06_2017_199-202.pdf 。
數字依 sofa-proposal.md 第 3、4.2 節、defaults-proposal.md 第 2.1、2.5 節與指揮者補定。
"""
conditions = """
估計，非本件實測。四張高背布或皮面吸音沙發依 ISO 354／ISO 20189 量整件吸音面積，
各除以自己的外露五面面積（Nocke αObj）後逐帶取中位數；沙發與座椅共用預設，五面同值是資料限制。
可能偏高，尤其 2000、4000 Hz；面料不全明確；物件平均值當無規入射吸音率是延伸用法，角度關係未實測。
沙發下界：戶田整件吸音面積除以戶田那張自己的外露面積 4.234 m²，得 0.248／0.377／0.396／0.316／0.219／0.135，
跟四張高背沙發逐帶取最小，取整為 0.25／0.28／0.33／0.32／0.22／0.14；不依賴本案沙發尺寸。
戶田有腳、底面外露；4.234 m² 含六面，深 0.70 m 是提案推測（原文 D2,700 mm 尚未解）。
沙發上界取四張高背沙發逐帶最大；座椅下界取這四張逐帶最小，上界取沙發上界與 Hang On 五面換算值的較大者。
63、8000 Hz 預設未知（計算時用相鄰頻帶延伸代算）；沙發兩帶界線照 sofa-proposal.md 4.2 取相鄰端帶，
是未知頻帶的假設區間，不是資料；座椅提案未另給兩帶假設，界線只存 125–4000 Hz。
計算先在 log10 頻率內插原始吸音率，再用 Paris 公式反推硬側實數阻抗；量測範圍外延伸並逐點標出。
"""

