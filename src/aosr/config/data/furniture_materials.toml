conditions = """
估計，非本件實測；玻璃棉或岩棉類約 40 mm（Knauf 未寫芯材）。預設取 Ecophon Solo Square 1200 吊深 400 mm、
Rockfon Eclipse Square 1160 單件吊高 500 mm、Knauf Sonic Element 1180 吊高 190 mm，依 ISO 354 每件吸音量，
各除自己的六面面積後逐帶取中位數，六面同值是資料限制。αObj 含邊緣繞射，當無規入射吸音率是延伸用法。
吊深 0.2–1 m 與 1.2×0.6 m 共用一組；小板高頻可能略高。群組片距小於 0.5 m 可能偏高；PET 纖維沒有每件同類資料，不另列。
上下界涵蓋不同吊深、小板與 Karmann ASTM C423 四片組；該論文厚度 40 mm 與廠商 22／30 mm 對不上，原因未解。
63、8000 Hz 預設未知（計算時用相鄰頻帶延伸代算）；Karmann 旁證顯示 63 Hz 延伸可能高估約 5–8 倍。
63 Hz 0.01–0.17 與 8000 Hz 0.68–0.9512 是 cloud-proposal.md 5.3 的未知頻帶假設區間，不是資料。
125–4000 Hz 上界的 1.01 源於 Ecophon 1200×600 每件 1.6 m² ÷ 1.584 m²，原值照存。
先 log10 頻率內插原始吸音率，再逐點夾到 Paris 可達頂點並標出、反推硬側實數阻抗；資料層不預先截到 1。
天雲只供早期反射，未加入整房殘響與交接頻率；角度關係未實測。
"""
