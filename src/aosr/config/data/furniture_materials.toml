63、8000 Hz 未知（計算時用相鄰頻帶延伸代算）；界線未另給這兩帶資料。
αObj 當無規入射吸音率是延伸用法，先 log10 頻率內插再 Paris 硬側實數阻抗反推；角度關係未實測。
