# #559 家具決策紙第 9 條；defaults-proposal.md 第 1 節。
# 毫米存數字；cabinet_fields_m 換成既有 Cabinet 的五個公尺欄位。
# 聲學中心在箱體左右正中、前面板；明給中心高度，不用箱高一半。

[bookshelf]
width_mm = 210.0
body_height_mm = 355.0
depth_mm = 280.0
base_height_mm = 0.0
acoustic_center_above_bottom_mm = 205.0
acoustic_center_behind_front_mm = 0.0
acoustic_center_reference = "cabinet_bottom"
label = "代表模型，非實際型號"
[bookshelf.provenance]
status = "estimated"
source_kind = "manufacturer_median"
source = """
defaults-proposal.md 第 1.1–1.4 節：KEF、Arendal、Genelec、Neumann、Yamaha 5 家 12 款公開尺寸及中心高度的中位數取整。
中心中位數由 Neumann KH 150 197 mm https://www.neumann.com/en-us/products/monitors/kh-150 與
Arendal 1961 Monitor 212.5 mm https://arendalsound.com/guide/1961-monitor-tweeter-height/ 決定。
箱高中位數 Genelec 8341A 351 mm、KEF Q3 Meta 357.4 mm；箱寬 KEF Q3 Meta 與 Yamaha HS7 210 mm；
箱深 KEF Q1 Meta 277.3 mm、Genelec 8350A 278 mm https://assets.ctfassets.net/4zjnzn055a4v/36mzyVGYy9SqpeyArAz6A0/232dfdb6626c0f5ace62a64585c9a793/8350A_opman.pdf 。
"""
conditions = """
代表模型，非實際型號，沒有本專案實測。箱高中位數 354.2→355 mm、箱寬 210 mm、箱深 277.65→280 mm；
聲學中心離箱底中位數 204.75→205 mm，明示在前面板（往箱背距離 0）。
Cabinet width_m=210/1000、depth_m=280/1000、height_m=355/1000、acoustic_center_above_bottom_m=205/1000、acoustic_center_behind_front_m=0。
放桌面時發聲高度為桌面高加 0.205 m；放腳架時發聲高度由案子給，箱底在聲學中心下方 0.205 m。
樣本是肯公開中心高度的廠商；同軸圓心、高音中心與廠商聲學軸混用，以一個點代表隨頻率改變的中心。
"""

[floorstanding]
width_mm = 210.0
body_height_mm = 1060.0
depth_mm = 380.0
base_height_mm = 45.0
acoustic_center_above_bottom_mm = 800.0
acoustic_center_behind_front_mm = 0.0
