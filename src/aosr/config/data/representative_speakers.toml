label = "代表模型，非實際型號；資料只有 KEF 與 Arendal 兩家"
[floorstanding.provenance]
status = "estimated"
source_kind = "manufacturer_median"
source = """
defaults-proposal.md 第 1.1–1.4 節：KEF 4 款與 Arendal 3 款，共 7 款中位數取整。
聲學中心中位數 KEF R7／R11 Meta 離地 796.5 mm、底座中位數 46.5 mm；R7 尺寸圖
https://images.salsify.com/raw/upload/s--6DnQtVxn--/9dd55b939f0eed83c4b27b232bae9302159a96e6.zip 。
箱高中位數 KEF Q11 Meta 1061.4 mm、箱寬 KEF Q7／Q11 Meta 210.0 mm、箱深 Q11 Meta 380.3 mm；Q11 尺寸圖
https://images.salsify.com/raw/upload/s--VFx0o6fv--/71c1ad5b50261f4f65459f5b79b73d2625ca60a4.zip 。
"""
conditions = """
代表模型，非實際型號；資料只有 KEF 與 Arendal 兩家，沒有本專案實測。
箱體高度中位數 1061.4→1060 mm，加底座或腳釘中位數 46.5→45 mm，整體用 1105 mm 高的一個盒子表示。
底座外形不另建，碰撞底面仍用箱寬 210×箱深 380 mm，不用含底座外張的寬度；深 380.3→380 mm。
聲學中心離地中位數 796.5→800 mm；量高起點是含底座整體盒子的底面（地面），不是箱體底面，不能再加 45 mm。
Cabinet width_m=210/1000、depth_m=380/1000、height_m=(1060+45)/1000、acoustic_center_above_bottom_m=800/1000、acoustic_center_behind_front_m=0。
聲學中心明示在前面板；左右正中；公開高音高度樣本不代表市場分布，同軸中心與高音中心混用、一點代表。
"""
