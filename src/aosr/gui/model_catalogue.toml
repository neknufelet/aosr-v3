name = "薄板層"
code = "src/aosr/materials/construction_models.py::BoardLayer"
compute = ["src/aosr/materials/construction.py::_layer_matrix"]
params = ["BoardLayer.surface_mass_kg_m2", "BoardLayer.resistance_pa_s_m"]
