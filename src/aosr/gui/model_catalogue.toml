# 吸音模型目錄（#1343 追加）：aosr 實際在用的每一個吸音模型，給唯讀「所有參數」頁看。
# 住 gui 底下、不放 aosr/config/data：只有網頁在讀，放進 config 會動到計算指紋（calc-v1）。
#
# 一個模型一節 [[model]]：
# - code：程式裡的類別或函式（repo 根起算的「檔案::名字」）；variant：同一類別裡的模型選項（多孔層的 model 欄）。
# - params：用到的參數，寫成「類別.欄位」（類別在 aosr.materials.construction_models）；
#   中文名、單位、可填範圍一律由那個欄位的定義現讀，這裡不抄。
# - range：有效範圍。registry 指範圍登記簿 porous_model_ranges.toml 的哪一節（讀的時候現抓，這裡不寫數字）；
#   沒有出處的一律 note = "未列有效範圍"，不自己編。
# - citation：文獻引用。repo 裡沒寫的欄位（題名、期刊、DOI、年份）就不寫，頁面顯示「repo 未列」；
#   registry 指範圍登記簿那一節的 provenance，書目與 DOI 從那裡讀。
# - origin：程式從哪裡改寫來的（跟文獻引用分開）。
# - 每一個範圍、引用、來源都附 at = "檔案:行"（repo 根起算）與 mark（那一行一定含的字；引用的 mark 就是第一作者姓）。
#   考卷逐筆核：檔在、行在、那一行含 mark。

# ---- 多孔層（四種模型，構造裡 model 欄選；預設 komatsu）----

[[model]]
id = "porous_komatsu"
name = "多孔層：Komatsu 纖維經驗式（預設）"
code = "src/aosr/materials/construction_models.py::PorousLayer"
variant = "komatsu"
compute = ["src/aosr/materials/transfer_matrix.py::equivalent_fluid_model", "src/aosr/materials/transfer_matrix.py::porous_layer"]
params = ["PorousLayer.thickness_m", "PorousLayer.flow_resistivity_pa_s_m2", "PorousLayer.material_class"]
blurb = "棉類吸音材只靠流阻與厚度算出等效流體；流阻在手動試算範圍外拒收，低於樣品下限、頻率外推、泡棉照算但標註。"
range = { registry = "komatsu", at = "src/aosr/config/data/porous_model_ranges.toml:1", mark = "Komatsu" }
citation = { authors = ["Komatsu"], year = 2008, registry = "komatsu", at = "src/aosr/config/data/porous_model_ranges.toml:14" }
origin = { text = "改寫自 rinaldipp/tmm（MIT 授權）", at = "src/aosr/materials/transfer_matrix.py:3", mark = "rinaldipp/tmm" }

[[model]]
id = "porous_miki"
name = "多孔層：Miki 纖維經驗式"
code = "src/aosr/materials/construction_models.py::PorousLayer"
variant = "miki"
compute = ["src/aosr/materials/transfer_matrix.py::equivalent_fluid_model", "src/aosr/materials/transfer_matrix.py::porous_layer"]
params = ["PorousLayer.thickness_m", "PorousLayer.flow_resistivity_pa_s_m2", "PorousLayer.material_class"]
blurb = "棉類經驗式，只靠流阻與厚度；可選、不當預設。"
range = { note = "未列有效範圍", at = "src/aosr/materials/construction.py:6", mark = "Miki" }
citation = { authors = ["Miki"], at = "src/aosr/materials/construction.py:6" }
origin = { text = "改寫自 rinaldipp/tmm（MIT 授權）", at = "src/aosr/materials/transfer_matrix.py:3", mark = "rinaldipp/tmm" }

[[model]]
id = "porous_wilson_2015"
name = "多孔層：Wilson 鬆弛模型"
code = "src/aosr/materials/construction_models.py::PorousLayer"
variant = "wilson_2015"
compute = ["src/aosr/materials/transfer_matrix.py::equivalent_fluid_model", "src/aosr/materials/transfer_matrix.py::porous_layer"]
params = ["PorousLayer.thickness_m", "PorousLayer.flow_resistivity_pa_s_m2", "PorousLayer.porosity", "PorousLayer.tortuosity", "PorousLayer.material_class"]
blurb = "除了流阻還要孔隙率與曲折度的鬆弛式；可選、不當預設。"
range = { note = "未列有效範圍", at = "src/aosr/materials/construction.py:6", mark = "Wilson 2015" }
citation = { authors = ["Wilson"], year = 2015, at = "src/aosr/materials/construction.py:6" }
origin = { text = "改寫自 rinaldipp/tmm（MIT 授權）", at = "src/aosr/materials/transfer_matrix.py:3", mark = "rinaldipp/tmm" }

[[model]]
id = "porous_mechel_1976"
name = "多孔層：Mechel 低頻延伸式"
code = "src/aosr/materials/construction_models.py::PorousLayer"
variant = "mechel_1976"
compute = ["src/aosr/materials/transfer_matrix.py::equivalent_fluid_model", "src/aosr/materials/transfer_matrix.py::porous_layer"]
params = ["PorousLayer.thickness_m", "PorousLayer.flow_resistivity_pa_s_m2", "PorousLayer.porosity", "PorousLayer.material_class"]
blurb = "經驗式加低頻延伸，要孔隙率，而且孔隙率不大於一（這條不在欄位定義裡，見 construction_models.py 第 5 行）；在分界處會跳一階，梯度不可靠，可選、不當預設。"
range = { note = "未列有效範圍", at = "src/aosr/materials/construction.py:6", mark = "Mechel 1976" }
citation = { authors = ["Mechel"], year = 1976, at = "src/aosr/materials/construction.py:6" }
origin = { text = "改寫自 rinaldipp/tmm（MIT 授權）", at = "src/aosr/materials/transfer_matrix.py:3", mark = "rinaldipp/tmm" }

