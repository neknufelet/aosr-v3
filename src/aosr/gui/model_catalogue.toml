          "PorousLayer.frame_loss_factor", "PorousLayer.thickness_m"]
blurb = "多孔層整面黏在薄板後、背後是牆：骨架當彈簧串在板後；板當活塞，不算板彎曲與邊緣進聲。"
range = { note = "未列有效範圍" }
origin = { text = "aosr 自己的式子（#1171）", at = "src/aosr/materials/construction.py:154", mark = "VPR" }

