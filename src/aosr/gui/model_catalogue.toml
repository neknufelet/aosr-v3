name = "布層"
code = "src/aosr/materials/construction_models.py::FabricLayer"
compute = ["src/aosr/materials/transfer_matrix.py::porous_facing_layer"]
params = ["FabricLayer.surface_mass_kg_m2", "FabricLayer.flow_resistance_pa_s_m"]
blurb = "布的質量與面流阻並聯（算法 pieren_free），只收兩格。"
range = { note = "未列有效範圍" }
citation = { authors = ["Pieren"], at = "src/aosr/materials/transfer_matrix.py:430" }
origin = { text = "改寫自 rinaldipp/tmm（MIT 授權）", at = "src/aosr/materials/transfer_matrix.py:3", mark = "rinaldipp/tmm" }

[[model]]
id = "micro_perforated"
name = "微孔板"
code = "src/aosr/materials/construction_models.py::MicroPerforatedLayer"
compute = ["src/aosr/materials/transfer_matrix.py::perforated_panel_layer"]
params = ["MicroPerforatedLayer.thickness_m", "MicroPerforatedLayer.hole_diameter_m", "MicroPerforatedLayer.open_area",
          "MicroPerforatedLayer.hole_spacing_m", "MicroPerforatedLayer.hole_pattern", "MicroPerforatedLayer.hole_spacing_2_m",
          "MicroPerforatedLayer.surface_mass_kg_m2"]
blurb = "微穿孔薄片（算法 barrier_mpp，自帶修正），板質量並聯；不收背面貼布。跟一般圓孔板照孔徑分界、由人選，界線見孔徑欄。"
range = { note = "未列有效範圍" }
related = ["maa_1998"]
origin = { text = "改寫自 rinaldipp/tmm（MIT 授權）", at = "src/aosr/materials/transfer_matrix.py:3", mark = "rinaldipp/tmm" }

[[model]]
id = "perforated"
name = "一般圓孔板"
code = "src/aosr/materials/construction_models.py::PerforatedLayer"
compute = ["src/aosr/materials/transfer_matrix.py::perforated_panel_layer"]
params = ["PerforatedLayer.thickness_m", "PerforatedLayer.hole_diameter_m", "PerforatedLayer.open_area",
          "PerforatedLayer.hole_spacing_m", "PerforatedLayer.hole_pattern", "PerforatedLayer.hole_spacing_2_m",
          "PerforatedLayer.surface_mass_kg_m2"]
blurb = "集中孔道薄片（算法 barrier）加末端修正 jb，板質量並聯；可選背面貼布。跟微孔板照孔徑分界、由人選，界線見孔徑欄。"
range = { note = "未列有效範圍" }
related = ["ingard_1953"]
origin = { text = "改寫自 rinaldipp/tmm（MIT 授權）", at = "src/aosr/materials/transfer_matrix.py:3", mark = "rinaldipp/tmm" }

[[model]]
id = "slotted"
name = "長縫板"
code = "src/aosr/materials/construction_models.py::SlottedLayer"
compute = ["src/aosr/materials/transfer_matrix.py::slotted_panel_layer"]
params = ["SlottedLayer.thickness_m", "SlottedLayer.slot_width_m", "SlottedLayer.open_area", "SlottedLayer.slot_spacing_m",
          "SlottedLayer.surface_mass_kg_m2"]
blurb = "假設縫無限長、週期排列（算法 barrier）；有限長木條沒驗過。可選背面貼布。"
range = { note = "未列有效範圍" }
related = ["kristiansen_vigran_1994"]
origin = { text = "改寫自 rinaldipp/tmm（MIT 授權）", at = "src/aosr/materials/transfer_matrix.py:3", mark = "rinaldipp/tmm" }

[[model]]
id = "backing_fabric"
name = "背面貼布（圓孔板、長縫板選填）"
code = "src/aosr/materials/construction_models.py::_BackingFabric"
compute = ["src/aosr/materials/construction.py::_backed_sheet"]
params = ["PerforatedLayer.backing_fabric_surface_mass_kg_m2", "PerforatedLayer.backing_fabric_flow_resistance_pa_s_m"]
blurb = "工程近似：板阻抗加布面流阻除板開孔率，布當不會動，面密度只記錄；沒有一手出處。"
range = { note = "未列有效範圍" }
origin = { text = "aosr 自己的工程近似，沒有一手出處", at = "src/aosr/materials/construction_models.py:232", mark = "沒有一手出處" }

[[model]]
id = "vpr"
name = "VPR：薄板＋骨架彈簧"
code = "src/aosr/materials/construction.py::_frame_spring"
compute = ["src/aosr/materials/construction.py::_frame_spring"]
