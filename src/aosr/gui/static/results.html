<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>房間計算結果</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/vendor/uplot/uPlot.min.css">
  <script src="/static/vendor/uplot/uPlot.iife.min.js" defer></script>
  <script src="/static/results.js" defer></script>
</head>
<body>
  <main>
    <header><h1>房間計算結果</h1><p><a href="/">返回方案輸入</a></p><p id="identity"></p></header>
    <section id="rejection" hidden><h2>結果被拒收</h2><p id="reject-reason"></p>
      <button id="rerun">用現在的引擎重算</button><p id="rerun-state"></p></section>
    <div id="content" hidden>
      <section><h2>頻響</h2><p>每條曲線只是一支喇叭在一個位置的結果；沒有兩支加總。</p>
        <div id="speaker-buttons" class="actions"></div><div id="chart"></div>
        <p id="chart-note"></p></section>
      <section><h2>聆聽區逐點</h2><p id="listening-scope"></p>
        <p>選一個周圍位置，頻響圖會疊上它與主位；也可選兩個周圍點。</p>
        <div id="pair-buttons" class="actions"></div><div id="pair-detail"></div>
        <h3>每組平均差與最差位置對</h3><div id="summary"></div></section>
      <section><h2>各類結果</h2><div id="categories"></div></section>
      <section><h2>警戒</h2><div id="alerts"></div></section>
      <section><h2>殘響</h2><p id="reverb-note"></p><div id="reverb"></div></section>
      <section><h2>反射</h2><div id="reflections"></div></section>
    </div>
  </main>
</body>
</html>
