<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>兩份方案比較</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/vendor/uplot/uPlot.min.css">
  <link rel="stylesheet" href="/static/compare.css">
  <script src="/static/vendor/uplot/uPlot.iife.min.js" defer></script>
  <script src="/static/plan.js" defer></script>
  <script src="/static/compare.js" defer></script>
</head>
<body>
  <main>
    <header><h1>兩份方案比較</h1><p><a href="/">返回方案輸入</a></p><p id="server-notice" class="notice" hidden></p>
      <p id="identity-a"></p><p id="identity-b"></p></header>
    <p id="loading">正在讀取並核對兩份結果…</p>
    <section id="rejection" hidden><h2 id="rejection-title">比較讀取失敗</h2><div id="reject-reason"></div>
      <div id="rerun-holder"></div><p id="rerun-state"></p></section>
    <div id="content" hidden>
      <div id="compare-top">
        <section id="compare-summary"><h2>摘要</h2><p id="summary-text"></p>
          <p id="table-reason"></p>
          <div id="totals"><p id="table-a"></p><p id="table-b"></p></div>
          <p id="table-verdict"></p><p id="pending-text"></p>
          <p id="table-calibration"></p></section>
        <section id="compare-changes"><h2>改了哪裡</h2><div id="changes"></div>
          <h3>座位與聲道設定核對</h3><div id="fingerprints"></div></section>
      </div>
      <section id="compare-chart"><h2>頻響疊圖</h2>
        <div class="switch-row"><span class="switch-label">聲道</span>
          <div id="channel-buttons" class="actions" role="group" aria-label="聲道"></div></div>
        <div class="switch-row"><span class="switch-label">位置</span>
          <div id="position-buttons" class="actions" role="group" aria-label="位置"></div></div>
        <div id="chart"></div>
        <div id="compare-exports" class="actions"><button id="download-png" type="button">下載曲線圖片（PNG）</button>
          <a id="download-curves">下載頻響資料（CSV）</a>
          <a id="download-summary">下載摘要與分項（CSV）</a></div>
        <p>A 是實線、B 是虛線。<span id="level-note"></span></p></section>
      <section><h2>位置並排</h2><div class="drawings compare-drawings">
        <div><h3>A 平面圖</h3><svg id="plan-a-xy" viewBox="0 0 600 400" role="img" aria-label="A 平面圖"></svg></div>
        <div><h3>B 平面圖</h3><svg id="plan-b-xy" viewBox="0 0 600 400" role="img" aria-label="B 平面圖"></svg></div>
        <div><h3>A 側面圖</h3><svg id="plan-a-xz" viewBox="0 0 600 400" role="img" aria-label="A 側面圖"></svg></div>
        <div><h3>B 側面圖</h3><svg id="plan-b-xz" viewBox="0 0 600 400" role="img" aria-label="B 側面圖"></svg></div>
      </div><p>有外框的那一格裡有兩份不一樣的喇叭或座位（位置、角色或方向不同，或只有一份有）；投影重疊的點會併成一格，點一下看明細是哪一點。</p>
      <div class="drawings compare-drawings">
        <div><h3>A 的喇叭與座位</h3><p id="plan-a-detail" aria-live="polite"></p><ul id="plan-a-legend"></ul></div>
        <div><h3>B 的喇叭與座位</h3><p id="plan-b-detail" aria-live="polite"></p><ul id="plan-b-legend"></ul></div>
      </div></section>
      <section><h2>各類結果並列</h2><p>每一類的代價都是越低越好；兩份印出來的代價一樣就寫「相同」。</p>
        <div id="categories"></div></section>
      <section><h2>說明</h2><div id="notes"></div></section>
    </div>
  </main>
</body>
</html>
